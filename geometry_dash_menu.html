<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b900c2">
<title>Geometry Dash — Menu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Russo+One&display=swap');
:root{
  --pink:#b800bd; --pink2:#d500d3; --pink-line:#e900db;
  --green:#8bea18; --green2:#4ec500; --ink:#171019;
  --yellow:#ffdc00; --white:#fff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;margin:0;overflow:hidden;}
body{font-family:'Lilita One','Russo One',Impact,sans-serif;background:var(--pink);color:#fff;}
button{font:inherit;color:inherit;border:0;cursor:pointer;}
.scene{
  position:relative;isolation:isolate;width:100%;height:100%;height:100svh;min-height:500px;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 38%,rgba(255,0,224,.30),transparent 58%),
    linear-gradient(135deg,#a900b2 0%,#c500c8 48%,#a900af 100%);
}
/* Large embossed square panels, like the original menu */
.wall-pattern{position:absolute;inset:-3%;z-index:-1;opacity:.9;
  background-image:
    linear-gradient(90deg,transparent 0 97%,rgba(244,0,224,.65) 97% 100%),
    linear-gradient(0deg,transparent 0 97%,rgba(244,0,224,.65) 97% 100%),
    linear-gradient(90deg,transparent 0 99%,rgba(95,0,105,.24) 99% 100%),
    linear-gradient(0deg,transparent 0 99%,rgba(95,0,105,.24) 99% 100%);
  background-size: min(32vw,430px) min(25vh,300px),min(32vw,430px) min(25vh,300px),min(32vw,430px) min(25vh,300px),min(32vw,430px) min(25vh,300px);
  background-position:0 0,0 0,5px 5px,5px 5px;
  filter:drop-shadow(0 3px 1px rgba(60,0,70,.3));
}
.wall-pattern:after{content:"";position:absolute;inset:0;opacity:.35;
 background:repeating-linear-gradient(90deg,transparent 0 48%,#f000dc 49%,#f000dc 50%,transparent 51% 100%);
 background-size: min(53vw,700px) 100%;}
.floor-line{position:absolute;left:0;right:0;bottom:27.2%;height:8px;background:#ed00dc;box-shadow:0 5px 0 rgba(80,0,85,.7),0 -2px 5px rgba(255,0,224,.35);}
.ground{position:absolute;left:0;right:0;bottom:0;height:27.2%;background:linear-gradient(180deg,rgba(93,0,100,.24),rgba(67,0,75,.40));border-top:5px solid #e300d5;}
/* Top controls and title */
.close-btn{position:absolute;top:clamp(12px,2.2vh,25px);left:clamp(12px,2vw,30px);width:clamp(48px,5.4vw,78px);aspect-ratio:1;border-radius:50%;
 background:linear-gradient(145deg,#aaff39,#59ce00);border:5px solid #fff;outline:3px solid var(--ink);box-shadow:0 5px 0 #242024,0 8px 8px #0005;display:grid;place-items:center;z-index:5;}
.close-btn svg{width:72%;height:72%;filter:drop-shadow(1px 2px #222);}
.logo{position:absolute;top:8.5%;left:50%;transform:translateX(-50%);width:95%;text-align:center;white-space:nowrap;
 font-size:clamp(34px,6.4vw,91px);letter-spacing:-.035em;line-height:1;color:#a5ff37;
 -webkit-text-stroke:clamp(1.5px,.28vw,4px) #171019;paint-order:stroke fill;
 text-shadow:2px 3px 0 #fff,4px 7px 0 #252025,7px 11px 0 rgba(20,0,25,.65);
 filter:drop-shadow(0 3px 1px #45004b);}
/* Main menu buttons */
.main-menu{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(92%,900px);display:flex;align-items:center;justify-content:center;gap:clamp(25px,5vw,78px);}
.game-button{position:relative;flex:0 0 auto;width:clamp(88px,10.7vw,158px);aspect-ratio:1;border-radius:19%;
 background:linear-gradient(145deg,#a9ff32 0%,#74e400 55%,#4dbe00 100%);
 border:6px solid #fff;outline:5px solid #171019;
 box-shadow:0 7px 0 #265600,0 12px 0 #171019,0 17px 12px #0005,inset 0 3px 0 #e7ffc3;
 display:grid;place-items:center;transition:transform .12s,filter .12s;}
.game-button:before{content:"";position:absolute;inset:-12px;border:5px solid #171019;border-radius:23%;z-index:-1;}
.game-button:hover{filter:brightness(1.12);transform:translateY(-4px);}
.game-button:active{transform:translateY(5px);box-shadow:0 2px 0 #265600,0 5px 0 #171019;}
.game-button svg{width:77%;height:77%;overflow:visible;}
.game-button.play{width:clamp(126px,15.4vw,226px);border-radius:17%;z-index:1;}
.game-button.play:before{inset:-14px;border-radius:21%;}
.game-button.play svg{width:78%;height:78%;}
/* Side items */
.profile{position:absolute;left:3.2%;top:54.5%;display:flex;align-items:center;flex-direction:column;gap:8px;cursor:pointer;}
.player-name,.side-label{font-size:clamp(17px,2.2vw,31px);color:#ffe500;-webkit-text-stroke:1.5px #251000;text-shadow:2px 3px 0 #171019;letter-spacing:.02em;}
.avatar{width:clamp(82px,9vw,130px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(145deg,#18ddff,#0873d9);border:6px solid #fff;outline:4px solid #171019;box-shadow:0 6px 0 #272027,0 10px 10px #0004;position:relative;}
.avatar svg{width:76%;height:76%;}
.daily{position:absolute;right:3.4%;top:52.5%;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.daily-icon{width:clamp(62px,7vw,100px);height:auto;filter:drop-shadow(3px 5px 0 #21151e);}
.daily .side-label{font-size:clamp(17px,2vw,27px);}
/* Social buttons and RobTop */
.socials{position:absolute;left:2.2%;bottom:12.5%;display:flex;gap:clamp(8px,1.2vw,17px);}
.social{width:clamp(39px,4.3vw,63px);aspect-ratio:1;border:4px solid #fff;outline:3px solid #171019;border-radius:17%;display:grid;place-items:center;box-shadow:0 4px 0 #242024;}
.social svg{width:70%;height:70%;}
.social.fb{background:#2679d9}.social.tw{background:#16bce9}.social.yt{background:#f02e29}
.robtop{position:absolute;left:2.1%;bottom:3.1%;font-size:clamp(24px,3vw,43px);color:#ffae00;-webkit-text-stroke:2px #261000;text-shadow:3px 4px 0 #171019;}
.more-games{position:absolute;right:2.1%;bottom:5.6%;font-size:clamp(23px,3.2vw,44px);line-height:.92;text-align:center;color:#ffeb00;-webkit-text-stroke:2px #241000;text-shadow:3px 4px 0 #171019;cursor:pointer;}
/* Bottom round buttons */
.bottom-menu{position:absolute;left:50%;bottom:7.2%;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(11px,2vw,29px);}
.round-button{width:clamp(76px,8vw,119px);aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#aaff32,#51c900);border:6px solid #fff;outline:4px solid #171019;
 box-shadow:0 6px 0 #292329,0 10px 9px #0005,inset 0 2px 0 #eaffcc;display:grid;place-items:center;transition:transform .12s,filter .12s;}
.round-button svg{width:67%;height:67%;filter:drop-shadow(2px 3px 0 #30252d);}
.round-button:hover{transform:translateY(-4px);filter:brightness(1.12)}
.round-button:active{transform:translateY(3px)}
/* Little animated cube running along the floor */
.runner{position:absolute;bottom:27.8%;left:-50px;width:24px;height:24px;background:linear-gradient(145deg,#aaff32,#50c900);border:3px solid #171019;box-shadow:0 0 0 2px #fff,0 4px 0 #171019;transform:rotate(10deg);animation:run 12s linear infinite;}
.runner:before,.runner:after{content:"";position:absolute;width:4px;height:4px;background:#111;top:5px;}
.runner:before{left:4px}.runner:after{right:4px}
@keyframes run{0%{left:-40px}100%{left:calc(100% + 40px)}}
/* Popup */
.popup{position:absolute;inset:0;z-index:20;background:rgba(15,0,18,.72);display:none;align-items:center;justify-content:center;padding:20px;}
.popup.open{display:flex;}
.popup-card{width:min(440px,92vw);min-height:210px;padding:30px 24px 24px;text-align:center;border-radius:22px;background:linear-gradient(145deg,#aaff35,#50c700);border:7px solid #fff;outline:5px solid #171019;box-shadow:0 12px 0 #211a22;color:#fff;text-shadow:2px 3px #26321a;}
.popup-card h2{font-size:clamp(25px,5vw,36px);margin:4px 0 24px;}
.popup-card p{font-family:Arial,sans-serif;font-size:15px;color:#173000;text-shadow:none;margin:0 0 22px;}
.popup-card button{padding:10px 32px;border-radius:12px;background:linear-gradient(#ffe800,#ffad00);border:4px solid #fff;outline:3px solid #171019;color:#fff;font-size:20px;text-shadow:1px 2px #5a3500;}
/* Portrait phones */
@media (max-aspect-ratio: 4/5){
 .scene{min-height:560px;}
 .wall-pattern{background-size: min(52vw,360px) min(19vh,260px),min(52vw,360px) min(19vh,260px),min(52vw,360px) min(19vh,260px),min(52vw,360px) min(19vh,260px);}
 .logo{top:11.5%;font-size:clamp(34px,8.8vw,61px);width:96%;letter-spacing:-.045em;text-shadow:2px 3px 0 #fff,3px 6px 0 #252025,5px 9px 0 #26002b;}
 .close-btn{width:clamp(47px,11vw,65px);top:2.5%;left:2.5%;}
 .main-menu{top:43%;gap:clamp(19px,4.4vw,33px);width:96%;}
 .game-button{width:clamp(78px,18vw,112px);border-width:5px;outline-width:4px;border-radius:18%;box-shadow:0 5px 0 #265600,0 9px 0 #171019,0 12px 8px #0005;}
 .game-button:before{inset:-9px;border-width:4px;}
 .game-button.play{width:clamp(112px,25vw,156px);}
 .game-button.play:before{inset:-10px;}
 .profile{top:62%;left:3.5%;gap:5px;}
 .player-name,.side-label{font-size:clamp(16px,4vw,23px);-webkit-text-stroke:1px #251000;}
 .avatar{width:clamp(76px,18vw,105px);border-width:5px;outline-width:3px;}
 .daily{top:61.5%;right:4%;gap:1px;}
 .daily-icon{width:clamp(58px,14vw,83px);}
 .daily .side-label{font-size:clamp(16px,4vw,22px);}
 .socials{left:3%;bottom:18.5%;gap:9px;}
 .social{width:clamp(37px,9vw,53px);border-width:3px;outline-width:2px;}
 .robtop{left:2.5%;bottom:11.2%;font-size:clamp(22px,5.5vw,30px);}
 .more-games{right:2.5%;bottom:11%;font-size:clamp(21px,5.5vw,30px);}
 .bottom-menu{bottom:5.5%;gap:clamp(9px,2vw,15px);}
 .round-button{width:clamp(67px,17vw,95px);border-width:5px;outline-width:3px;box-shadow:0 5px 0 #292329,0 8px 7px #0005;}
 .floor-line,.ground{bottom:27.2%;}
 .runner{bottom:27.8%;}
}
@media (max-height:620px) and (min-aspect-ratio: 4/5){
 .logo{top:5%;font-size:clamp(34px,6vw,65px)}
 .main-menu{top:47%}.profile{top:53%}.daily{top:50%}
 .bottom-menu{bottom:3%}.socials{bottom:10%}.robtop{bottom:1%}.more-games{bottom:3%}
}
</style>
</head>
<body>
<div class="scene">
  <div class="wall-pattern"></div>
  <div class="ground"></div><div class="floor-line"></div>

  <button class="close-btn" aria-label="Закрыть" onclick="openPopup('Выход')">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M28 25L75 74M75 25L28 74" fill="none" stroke="#ffdc00" stroke-width="13" stroke-linecap="square"/><path d="M28 25L75 74M75 25L28 74" fill="none" stroke="#171019" stroke-width="5"/></svg>
  </button>

  <div class="logo">GEOMETRY DASH</div>

  <main class="main-menu" aria-label="Главное меню">
    <button class="game-button" aria-label="Иконки" onclick="openPopup('Иконки')">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M12 12H88V88H12Z" fill="#87ed19" stroke="#173800" stroke-width="5"/>
        <path d="M20 24H42V47H20Z M58 24H80V47H58Z" fill="#ffe500" stroke="#171019" stroke-width="4"/>
        <path d="M20 61H80V76H20Z" fill="#ffcf00" stroke="#171019" stroke-width="4"/>
      </svg>
    </button>

    <button class="game-button play" aria-label="Играть" onclick="openPopup('Играть')">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M29 10Q22 6 22 18V82Q22 94 34 87L85 57Q96 50 85 43Z" fill="#ffe500" stroke="#171019" stroke-width="6" stroke-linejoin="round"/>
        <path d="M30 17L30 81" stroke="#fff36b" stroke-width="3" opacity=".8"/>
      </svg>
    </button>

    <button class="game-button" aria-label="Редактор уровней" onclick="openPopup('Редактор уровней')">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="#171019" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 76L73 23M61 18L82 39M15 68L32 85"/>
          <path d="M44 59L72 87M63 63L86 40"/>
        </g>
        <g fill="none" stroke="#ffdf00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 76L73 23M61 18L82 39M15 68L32 85M44 59L72 87M63 63L86 40"/>
        </g>
      </svg>
    </button>
  </main>

  <div class="profile" onclick="openPopup('Профиль')" role="button" tabindex="0">
    <div class="player-name">QXLF</div>
    <div class="avatar">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="29" r="21" fill="#ffcc25" stroke="#754000" stroke-width="4"/>
        <path d="M13 86Q13 54 50 54Q87 54 87 86Z" fill="#ffcc25" stroke="#754000" stroke-width="4"/>
      </svg>
    </div>
  </div>

  <div class="daily" onclick="openPopup('Daily Chest')" role="button" tabindex="0">
    <svg class="daily-icon" viewBox="0 0 100 110" aria-hidden="true">
      <path d="M15 39L85 39V91L50 105L15 91Z" fill="#e88b00" stroke="#23151c" stroke-width="5"/>
      <path d="M15 39L50 52L85 39V91L50 105V52Z" fill="#ffb21c" stroke="#23151c" stroke-width="4"/>
      <path d="M15 39L25 17L75 17L85 39Z" fill="#ff3535" stroke="#23151c" stroke-width="5"/>
      <path d="M25 17Q17 2 30 7Q41 10 39 21M48 17Q41 1 54 4Q66 8 62 22M69 18Q66 2 79 8Q88 14 78 25" fill="#ff4545" stroke="#23151c" stroke-width="4"/>
      <path d="M45 55H56V74H45Z" fill="#ffe34a" stroke="#7b3d00" stroke-width="3"/>
      <path d="M15 39L50 52L85 39" fill="none" stroke="#ffe05a" stroke-width="4"/>
    </svg>
    <div class="side-label">DAILY</div>
  </div>

  <div class="socials">
    <button class="social fb" aria-label="Facebook" onclick="openPopup('Facebook')"><svg viewBox="0 0 40 40"><path fill="white" d="M23 35V22h5l1-6h-6v-3c0-2 1-3 3-3h3V5h-5c-6 0-8 3-8 8v3h-4v6h4v13z"/></svg></button>
    <button class="social tw" aria-label="Twitter" onclick="openPopup('Сообщество')"><svg viewBox="0 0 40 40"><path fill="white" d="M20 34S4 25 4 14c0-8 10-11 16-3 6-8 16-5 16 3 0 11-16 20-16 20z"/></svg></button>
    <button class="social yt" aria-label="YouTube" onclick="openPopup('YouTube')"><svg viewBox="0 0 40 40"><rect x="3" y="8" width="34" height="24" rx="7" fill="white"/><path d="M17 14L28 20L17 26Z" fill="#ed2828"/></svg></button>
  </div>

  <div class="robtop">RobTop</div>
  <div class="more-games" onclick="openPopup('More Games')">MORE<br>GAMES</div>

  <div class="bottom-menu">
    <button class="round-button" aria-label="Достижения" onclick="openPopup('Достижения')">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M27 14H73V47Q73 71 50 76Q27 71 27 47Z" fill="#ffce00" stroke="#3b2c00" stroke-width="6"/><path d="M27 25H12V43Q12 57 32 59M73 25H88V43Q88 57 68 59" fill="none" stroke="#3b2c00" stroke-width="7"/><path d="M43 76V87H57V76M35 91H65" fill="none" stroke="#3b2c00" stroke-width="7"/></svg>
    </button>
    <button class="round-button" aria-label="Настройки" onclick="openPopup('Настройки')">
      <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#ffcc00" stroke="#392900" stroke-width="5"><path d="M43 7H57L61 18L72 23L83 18L91 30L83 40L86 51L96 58L91 72L78 72L69 81L69 94H53L47 83L36 80L25 86L15 75L22 64L19 53L8 46L14 32L27 33L36 24Z"/><circle cx="52" cy="51" r="23" fill="#69d91a"/></g></svg>
    </button>
    <button class="round-button" aria-label="Статистика" onclick="openPopup('Статистика')">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M12 57H31V86H12ZM40 35H59V86H40ZM68 12H87V86H68Z" fill="#ffce00" stroke="#382900" stroke-width="5"/></svg>
    </button>
    <button class="round-button" aria-label="Музыка" onclick="openPopup('Музыка')">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M54 16L88 8V65" fill="none" stroke="#302500" stroke-width="9" stroke-linecap="round"/><path d="M54 16V69" fill="none" stroke="#302500" stroke-width="9"/><ellipse cx="39" cy="76" rx="17" ry="12" fill="#ffcf00" stroke="#302500" stroke-width="5"/><ellipse cx="72" cy="66" rx="17" ry="12" fill="#ffcf00" stroke="#302500" stroke-width="5"/></svg>
    </button>
  </div>

  <div class="runner" aria-hidden="true"></div>

  <div class="popup" id="popup" onclick="overlayClick(event)">
    <div class="popup-card">
      <h2 id="popup-title">Меню</h2>
      <p>Этот раздел добавим на следующем этапе.</p>
      <button onclick="closePopup()">OK</button>
    </div>
  </div>
</div>
<script>
const popup=document.getElementById('popup');
function openPopup(title){document.getElementById('popup-title').textContent=title;popup.classList.add('open');}
function closePopup(){popup.classList.remove('open');}
function overlayClick(event){if(event.target===popup)closePopup();}
document.addEventListener('keydown',event=>{if(event.key==='Escape')closePopup();});
</script>
</body>
</html>
