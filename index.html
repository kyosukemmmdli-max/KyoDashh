<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KYO DASH</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d20;color:#fff;font-family:Arial,sans-serif;touch-action:none}#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;gap:10px}canvas{display:block;width:100%;max-width:900px;height:auto;max-height:72vh;border:2px solid #263b79;border-radius:12px;background:#101b42;box-shadow:0 0 25px #163fc855;touch-action:none}#hud{width:100%;max-width:900px;display:flex;justify-content:space-between;gap:8px;font-size:14px;color:#bfeaff}#tip{font-size:12px;color:#8ea6da;text-align:center}button{background:#28d9ff;color:#081126;border:0;border-radius:12px;font-size:18px;font-weight:800;padding:13px 26px}#overlay{position:fixed;inset:0;background:#06091bdc;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}#panel{width:min(90vw,430px);padding:28px 20px;border:1px solid #2f71be;border-radius:20px;background:linear-gradient(145deg,#142454,#0b1028);box-shadow:0 0 35px #00c8ff25}h1{font-size:clamp(34px,9vw,58px);margin:0 0 8px;color:#42e6ff;letter-spacing:3px;text-shadow:0 0 20px #00bfff}p{color:#bed0ff;line-height:1.5}#small{font-size:12px;color:#7f97ca;margin-top:12px}.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
 <div id="hud"><span id="score">ПРОГРЕСС 0%</span><span id="best">РЕКОРД 0%</span></div>
 <canvas id="game" width="900" height="420" aria-label="KYO DASH"></canvas>
 <div id="tip">ТАП — ПРЫЖОК · УДЕРЖИВАЙ — АВТОПРЫЖКИ</div>
</div>
<div id="overlay"><div id="panel"><h1>KYO DASH</h1><p>Прыгай через шипы и доберись до финиша!</p><button id="start">ИГРАТЬ</button><div id="small">Коснись экрана, чтобы прыгнуть</div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let best=0;try{best=Number(localStorage.getItem('kyoDashBest')||0)}catch(e){}bestEl.textContent='РЕКОРД '+best+'%';
const W=900,H=420,ground=330,player={x:145,y:ground-34,size:34,vy:0,angle:0,onGround:true};
let running=false,dead=false,finished=false,held=false,started=false,world=0,progress=0,last=0,raf=0;
const speed=270,gravity=1700,jump=-610,levelLength=6600;
let obstacles=[];
function makeLevel(){obstacles=[];let x=580;while(x<levelLength-220){let gap=245+Math.random()*100; x+=gap;obstacles.push({x,w:36,h:36,type:'spike'});if(Math.random()<.2)obstacles.push({x:x+48,w:36,h:36,type:'spike'});if(Math.random()<.12)obstacles.push({x:x+120,w:36,h:36,type:'block'});}obstacles.push({x:levelLength-160,w:45,h:70,type:'finish'});}
function reset(){world=0;progress=0;dead=false;finished=false;held=false;player.y=ground-player.size;player.vy=0;player.angle=0;player.onGround=true;makeLevel();scoreEl.textContent='ПРОГРЕСС 0%';}
function start(){reset();running=true;overlay.classList.add('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function jumpNow(){if(!running)return;if(player.onGround&&!dead&&!finished){player.vy=jump;player.onGround=false;}}
function die(){if(dead||finished)return;dead=true;running=false;overlay.classList.remove('hidden');document.querySelector('#panel h1').textContent='УПС!';document.querySelector('#panel p').textContent='Прогресс: '+progress+'%. Попробуй ещё раз!';startBtn.textContent='ЕЩЁ РАЗ';}
function win(){finished=true;running=false;progress=100;scoreEl.textContent='ПРОГРЕСС 100%';overlay.classList.remove('hidden');document.querySelector('#panel h1').textContent='УРОВЕНЬ ПРОЙДЕН!';document.querySelector('#panel p').textContent='Отлично! Ты прошёл KYO DASH.';startBtn.textContent='ИГРАТЬ СНОВА';}
function update(dt){if(!running)return;world+=speed*dt;player.vy+=gravity*dt;player.y+=player.vy*dt;if(player.y>=ground-player.size){player.y=ground-player.size;player.vy=0;player.onGround=true;player.angle=Math.round(player.angle/(Math.PI/2))*(Math.PI/2);if(held)jumpNow();}else{player.onGround=false;player.angle+=Math.sign(player.vy||1)*dt*5.2;}
progress=Math.min(99,Math.floor(world/(levelLength-160)*100));scoreEl.textContent='ПРОГРЕСС '+progress+'%';if(progress>best){best=progress;bestEl.textContent='РЕКОРД '+best+'%';try{localStorage.setItem('kyoDashBest',String(best))}catch(e){}}
const px=player.x,py=player.y,s=player.size;for(const o of obstacles){const ox=o.x-world;if(ox>px+100||ox+o.w<px-100)continue;if(o.type==='finish'&&ox<px+s){win();return;}if(o.type==='spike'){const left=ox+7,right=ox+o.w-7,top=ground-o.h+10;const cx=px+s*.5,cy=py+s*.5;if(cx>left&&cx<right&&cy+s*.28>top&&py+s-3>ground-o.h+4){die();return;}}else if(o.type==='block'){if(px+s>ox+4&&px<ox+o.w-4&&py+s>ground-o.h+3){die();return;}}}
if(held&&player.onGround)jumpNow();}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#111b45');bg.addColorStop(1,'#091126');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#263c78';ctx.lineWidth=1;const offset=-(world*.35%45);for(let x=offset;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ground);ctx.stroke();}for(let y=25;y<ground;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
ctx.fillStyle='#172957';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#2fe4ff';ctx.fillRect(0,ground,W,4);for(let x=-(world%50);x<W;x+=50){ctx.fillStyle='#25447e';ctx.fillRect(x,ground+15,25,4);}
for(const o of obstacles){const x=o.x-world;if(x<-70||x>W+70)continue;if(o.type==='spike'){ctx.fillStyle='#ff3e82';ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+o.w/2,ground-o.h);ctx.lineTo(x+o.w,ground);ctx.closePath();ctx.fill();ctx.strokeStyle='#ff9bbc';ctx.lineWidth=2;ctx.stroke();}else if(o.type==='block'){ctx.fillStyle='#8a4dff';ctx.fillRect(x,ground-o.h,o.w,o.h);ctx.strokeStyle='#d6b7ff';ctx.lineWidth=3;ctx.strokeRect(x+2,ground-o.h+2,o.w-4,o.h-4);}else{ctx.fillStyle='#37f5ad';ctx.fillRect(x,ground-70,8,70);ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.fillText('FINISH',x-15,ground-86);}}
ctx.save();ctx.translate(player.x+player.size/2,player.y+player.size/2);ctx.rotate(player.angle);ctx.fillStyle='#31e5ff';ctx.shadowColor='#00cfff';ctx.shadowBlur=14;ctx.fillRect(-player.size/2,-player.size/2,player.size,player.size);ctx.shadowBlur=0;ctx.strokeStyle='#d5fbff';ctx.lineWidth=3;ctx.strokeRect(-player.size/2+3,-player.size/2+3,player.size-6,player.size-6);ctx.fillStyle='#10254c';ctx.fillRect(-8,-7,5,7);ctx.fillRect(4,-7,5,7);ctx.restore();
if(!running&&!dead&&!finished){ctx.fillStyle='#b5ccff';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.fillText('READY?',W/2,100);ctx.textAlign='left';}}
function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();if(running)raf=requestAnimationFrame(loop);}
function press(e){if(e){e.preventDefault();}held=true;if(running)jumpNow();}
function release(e){if(e)e.preventDefault();held=false;}
canvas.addEventListener('pointerdown',press);window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!started){started=true;start()}else press(e)}});window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')release(e)});startBtn.addEventListener('click',()=>{started=true;document.querySelector('#panel h1').textContent='KYO DASH';start()});
makeLevel();draw();
})();
</script>
</body></html>
