
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kyo Dash</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100c20;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#171027}
canvas{display:block;width:100%;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;background:linear-gradient(#160e28dd,#100a20e8);text-align:center}
.hidden{display:none!important}
.logo{font-size:clamp(40px,10vw,70px);font-weight:1000;letter-spacing:1px;color:#e6d8ff;text-shadow:0 5px 0 #554078,0 0 30px #9c78c855}
.subtitle{color:#b8a8d0;margin:8px 0 28px}
.levels{display:flex;gap:12px;width:min(100%,460px)}
.level{flex:1;min-width:0;border:1px solid #66517e;border-radius:18px;padding:18px 5px;background:#28203b;color:#fff;font-size:17px;font-weight:bold}
.level small{display:block;margin-top:9px;color:#b7a6cf;font-size:11px}
.level:active,.btn:active{transform:scale(.97)}
.easy{border-bottom:4px solid #a8c5ae}
.medium{border-bottom:4px solid #c6b19a}
.hard{border-bottom:4px solid #c994aa}
.btn{border:0;border-radius:13px;padding:14px 25px;background:#d9c5ff;color:#211535;font-size:16px;font-weight:bold;margin:8px;cursor:pointer}
.hint{color:#a99abd;font-size:12px;line-height:1.6;margin-top:20px}
#hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-weight:bold;text-shadow:0 2px 6px #000}
#progressOuter{position:absolute;top:49px;left:14%;width:72%;height:7px;background:#332743;border-radius:9px;overflow:hidden}
#progress{height:100%;width:0;background:#d8c4ff;border-radius:9px}
#pause{position:absolute;top:70px;right:14px;border:1px solid #7e6a94;background:#211a30;color:white;border-radius:10px;padding:8px 12px}
#result .logo{font-size:46px}
@media(max-width:380px){.levels{gap:6px}.level{font-size:14px;padding:15px 3px}}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>

<div id="menu" class="screen">
  <div class="logo">Kyo Dash</div>
  <div class="subtitle">Ритм. Прыжок. Точность.</div>
  <div class="levels">
    <button class="level easy" onclick="startGame('Easy')">EASY<small>Спокойный</small></button>
    <button class="level medium" onclick="startGame('Medium')">MEDIUM<small>Средний</small></button>
    <button class="level hard" onclick="startGame('Hard')">HARD<small>Сложный</small></button>
  </div>
  <div class="hint">Выбери уровень и тапай по экрану, чтобы прыгать.<br>Удерживай палец для автопрыжков.</div>
</div>

<div id="hud" class="hidden">
  <span id="levelName">EASY</span>
  <span id="percent">0%</span>
</div>
<div id="progressOuter" class="hidden"><div id="progress"></div></div>
<button id="pause" class="hidden" onclick="togglePause()">Ⅱ</button>

<div id="result" class="screen hidden">
  <div class="logo" id="resultTitle">Уровень пройден!</div>
  <p id="resultText">100% завершено</p>
  <button class="btn" onclick="restartGame()">Играть снова</button>
  <button class="btn" onclick="showMenu()">Выбор уровня</button>
</div>
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const menu=document.getElementById('menu');
const hud=document.getElementById('hud');
const progressOuter=document.getElementById('progressOuter');
const progressBar=document.getElementById('progress');
const pauseBtn=document.getElementById('pause');
const result=document.getElementById('result');

let W=0,H=0,DPR=1,ground=0;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ground=H*.78;
}
addEventListener('resize',resize);resize();

const levels={
 Easy:{speed:245,jump:480,gap:420,length:6500,beat:0.38,notes:[261.6,329.6,392,329.6,293.7,349.2,440,349.2]},
 Medium:{speed:275,jump:495,gap:340,length:7600,beat:0.31,notes:[220,261.6,329.6,392,329.6,293.7,246.9,293.7]},
 Hard:{speed:305,jump:510,gap:275,length:8600,beat:0.25,notes:[196,246.9,293.7,369.9,329.6,293.7,246.9,220]}
};
let level='Easy',cfg=levels.Easy;
let state='menu',lastTime=0,elapsed=0,world=0,progress=0;
let player,obstacles=[],particles=[],holding=false,paused=false;
let audio=null,musicTimer=null,musicStep=0;
let best=Number(localStorage.getItem('kyodash_best')||0);
const size=29;

function makeLevel(){
  obstacles=[];
  let x=480;
  let i=0;
  while(x<cfg.length-150){
    const pattern=i%7;
    if(pattern===0){
      obstacles.push({x,type:'spike',n:1});x+=cfg.gap*.95;
    }else if(pattern===1){
      obstacles.push({x,type:'spike',n:2});x+=cfg.gap*1.18;
    }else if(pattern===2){
      obstacles.push({x,type:'block'});x+=cfg.gap*1.12;
    }else if(pattern===3){
      obstacles.push({x,type:'spike',n:1});
      obstacles.push({x:x+cfg.gap*.85,type:'spike',n:1});
      x+=cfg.gap*1.7;
    }else if(pattern===4){
      obstacles.push({x,type:'spike',n:3});x+=cfg.gap*1.45;
    }else if(pattern===5){
      obstacles.push({x,type:'block'});
      obstacles.push({x:x+cfg.gap*1.1,type:'spike',n:1});
      x+=cfg.gap*2;
    }else{
      x+=cfg.gap*1.25;
    }
    i++;
  }
  obstacles.push({x:cfg.length-100,type:'finish'});
}

function startGame(which){
  level=which;cfg=levels[level];
  menu.classList.add('hidden');result.classList.add('hidden');
  hud.classList.remove('hidden');progressOuter.classList.remove('hidden');
  pauseBtn.classList.remove('hidden');
  document.getElementById('levelName').textContent=level.toUpperCase();
  elapsed=0;world=0;progress=0;paused=false;holding=false;
  player={x:Math.min(120,W*.23),y:ground-size,vy:0,angle:0,onGround:true};
  makeLevel();particles=[];
  state='playing';lastTime=performance.now();
  startMusic();
  requestAnimationFrame(loop);
}
function restartGame(){startGame(level)}
function showMenu(){
  stopMusic();state='menu';paused=false;holding=false;
  menu.classList.remove('hidden');result.classList.add('hidden');
  hud.classList.add('hidden');progressOuter.classList.add('hidden');
  pauseBtn.classList.add('hidden');
}
function togglePause(){
  if(state!=='playing')return;
  paused=!paused;
  pauseBtn.textContent=paused?'▶':'Ⅱ';
  if(!paused){lastTime=performance.now();requestAnimationFrame(loop)}
}
function jump(){
  if(state!=='playing'||paused)return;
  if(player.onGround){
    player.vy=-cfg.jump;
    player.onGround=false;
  }
}

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='playing'&&!paused){holding=true;jump()}
});
addEventListener('pointerup',()=>holding=false);
addEventListener('pointercancel',()=>holding=false);
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();holding=true;jump();
  }
});
addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowUp')holding=false;
});

function startMusic(){
  stopMusic();
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    audio.resume();
    musicStep=0;
    musicTimer=setInterval(()=>{
      if(state!=='playing'||paused||!audio)return;
      const freq=cfg.notes[musicStep%cfg.notes.length];
      const osc=audio.createOscillator();
      const gain=audio.createGain();
      osc.type='triangle';osc.frequency.value=freq;
      gain.gain.setValueAtTime(.0001,audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(.045,audio.currentTime+.015);
      gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+cfg.beat*.8);
      osc.connect(gain);gain.connect(audio.destination);
      osc.start();osc.stop(audio.currentTime+cfg.beat);
      if(musicStep%2===0){
        const bass=audio.createOscillator(),bg=audio.createGain();
        bass.type='sine';bass.frequency.value=freq/2;
        bg.gain.setValueAtTime(.025,audio.currentTime);
        bg.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+cfg.beat*.7);
        bass.connect(bg);bg.connect(audio.destination);
        bass.start();bass.stop(audio.currentTime+cfg.beat*.75);
      }
      musicStep++;
    },cfg.beat*1000);
  }catch(e){}
}
function stopMusic(){
  if(musicTimer){clearInterval(musicTimer);musicTimer=null}
}

function loop(now){
  if(state!=='playing'||paused)return;
  let dt=Math.min((now-lastTime)/1000,.035);
  lastTime=now;
  update(dt);draw();
  if(state==='playing'&&!paused)requestAnimationFrame(loop);
}
function update(dt){
  elapsed+=dt;
  world+=cfg.speed*dt;
  player.vy+=1450*dt;
  player.y+=player.vy*dt;
  if(player.y>=ground-size){
    player.y=ground-size;player.vy=0;
    if(!player.onGround&&holding)player.vy=-cfg.jump;
    player.onGround=true;
  }else player.onGround=false;

  // Поворот кубика на 90 градусов за каждые прыжки
  if(!player.onGround){
    const spin=player.vy<0?1:-1;
    player.angle+=spin*dt*5.5;
  }else{
    player.angle=Math.round(player.angle/(Math.PI/2))*(Math.PI/2);
  }

  for(const o of obstacles){
    if(o.type==='finish')continue;
    const sx=o.x-world+player.x;
    if(sx<-100||sx>W+100)continue;
    if(o.type==='spike'){
      for(let k=0;k<o.n;k++){
        if(rectTriangleCollision(
          player.x+3,player.y+3,size-6,size-6,
          sx+k*size*.78,ground,size*.78
        )){
          die();return;
        }
      }
    }else if(o.type==='block'){
      if(player.x+size-4>sx&&player.x+4<sx+size&&
         player.y+size-3>ground-size&&player.y+3<ground){
        die();return;
      }
    }
  }

  progress=Math.min(100,Math.floor(world/cfg.length*100));
  document.getElementById('percent').textContent=progress+'%';
  progressBar.style.width=progress+'%';
  if(world>=cfg.length)win();
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
}
function rectTriangleCollision(rx,ry,rw,rh,tx,base,tw){
  const tri=[{x:tx,y:base},{x:tx+tw/2,y:base-tw},{x:tx+tw,y:base}];
  const rect=[{x:rx,y:ry},{x:rx+rw,y:ry},{x:rx+rw,y:ry+rh},{x:rx,y:ry+rh}];
  const axes=[{x:1,y:0},{x:0,y:1}];
  for(let i=0;i<3;i++){
    const a=tri[i],b=tri[(i+1)%3];
    axes.push({x:-(b.y-a.y),y:b.x-a.x});
  }
  for(const axis of axes){
    const tp=tri.map(p=>p.x*axis.x+p.y*axis.y);
    const rp=rect.map(p=>p.x*axis.x+p.y*axis.y);
    if(Math.max(...tp)<Math.min(...rp)||Math.max(...rp)<Math.min(...tp))return false;
  }
  return true;
}
function die(){
  state='dead';stopMusic();holding=false;
  for(let i=0;i<18;i++)particles.push({
    x:player.x+size/2,y:player.y+size/2,
    vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,life:.7
  });
  result.classList.remove('hidden');
  document.getElementById('resultTitle').textContent='Попробуй ещё!';
  document.getElementById('resultText').textContent='Прогресс: '+progress+'%';
}
function win(){
  state='win';stopMusic();holding=false;
  best=Math.max(best,progress);
  localStorage.setItem('kyodash_best',best);
  result.classList.remove('hidden');
  document.getElementById('resultTitle').textContent='Уровень пройден!';
  document.getElementById('resultText').textContent='100% • '+level+' • Рекорд: '+best+'%';
}

function draw(){
  const t=performance.now()*.00004;
  // Небо: одинаковый фиолетовый стиль для всех уровней
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#241a38');
  sky.addColorStop(.55,'#332544');
  sky.addColorStop(1,'#171222');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // Мягкое сияние луны
  const glow=ctx.createRadialGradient(W*.78,H*.2,2,W*.78,H*.2,H*.36);
  glow.addColorStop(0,'#c6b4dc20');
  glow.addColorStop(1,'#c6b4dc00');
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

  // Звёзды
  for(let i=0;i<65;i++){
    const x=((i*137.5-world*.035)% (W+30)+W+30)%(W+30);
    const y=(i*79.3)%(ground*.68);
    const r=i%5===0?1.8:1;
    ctx.globalAlpha=.35+Math.sin(t*12+i)*.18;
    ctx.fillStyle='#e4d9ef';
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Луна
  ctx.fillStyle='#d4c5df';ctx.beginPath();
  ctx.arc(W*.79,H*.19,19,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2c203e';ctx.beginPath();
  ctx.arc(W*.79+8,H*.19-7,17,0,Math.PI*2);ctx.fill();

  // Геометрические фигуры на фоне
  for(let i=0;i<12;i++){
    const x=((i*119-world*.12)%(W+100)+W+100)%(W+100)-25;
    const y=H*.12+(i*47)%(ground*.55);
    ctx.strokeStyle='#d4c0e0';ctx.globalAlpha=.09;
    ctx.lineWidth=1.5;ctx.beginPath();
    if(i%3===0){
      ctx.arc(x,y,8+i%4*2,0,Math.PI*2);
    }else if(i%3===1){
      ctx.rect(x-7,y-7,14,14);
    }else{
      ctx.moveTo(x,y-9);ctx.lineTo(x+9,y+7);ctx.lineTo(x-9,y+7);ctx.closePath();
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Дальние горы
  drawMountains('#30233f',ground*.68,world*.09,100,0);
  drawMountains('#261c35',ground*.78,world*.17,76,30);

  // Пол
  const floor=ctx.createLinearGradient(0,ground,0,H);
  floor.addColorStop(0,'#302541');floor.addColorStop(1,'#171222');
  ctx.fillStyle=floor;ctx.fillRect(0,ground,W,H-ground);
  ctx.fillStyle='#8c779f';ctx.fillRect(0,ground,W,2);

  // Сетка на земле
  ctx.strokeStyle='#7b688f';ctx.globalAlpha=.17;ctx.lineWidth=1;
  const grid=50,shift=world%grid;
  for(let x=-shift;x<W;x+=grid){
    ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+30,H);ctx.stroke();
  }
  for(let y=ground+25;y<H;y+=28){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Препятствия
  for(const o of obstacles){
    const sx=o.x-world+player.x;
    if(sx<-130||sx>W+130)continue;
    if(o.type==='spike'){
      for(let k=0;k<o.n;k++){
        const x=sx+k*size*.78,tw=size*.78;
        ctx.fillStyle='#c9b6dc';
        ctx.beginPath();ctx.moveTo(x,ground);
        ctx.lineTo(x+tw/2,ground-tw);
        ctx.lineTo(x+tw,ground);ctx.closePath();ctx.fill();
        ctx.strokeStyle='#eee2fa';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#9d88b5';
        ctx.beginPath();ctx.moveTo(x+tw*.25,ground);
        ctx.lineTo(x+tw/2,ground-tw*.5);
        ctx.lineTo(x+tw*.7,ground);ctx.closePath();ctx.fill();
      }
    }else if(o.type==='block'){
      ctx.fillStyle='#a995bf';ctx.fillRect(sx,ground-size,size,size);
      ctx.strokeStyle='#e0d2f0';ctx.lineWidth=2;
      ctx.strokeRect(sx+2,ground-size+2,size-4,size-4);
      ctx.strokeStyle='#6c587f';ctx.beginPath();
      ctx.moveTo(sx+5,ground-size+5);ctx.lineTo(sx+size-5,ground-5);
      ctx.moveTo(sx+size-5,ground-size+5);ctx.lineTo(sx+5,ground-5);ctx.stroke();
    }
  }

  // Кубик
  if(state==='playing'||state==='dead'){
    ctx.save();
    ctx.translate(player.x+size/2,player.y+size/2);
    ctx.rotate(player.angle);
    ctx.fillStyle='#e5d8f2';ctx.fillRect(-size/2,-size/2,size,size);
    ctx.strokeStyle='#fff7ff';ctx.lineWidth=2;ctx.strokeRect(-size/2+2,-size/2+2,size-4,size-4);
    ctx.fillStyle='#79638e';ctx.fillRect(-size*.27,-size*.22,size*.16,size*.16);
    ctx.fillRect(size*.11,-size*.22,size*.16,size*.16);
    ctx.strokeStyle='#79638e';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-size*.2,size*.17);ctx.lineTo(size*.2,size*.17);ctx.stroke();
    ctx.restore();
  }
  // Частицы после столкновения
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle='#e2d1f5';ctx.fillRect(p.x,p.y,5,5);
  }
  ctx.globalAlpha=1;
}
function drawMountains(color,base,speed,step,offset){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,base);
  const shift=(world*speed)%(step*2);
  ctx.lineTo(0,base);
  for(let x=-step*2;x<W+step*2;x+=step){
    const xx=x-shift;
    ctx.lineTo(xx+step*.5,base-(step*.45)+(Math.sin((x+offset)*.02)*step*.12));
    ctx.lineTo(xx+step,base);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
}

// Фоновая анимация в меню
function menuLoop(now){
  if(state==='menu'){
    world+=.25;
    draw();
  }
  requestAnimationFrame(menuLoop);
}
requestAnimationFrame(menuLoop);
</script>
</body>
</html>
