
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d22">
<title>KYO DASH</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d22;color:#f3f7ff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.app{width:min(100%,1000px);padding:10px;display:flex;flex-direction:column;gap:9px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:bold;color:#b8d9ff}
.brand{color:#48eaff;font-size:18px;letter-spacing:2px}
.meter{height:7px;background:#172344;border-radius:9px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#26dfff,#5cffba)}
canvas{width:100%;height:auto;aspect-ratio:900/420;display:block;border:1px solid #28477a;border-radius:12px;background:#0c1534;touch-action:none}
.hint{text-align:center;font-size:11px;color:#8da8d7}
.overlay{position:fixed;inset:0;z-index:5;background:#040817ee;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{width:min(94vw,470px);padding:24px 20px;border:1px solid #3266a4;border-radius:22px;text-align:center;background:linear-gradient(150deg,#172754,#0a1026)}
.logo{font-size:clamp(36px,10vw,58px);font-weight:1000;letter-spacing:3px;color:#45eaff;margin:0}
.sub{color:#b9c9f2;line-height:1.5;font-size:14px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 12px}
.level{border:1px solid #304873;border-radius:12px;padding:12px 4px;background:#111b38;color:#d8e6ff;font-weight:bold;font-size:12px}
.level small{display:block;color:#90a7d4;margin-top:5px}
.level.active{border-color:#35e3ff;background:#12314a}
.btn{border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(90deg,#2adfff,#65ffca);color:#071126;font-weight:bold;font-size:16px;width:100%}
.secondary{margin-top:9px;background:#192747;color:#cde2ff;border:1px solid #344d79}
.hidden{display:none!important}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:#9eb8e8;font-size:12px;margin:12px 0}
.stats b{color:white}
.menuBtn{border:1px solid #294774;background:#111d3a;color:#bfe8ff;border-radius:9px;padding:6px 10px;font-weight:bold;font-size:11px}
</style>
</head>
<body>
<main class="app">
<header class="top">
<span class="brand">KYO DASH</span>
<span id="levelLabel">EASY · 1</span>
<span id="progressText">0%</span>
<button class="menuBtn" id="menuBtn">МЕНЮ</button>
</header>
<div class="meter"><div class="fill" id="progressFill"></div></div>
<canvas id="game" width="900" height="420"></canvas>
<div class="hint">ТАП — ПРЫЖОК · УДЕРЖИВАЙ — АВТОПРЫЖКИ</div>
</main>

<div class="overlay" id="overlay">
<section class="panel">
<h1 class="logo" id="panelTitle">KYO DASH</h1>
<p class="sub" id="panelText">Прыгай через шипы и доберись до финиша!</p>
<div class="levels" id="levels">
<button class="level active" data-level="0">EASY<small>Спокойно</small></button>
<button class="level" data-level="1">MEDIUM<small>Сложнее</small></button>
<button class="level" data-level="2">HARD<small>Трудно</small></button>
</div>
<div class="stats">
<span>РЕКОРД <b id="best">0%</b></span>
<span>ПРОЙДЕНО <b id="wins">0/3</b></span>
</div>
<button class="btn" id="startBtn">ИГРАТЬ</button>
<div style="font-size:11px;color:#8097c6;margin-top:12px">Рекорды сохраняются на устройстве</div>
</section>
</div>

<script>
(()=>{
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay');
const title=document.getElementById('panelTitle');
const panelText=document.getElementById('panelText');
const startBtn=document.getElementById('startBtn');
const levelsBox=document.getElementById('levels');
const levelLabel=document.getElementById('levelLabel');
const progressText=document.getElementById('progressText');
const progressFill=document.getElementById('progressFill');
const bestEl=document.getElementById('best');
const winsEl=document.getElementById('wins');

const W=900,H=420,G=330,S=34;
const LEVELS=[
{name:'EASY',speed:275,jump:-590,gravity:1650,length:5100,gap:300},
{name:'MEDIUM',speed:300,jump:-600,gravity:1700,length:5900,gap:250},
{name:'HARD',speed:320,jump:-610,gravity:1750,length:6500,gap:215}
];

let selected=0,mode='menu',world=0,progress=0,last=0,raf=0,held=false;
let obstacles=[],best=[0,0,0],wins=[false,false,false];

try{
best=JSON.parse(localStorage.getItem('kyoDashBest3')||'[0,0,0]');
wins=JSON.parse(localStorage.getItem('kyoDashWins3')||'[false,false,false]');
if(!Array.isArray(best)||best.length!==3)best=[0,0,0];
if(!Array.isArray(wins)||wins.length!==3)wins=[false,false,false];
}catch(e){best=[0,0,0];wins=[false,false,false]}

const p={x:150,y:G-S,vy:0,angle:0,onGround:true};

function save(){
try{
localStorage.setItem('kyoDashBest3',JSON.stringify(best));
localStorage.setItem('kyoDashWins3',JSON.stringify(wins));
}catch(e){}
}

function refreshStats(){
bestEl.textContent=(best[selected]||0)+'%';
winsEl.textContent=wins.filter(Boolean).length+'/3';
document.querySelectorAll('.level').forEach((b,i)=>b.classList.toggle('active',i===selected));
levelLabel.textContent=LEVELS[selected].name+' · '+(selected+1);
}

function addSpike(x,count=1){
for(let i=0;i<count;i++)obstacles.push({x:x+i*37,w:37,h:37,type:'spike'});
}

function makeLevel(){
obstacles=[];
const cfg=LEVELS[selected];
let x=590,idx=0;
while(x<cfg.length-260){
const pattern=(idx*7+selected*3)%7;
if(selected===0){
if(pattern===2||pattern===5)addSpike(x);
else if(pattern===3)addSpike(x,2);
else if(pattern===0&&idx>1)obstacles.push({x,w:38,h:44,type:'block'});
}else if(selected===1){
if(pattern===0||pattern===4)addSpike(x,2);
else if(pattern===1)addSpike(x);
else if(pattern===3)obstacles.push({x,w:40,h:52,type:'block'});
else if(pattern===6){addSpike(x);obstacles.push({x:x+70,w:38,h:44,type:'block'});}
}else{
if(pattern===0||pattern===3||pattern===6)addSpike(x,2);
else if(pattern===1)addSpike(x);
else if(pattern===2)obstacles.push({x,w:42,h:58,type:'block'});
else{addSpike(x);addSpike(x+76);}
}
x+=cfg.gap+(pattern%3)*24;
idx++;
}
obstacles.push({x:cfg.length-130,w:12,h:80,type:'finish'});
}

function reset(){
world=0;progress=0;held=false;
p.y=G-S;p.vy=0;p.angle=0;p.onGround=true;
makeLevel();updateHud();
}

function updateHud(){
progress=Math.min(100,Math.floor(world/(LEVELS[selected].length-130)*100));
progressText.textContent=progress+'%';
progressFill.style.width=progress+'%';
if(progress>best[selected]){
best[selected]=progress;
bestEl.textContent=progress+'%';
save();
}
}

function showMenu(kind='menu'){
mode=kind;held=false;
overlay.classList.remove('hidden');
levelsBox.classList.toggle('hidden',kind==='dead'||kind==='win');
if(kind==='dead'){
title.textContent='УПС!';
panelText.textContent='Прогресс: '+progress+'%. Попробуй ещё раз!';
startBtn.textContent='ЕЩЁ РАЗ';
}else if(kind==='win'){
title.textContent='УРОВЕНЬ ПРОЙДЕН!';
panelText.textContent='Красиво! Уровень '+LEVELS[selected].name+' пройден.';
startBtn.textContent='ИГРАТЬ СНОВА';
}else{
title.textContent='KYO DASH';
panelText.textContent='Прыгай через шипы и доберись до финиша!';
startBtn.textContent='ИГРАТЬ';
}
refreshStats();draw();
}

function start(){
cancelAnimationFrame(raf);
reset();mode='playing';
overlay.classList.add('hidden');
last=performance.now();
raf=requestAnimationFrame(loop);
}

function jump(){
if(mode!=='playing')return;
if(p.onGround){
p.vy=LEVELS[selected].jump;
p.onGround=false;
}
}

function die(){
if(mode!=='playing')return;
mode='dead';held=false;showMenu('dead');
}

function win(){
mode='win';held=false;progress=100;
progressText.textContent='100%';
progressFill.style.width='100%';
best[selected]=100;wins[selected]=true;save();
refreshStats();showMenu('win');
}

function update(dt){
if(mode!=='playing')return;
const cfg=LEVELS[selected];
world+=cfg.speed*dt;
p.vy+=cfg.gravity*dt;
p.y+=p.vy*dt;

if(p.y>=G-S){
if(!p.onGround){
p.y=G-S;p.vy=0;p.onGround=true;
p.angle=Math.round(p.angle/(Math.PI/2))*(Math.PI/2);
if(held)jump();
}else{
p.y=G-S;p.vy=0;
if(held)jump();
}
}else{
p.onGround=false;
p.angle+=cfg.speed*dt/S*(Math.PI/2);
}

updateHud();
const px=p.x,py=p.y,s=S;

for(const o of obstacles){
const ox=o.x-world;
if(ox>px+90||ox+o.w<px-80)continue;

if(o.type==='finish'){
if(ox<px+s*.6){win();return;}
}else if(o.type==='spike'){
const left=ox+8,right=ox+o.w-8,top=G-o.h+12;
const bottom=py+s-3;
if(px+s-5>left&&px+5<right&&bottom>top+6&&py+s*.72<G){die();return;}
}else if(o.type==='block'){
if(px+s-4>ox+3&&px+4<ox+o.w-3&&py+s-3>G-o.h+3){die();return;}
}
}
}

function draw(){
ctx.fillStyle='#0a1230';ctx.fillRect(0,0,W,H);
const grad=ctx.createLinearGradient(0,0,0,G);
grad.addColorStop(0,'#111e48');grad.addColorStop(1,'#0a1530');
ctx.fillStyle=grad;ctx.fillRect(0,0,W,G);
ctx.strokeStyle='#213865';ctx.lineWidth=1;
const off=-(world*.3%45);
for(let x=off;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,G);ctx.stroke();}
for(let y=22;y<G;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

for(let i=0;i<26;i++){
const sx=(i*137-world*.12%900+900)%900,sy=(i*71)%285;
ctx.fillStyle='#668ac5';ctx.fillRect(sx,sy,2,2);
}
ctx.fillStyle='#14264c';ctx.fillRect(0,G,W,H-G);
ctx.fillStyle='#36e8ff';ctx.fillRect(0,G,W,4);

for(let x=-(world%50);x<W;x+=50){
ctx.fillStyle='#2b4779';ctx.fillRect(x,G+16,25,4);
}

for(const o of obstacles){
const x=o.x-world;
if(x<-70||x>W+70)continue;
if(o.type==='spike'){
ctx.fillStyle=selected===2?'#ff3d8c':'#ff4d83';
ctx.beginPath();ctx.moveTo(x,G);ctx.lineTo(x+o.w/2,G-o.h);ctx.lineTo(x+o.w,G);ctx.closePath();ctx.fill();
ctx.strokeStyle='#ffb2cb';ctx.lineWidth=2;ctx.stroke();
}else if(o.type==='block'){
ctx.fillStyle='#824dff';ctx.fillRect(x,G-o.h,o.w,o.h);
ctx.strokeStyle='#d6c2ff';ctx.lineWidth=3;ctx.strokeRect(x+2,G-o.h+2,o.w-4,o.h-4);
}else{
ctx.fillStyle='#4dffb4';ctx.fillRect(x,G-o.h,8,o.h);
ctx.fillStyle='#e6fff5';ctx.font='bold 18px Arial';ctx.fillText('FINISH',x-26,G-o.h-12);
}
}

ctx.save();
ctx.translate(p.x+S/2,p.y+S/2);
ctx.rotate(p.angle);
ctx.shadowColor='#00dfff';ctx.shadowBlur=14;
ctx.fillStyle='#35e7ff';ctx.fillRect(-S/2,-S/2,S,S);
ctx.shadowBlur=0;ctx.strokeStyle='#d8fcff';ctx.lineWidth=3;
ctx.strokeRect(-S/2+2,-S/2+2,S-4,S-4);
ctx.fillStyle='#0a2750';ctx.fillRect(-9,-7,5,7);ctx.fillRect(4,-7,5,7);
ctx.restore();
}

function loop(now){
const dt=Math.min((now-last)/1000,.025);
last=now;update(dt);draw();
if(mode==='playing')raf=requestAnimationFrame(loop);
}

function press(e){
if(e)e.preventDefault();
if(mode!=='playing')return;
held=true;jump();
}
function release(e){
if(e)e.preventDefault();
held=false;
}

canvas.addEventListener('pointerdown',press);
window.addEventListener('pointerup',release);
window.addEventListener('pointercancel',release);
window.addEventListener('keydown',e=>{
if(e.code==='Space'||e.code==='ArrowUp'){
e.preventDefault();
if(mode==='playing'){if(!held)press(e);}
else start();
}
});
window.addEventListener('keyup',e=>{
if(e.code==='Space'||e.code==='ArrowUp')release(e);
});
startBtn.addEventListener('click',start);
document.getElementById('menuBtn').addEventListener('click',()=>{
cancelAnimationFrame(raf);showMenu('menu');
});
levelsBox.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>{
selected=Number(b.dataset.level);refreshStats();draw();
}));

refreshStats();makeLevel();draw();
})();
</script>
</body>
</html>
