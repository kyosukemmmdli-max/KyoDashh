
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Dash Menu</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Press+Start+2P&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #b900bd;
    font-family: 'Russo One', sans-serif;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(90deg, transparent 98%, #e500d8 98%),
        linear-gradient(0deg, transparent 98%, #e500d8 98%),
        linear-gradient(135deg, #a900ad, #c900c9, #a600ae);
    background-size: 340px 300px;
}

.background::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(90deg, transparent 48%, #ec00db 49%, #ec00db 50%, transparent 51%),
        linear-gradient(0deg, transparent 48%, #ec00db 49%, #ec00db 50%, transparent 51%);
    background-size: 430px 330px;
    opacity: .7;
}

/* FLOOR */

.floor {
    position: absolute;
    bottom: 27%;
    left: 0;
    width: 100%;
    height: 8px;
    background: #ef00dd;
    box-shadow: 0 5px 0 #87008e;
}

.ground {
    position: absolute;
    bottom: 0;
    height: 28%;
    width: 100%;
    background: rgba(91, 0, 94, .35);
    border-top: 7px solid #ec00d7;
}

/* LOGO */

.logo {
    position: absolute;
    top: 7%;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    text-align: center;
    white-space: nowrap;
    font-size: clamp(30px, 7vw, 95px);
    font-weight: 1000;
    letter-spacing: -4px;
    color: #9bff35;
    -webkit-text-stroke: 3px #111;
    paint-order: stroke fill;
    text-shadow:
        4px 5px 0 white,
        7px 9px 0 #222,
        10px 13px 0 rgba(0,0,0,.45);
    filter: drop-shadow(0 4px 0 #222);
}

/* MAIN BUTTONS */

.main-buttons {
    position: absolute;
    top: 46%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(35px, 6vw, 100px);
    width: 95%;
}

.game-btn {
    position: relative;
    width: clamp(90px, 11vw, 155px);
    aspect-ratio: 1;
    background: linear-gradient(145deg, #b5ff37, #53c900);
    border: 6px solid white;
    outline: 5px solid #111;
    border-radius: 17px;
    box-shadow:
        0 8px 0 #245900,
        0 12px 0 #111,
        0 17px 8px #0008;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: .12s;
}

.game-btn::before {
    content: "";
    position: absolute;
    inset: -13px;
    border: 5px solid #111;
    border-radius: 18px;
    z-index: -1;
}

.game-btn:hover {
    filter: brightness(1.2);
    transform: translateY(-5px);
}

.game-btn:active {
    transform: translateY(5px);
    box-shadow: 0 2px 0 #245900, 0 5px 0 #111;
}

.game-btn svg {
    width: 75%;
    height: 75%;
    filter: drop-shadow(3px 4px 0 #222);
}

.play-btn {
    width: clamp(145px, 17vw, 235px);
    background: linear-gradient(145deg, #b5ff39, #4dc900);
    border-radius: 17px;
}

.play-btn svg {
    width: 70%;
    height: 70%;
}

/* SIDE BUTTONS */

.profile {
    position: absolute;
    left: 3.5%;
    top: 55%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.username {
    color: #ffe500;
    font-size: clamp(20px, 2vw, 32px);
    -webkit-text-stroke: 1px #4c2100;
    text-shadow: 2px 3px #111;
}

.avatar {
    width: clamp(85px, 10vw, 125px);
    aspect-ratio: 1;
    border: 5px solid white;
    outline: 5px solid #111;
    border-radius: 50%;
    background: linear-gradient(#13d9fa, #0870d5);
    display: grid;
    place-items: center;
    box-shadow: 0 6px 0 #333;
}

.avatar svg {
    width: 75%;
}

.daily {
    position: absolute;
    right: 3%;
    top: 38%;
    cursor: pointer;
    text-align: center;
    font-size: 25px;
    color: #ffe900;
    -webkit-text-stroke: 1.5px #281000;
    text-shadow: 3px 4px #111;
    transition: .15s;
}

.daily:hover {
    transform: scale(1.1);
}

.chest {
    font-size: 65px;
    display: block;
    filter: drop-shadow(3px 5px 0 #222);
}

/* BOTTOM BUTTONS */

.bottom-buttons {
    position: absolute;
    bottom: 7%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: clamp(12px, 3vw, 35px);
}

.circle-btn {
    width: clamp(75px, 9vw, 125px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: linear-gradient(145deg, #b5ff32, #55c900);
    border: 6px solid white;
    outline: 4px solid #111;
    box-shadow: 0 7px 0 #222, 0 10px 5px #0008;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .15s;
}

.circle-btn:hover {
    transform: translateY(-5px) scale(1.05);
    filter: brightness(1.2);
}

.circle-btn:active {
    transform: translateY(3px);
}

.circle-btn svg {
    width: 65%;
    height: 65%;
    filter: drop-shadow(2px 3px 0 #333);
}

.more-games {
    position: absolute;
    right: 2%;
    bottom: 8%;
    font-size: clamp(22px, 3.5vw, 43px);
    color: #ffeb00;
    text-align: center;
    line-height: 1.1;
    -webkit-text-stroke: 2px #201000;
    text-shadow: 4px 5px #111;
    cursor: pointer;
}

.socials {
    position: absolute;
    bottom: 13%;
    left: 2%;
    display: flex;
    gap: 13px;
}

.social {
    width: 58px;
    height: 58px;
    border: 4px solid white;
    outline: 3px solid #111;
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: white;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 4px 0 #222;
}

.facebook { background: #2678df; }
.twitter { background: #16bce9; }
.youtube { background: #f32b25; }

.robtop {
    position: absolute;
    bottom: 3%;
    left: 2%;
    color: #ffb000;
    font-size: clamp(25px, 3vw, 40px);
    -webkit-text-stroke: 2px #321000;
    text-shadow: 3px 4px #111;
}

/* CLOSE BUTTON */

.close {
    position: absolute;
    top: 2%;
    left: 1%;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: linear-gradient(#aaff35, #53bf00);
    border: 5px solid white;
    outline: 3px solid #111;
    display: grid;
    place-items: center;
    color: #ffdf00;
    font-size: 55px;
    line-height: 1;
    -webkit-text-stroke: 2px #111;
    text-shadow: 2px 3px #111;
    cursor: pointer;
    z-index: 10;
}

/* GAME CUBE */

.runner {
    position: absolute;
    bottom: 27.5%;
    right: 23%;
    font-size: 40px;
    animation: run 4s linear infinite;
}

@keyframes run {
    0% { right: -5%; }
    100% { right: 105%; }
}

/* POPUP */

.popup {
    position: absolute;
    inset: 0;
    background: #0009;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 20;
}

.popup.active {
    display: flex;
}

.popup-box {
    width: min(90%, 450px);
    min-height: 230px;
    background: linear-gradient(#a6ff35, #4dbd00);
    border: 7px solid white;
    outline: 5px solid #111;
    border-radius: 20px;
    box-shadow: 0 12px 0 #222;
    padding: 35px;
    text-align: center;
    color: white;
    text-shadow: 2px 3px #222;
}

.popup-box h2 {
    font-size: 30px;
    margin-bottom: 25px;
}

.popup-box button {
    padding: 12px 35px;
    font-family: inherit;
    font-size: 20px;
    border: 4px solid white;
    outline: 3px solid #111;
    border-radius: 12px;
    background: #ffbd00;
    color: white;
    cursor: pointer;
}

/* MOBILE */

@media(max-width: 700px) {
    .logo {
        top: 12%;
        font-size: clamp(25px, 7vw, 48px);
        letter-spacing: -2px;
        -webkit-text-stroke: 2px #111;
    }

    .main-buttons {
        top: 45%;
        gap: 23px;
    }

    .game-btn {
        width: 22vw;
        border-width: 4px;
    }

    .play-btn {
        width: 29vw;
    }

    .profile {
        top: 62%;
        left: 4%;
    }

    .avatar {
        width: 65px;
        border-width: 3px;
    }

    .username {
        font-size: 16px;
    }

    .daily {
        top: 61%;
        right: 5%;
        font-size: 17px;
    }

    .chest {
        font-size: 43px;
    }

    .bottom-buttons {
        bottom: 6%;
        gap: 10px;
    }

    .circle-btn {
        width: 16vw;
        border-width: 4px;
    }

    .socials {
        bottom: 19%;
        left: 3%;
        gap: 7px;
    }

    .social {
        width: 35px;
        height: 35px;
        font-size: 19px;
        border-width: 2px;
    }

    .robtop {
        bottom: 12%;
        font-size: 19px;
    }

    .more-games {
        bottom: 12%;
        font-size: 19px;
    }

    .close {
        width: 45px;
        height: 45px;
        font-size: 37px;
    }

    .runner {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="ground"></div>
<div class="floor"></div>

<!-- CLOSE -->
<div class="close" onclick="showPopup('Выход')">×</div>

<!-- LOGO -->
<div class="logo">GEOMETRY DASH</div>

<!-- MAIN BUTTONS -->
<div class="main-buttons">

    <!-- CUBE -->
    <button class="game-btn" onclick="showPopup('Иконки')">
        <svg viewBox="0 0 100 100">
            <rect x="8" y="8" width="84" height="84"
                  fill="#8cf52b" stroke="#174000" stroke-width="5"/>
            <rect x="18" y="22" width="23" height="25"
                  fill="#fff000" stroke="#111" stroke-width="4"/>
            <rect x="59" y="22" width="23" height="25"
                  fill="#fff000" stroke="#111" stroke-width="4"/>
            <path d="M20 65 L80 65 L80 78 L20 78Z"
                  fill="#ffcf00" stroke="#111" stroke-width="4"/>
        </svg>
    </button>

    <!-- PLAY -->
    <button class="game-btn play-btn" onclick="showPopup('Играть')">
        <svg viewBox="0 0 100 100">
            <path d="M24 10 Q18 7 18 18 L18 82 Q18 94 30 87 L84 55 Q95 49 84 42Z"
                  fill="#ffe500" stroke="#111" stroke-width="5"
                  stroke-linejoin="round"/>
        </svg>
    </button>

    <!-- EDITOR -->
    <button class="game-btn" onclick="showPopup('Редактор уровней')">
        <svg viewBox="0 0 100 100" fill="none"
             stroke="#ffdf00" stroke-width="9"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 80 L75 20"/>
            <path d="M15 70 L30 85 L10 90Z" fill="#ffdf00"/>
            <path d="M64 12 L85 33 L76 42 L55 21Z"/>
            <path d="M45 55 L75 85"/>
            <path d="M65 65 L85 45 L95 55 L75 75Z"/>
            <path d="M10 15 L35 40"/>
        </svg>
    </button>

</div>

<!-- PROFILE -->
<div class="profile" onclick="showPopup('Профиль')">
    <div class="username">QXLF</div>
    <div class="avatar">
        <svg viewBox="0 0 100 100">
            <circle cx="50" cy="30" r="22"
                    fill="#ffcf25" stroke="#713b00" stroke-width="4"/>
            <path d="M13 87 Q12 53 50 53 Q88 53 87 87Z"
                  fill="#ffcf25" stroke="#713b00" stroke-width="4"/>
        </svg>
    </div>
</div>

<!-- DAILY -->
<div class="daily" onclick="showPopup('Daily Chest')">
    <span class="chest">🎁</span>
    DAILY
</div>

<!-- BOTTOM BUTTONS -->
<div class="bottom-buttons">

    <!-- TROPHY -->
    <button class="circle-btn" onclick="showPopup('Достижения')">
        <svg viewBox="0 0 100 100">
            <path d="M25 15 H75 V50 Q75 75 50 75 Q25 75 25 50Z"
                  fill="#ffcc00" stroke="#222" stroke-width="5"/>
            <path d="M25 25 H10 V42 Q10 55 30 55 M75 25 H90 V42 Q90 55 70 55"
                  fill="none" stroke="#222" stroke-width="7"/>
            <path d="M42 75 V87 H58 V75 M35 90 H65"
                  stroke="#222" stroke-width="7"/>
        </svg>
    </button>

    <!-- SETTINGS -->
    <button class="circle-btn" onclick="showPopup('Настройки')">
        <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="36"
                    fill="#ffce00" stroke="#222" stroke-width="6"/>
            <circle cx="50" cy="50" r="20"
                    fill="#69df18" stroke="#222" stroke-width="5"/>
            <g stroke="#222" stroke-width="9">
                <path d="M50 5 V17 M50 83 V95 M5 50 H17 M83 50 H95"/>
                <path d="M18 18 L27 27 M73 73 L82 82 M18 82 L27 73 M73 27 L82 18"/>
            </g>
        </svg>
    </button>

    <!-- STATS -->
    <button class="circle-btn" onclick="showPopup('Статистика')">
        <svg viewBox="0 0 100 100">
            <path d="M12 45 H32 V85 H12Z"
                  fill="#ffcd00" stroke="#222" stroke-width="5"/>
            <path d="M40 20 H60 V85 H40Z"
                  fill="#ffcd00" stroke="#222" stroke-width="5"/>
            <path d="M68 5 H88 V85 H68Z"
                  fill="#ffcd00" stroke="#222" stroke-width="5"/>
        </svg>
    </button>

    <!-- MUSIC -->
    <button class="circle-btn" onclick="showPopup('Музыка')">
        <svg viewBox="0 0 100 100">
            <path d="M55 20 L88 10 V65"
                  stroke="#222" stroke-width="9" fill="none"/>
            <path d="M55 20 V70"
                  stroke="#222" stroke-width="9"/>
            <ellipse cx="43" cy="76" rx="18" ry="12"
                     fill="#ffcc00" stroke="#222" stroke-width="5"/>
            <ellipse cx="76" cy="65" rx="18" ry="12"
                     fill="#ffcc00" stroke="#222" stroke-width="5"/>
        </svg>
    </button>

</div>

<!-- SOCIALS -->
<div class="socials">
    <div class="social facebook">f</div>
    <div class="social twitter">♥</div>
    <div class="social youtube">▶</div>
</div>

<div class="robtop">RobTop</div>

<div class="more-games" onclick="showPopup('Другие игры')">
    MORE<br>GAMES
</div>

<!-- RUNNING CUBE -->
<div class="runner">◆</div>

<!-- POPUP -->
<div class="popup" id="popup" onclick="closePopup(event)">
    <div class="popup-box">
        <h2 id="popup-title">Меню</h2>
        <button onclick="hidePopup()">OK</button>
    </div>
</div>

<script>
function showPopup(title) {
    document.getElementById('popup-title').textContent = title;
    document.getElementById('popup').classList.add('active');
}

function hidePopup() {
    document.getElementById('popup').classList.remove('active');
}

function closePopup(event) {
    if (event.target.id === 'popup') {
        hidePopup();
    }
}
</script>

</body>
</html>
