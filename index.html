
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d22">
<title>Kyo Dash — Big Update</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b1c;color:#fff;font-family:Arial,sans-serif}
body{touch-action:manipulation}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{transform:scale(.97)}
.app{width:min(100%,1050px);margin:auto;padding:9px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap}
.logoSmall{font-weight:1000;letter-spacing:1.5px;color:#42eaff;font-size:18px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.stat{font-size:12px;color:#bad3ff;font-weight:bold}
.meter{height:7px;background:#192344;border-radius:20px;overflow:hidden}
#progressFill{height:100%;width:0;background:linear-gradient(90deg,#31dfff,#6dffb6)}
canvas{width:100%;height:auto;aspect-ratio:900/420;display:block;border:1px solid #2d4c80;border-radius:12px;background:#0a1230;touch-action:none}
.hint{text-align:center;color:#91a8d4;font-size:11px;min-height:14px}
.smallbtn{padding:8px 10px;border:1px solid #304a77;background:#121e3c;color:#cce9ff;border-radius:9px;font-size:11px;font-weight:bold}
.overlay{position:fixed;inset:0;z-index:5;background:#030614ed;display:flex;align-items:center;justify-content:center;padding:10px}
.panel{width:min(96vw,500px);max-height:95dvh;overflow:auto;background:linear-gradient(145deg,#172750,#090f25);border:1px solid #315a91;border-radius:20px;padding:18px;text-align:center;box-shadow:0 0 45px #12295b66}
.title{font-size:clamp(30px,9vw,47px);margin:0;color:#41e9ff;letter-spacing:1px;text-shadow:0 0 20px #1bcfff55}
.subtitle{font-size:13px;color:#b4c8ed;line-height:1.5}
.profile{padding:12px;margin:12px 0;background:#0b1530;border:1px solid #2b4776;border-radius:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}
.btn{width:100%;padding:12px 8px;background:linear-gradient(90deg,#25dfff,#67ffc5);color:#061327;border:0;border-radius:10px;font-weight:900;margin:3px 0}
.secondary{background:#142343;border:1px solid #34517f;color:#d9e9ff}
.danger{background:#48203b;color:#ffcbde;border:1px solid #8d416c}
.level{background:#111c38;border:1px solid #30466f;color:#e1edff;border-radius:9px;padding:10px 3px;font-weight:900}
.level.active{border-color:#3be9ff;background:#12314c;box-shadow:inset 0 0 12px #26dfff18}
.level small{display:block;font-size:9px;margin-top:5px;color:#a9c9f4}
.card{background:#0b1530;border:1px solid #2a426c;border-radius:12px;padding:11px;text-align:left;min-width:0}
.card h3{font-size:14px;margin:0 0 7px;color:#58e9ff}
.card p{font-size:12px;color:#b6c9eb;line-height:1.4;margin:5px 0}
.muted{color:#8fa8d5;font-size:11px}
input,select{width:100%;padding:10px;background:#080f23;border:1px solid #34527f;color:white;border-radius:9px;margin:5px 0}
.xpbar{height:6px;background:#243353;border-radius:20px;overflow:hidden;margin-top:7px}
#xpFill{height:100%;width:0;background:linear-gradient(90deg,#34dfff,#63ffb3)}
.hidden{display:none!important}
.rainbow{font-weight:1000;background:linear-gradient(90deg,#ff5478,#ffd94e,#56ffac,#42dfff,#c274ff,#ff5478);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 3s linear infinite}
@keyframes rainbow{to{background-position:300% 50%}}
#message{position:fixed;z-index:20;top:12px;left:10px;right:10px;text-align:center;pointer-events:none}
.toast{display:inline-block;padding:10px 14px;border-radius:10px;background:#17294c;border:1px solid #42eaff;color:white;font-size:13px;box-shadow:0 6px 30px #0008}
#errorBox{display:none;position:fixed;z-index:30;bottom:5px;left:5px;right:5px;padding:12px;border-radius:10px;background:#681e32;color:#fff;font-size:12px;overflow-wrap:anywhere}
@media(max-width:440px){.app{padding:5px;gap:5px}.logoSmall{font-size:15px}.smallbtn{padding:7px;font-size:10px}.panel{padding:13px}.card{padding:8px}}
@media(max-height:560px){.app{gap:4px;padding:4px}.panel{padding:10px;max-height:98dvh}.profile{padding:7px;margin:7px 0}.grid,.levels{gap:5px;margin:7px 0}.title{font-size:29px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
<span class="logoSmall" id="gameLogo">KYO DASH</span>
<span class="stat" id="levelLabel">EASY</span>
<span class="stat" id="progressText">0%</span>
<button class="smallbtn" data-action="music" id="musicBtn">♫ MUSIC ON</button>
<button class="smallbtn" data-action="menu">MENU</button>
</header>
<div class="meter"><div id="progressFill"></div></div>
<canvas id="game" width="900" height="420"></canvas>
<div class="hint" id="hint">Тапни по экрану, чтобы прыгнуть · Удерживай для автопрыжка</div>
</main>
<div class="overlay" id="overlay">
<section class="panel">
<h1 class="title" id="panelTitle">Kyo Dash</h1>
<p class="subtitle" id="panelSubtitle">BIG UPDATE · Прыгай, собирай награды и создавай уровни!</p>
<div id="panelContent"></div>
</section>
</div>
<div id="message"></div>
<div id="errorBox"></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var canvas=$('game'),ctx=canvas.getContext('2d');
var overlay=$('overlay'),content=$('panelContent');
var W=900,H=420,G=330,CUBE=34;
var STORE='kyoDashBigUpdateV1';

/* OWNER ACCESS */
var OWNER_PIN='OwnerKD-ADS5H-D6E9F037F7';
var OWNER_KEY='kyoDashOwnerAuthorizedV1';
var ownerMode=false;
var logoClicks=0;
var logoClickTimer=null;

function hasOwnerAccess(){
 try{return localStorage.getItem(OWNER_KEY)==='yes'}catch(e){return false}
}

function requestOwnerAccess(){
 if(hasOwnerAccess()){
  ownerMode=true;
  showOwnerPanel();
  return;
 }
 var pin=prompt('👑 Kyo Dash Owner Panel\nВведите PIN владельца:');
 if(pin===null)return;
 if(pin.trim()!==OWNER_PIN){
  alert('🚫 Неверный PIN');
  return;
 }
 try{localStorage.setItem(OWNER_KEY,'yes')}
 catch(e){alert('Не удалось сохранить доступ в этом браузере.')}
 ownerMode=true;
 showOwnerPanel();
}

var gameLogo=$('gameLogo');
gameLogo.addEventListener('contextmenu',function(e){e.preventDefault()});
gameLogo.addEventListener('selectstart',function(e){e.preventDefault()});
gameLogo.addEventListener('click',function(e){
 e.preventDefault();
 logoClicks++;
 if(logoClickTimer)clearTimeout(logoClickTimer);
 logoClickTimer=setTimeout(function(){logoClicks=0},2500);
 if(logoClicks>=7){
  logoClicks=0;
  clearTimeout(logoClickTimer);
  requestOwnerAccess();
 }
});

var levels=[
{name:'EASY',speed:285,jump:-555,gravity:1550,length:5700,gap:390},
{name:'MEDIUM',speed:295,jump:-565,gravity:1600,length:6500,gap:350},
{name:'HARD',speed:310,jump:-575,gravity:1650,length:7200,gap:330}
];
var profile={nickname:'Player',xp:0,coins:0};
var selected=0,mode='menu',world=0,progress=0,last=0,raf=0;
var held=false,obstacles=[],particles=[],custom=[];
var best=[0,0,0],wins=[false,false,false],achieved={};
var unlocked=['cyan'],skin='cyan',dailyClaim='',editorTool='spike';
var gravityFlip=false,portalCooldown=0;
var p={x:150,y:G-CUBE,vy:0,angle:0,onGround:true};
var musicEnabled=true,audioCtx=null,musicTimer=null,musicStep=0,musicGeneration=0;

var songData=[
{tempo:190,notes:[523,659,784,659,523,392,440,523,659,523,440,392,440,523,659,784,659,523,392,440,523,659,784,880,784,659,523,440,392,440,523,392],bass:[131,0,165,0,196,0,165,0],wave:'square'},
{tempo:145,notes:[392,523,659,784,659,523,392,523,440,587,698,880,698,587,440,587,392,523,659,784,880,784,659,523,440,587,698,880,784,698,587,440],bass:[98,98,131,131,110,110,147,147],wave:'sawtooth'},
{tempo:105,notes:[330,440,659,523,330,440,784,659,349,466,698,587,349,466,880,698,330,523,659,880,784,659,523,440,349,523,698,932,880,698,523,392],bass:[82,82,110,110,73,73,98,98],wave:'square'}
];
var skinsData=[
{id:'cyan',name:'Neon Cyan',price:0,color:'#35eaff',glow:'#00cfff'},
{id:'fire',name:'Fire Cube',price:100,color:'#ff6748',glow:'#ff2d54'},
{id:'lime',name:'Toxic Lime',price:150,color:'#a3ff3c',glow:'#64ff21'},
{id:'purple',name:'Void Purple',price:200,color:'#bd79ff',glow:'#8d38ff'},
{id:'gold',name:'Golden Star',price:350,color:'#ffd95a',glow:'#ffad20'},
{id:'pink',name:'Pink Pulse',price:400,color:'#ff67cb',glow:'#ff30a4'}
];

function isReservedNick(name){
 var n=String(name||'').trim().toUpperCase().replace(/[\s_\-\[\].]/g,'');
 return /^(DEV|MOD|MODER|OWNER|ADMIN|STAFF|DEVELOPER|HELPER|ВЛАДЕЛЕЦ|АДМИН|МОДЕРАТОР)/.test(n);
}
function currentSkin(){
 return skinsData.find(function(s){return s.id===skin})||skinsData[0];
}
function notify(msg){
 $('message').innerHTML='<span class="toast"></span>';
 $('message').firstChild.textContent=msg;
 setTimeout(function(){$('message').innerHTML=''},2300);
}
function readStore(){
 try{
  var d=JSON.parse(localStorage.getItem(STORE)||'{}');
  if(d.profile&&typeof d.profile==='object'){
   var storedNick=String(d.profile.nickname||'Player').trim().slice(0,16);
   profile.nickname=isReservedNick(storedNick)&&!hasOwnerAccess()?'Player':storedNick;
   profile.xp=Math.max(0,Number(d.profile.xp)||0);
   profile.coins=Math.max(0,Number(d.profile.coins)||0);
  }
  if(Array.isArray(d.best)&&d.best.length===3)best=d.best.map(function(v){return Math.max(0,Number(v)||0)});
  if(Array.isArray(d.wins)&&d.wins.length===3)wins=d.wins;
  if(d.achieved&&typeof d.achieved==='object')achieved=d.achieved;
  if(Array.isArray(d.unlocked))unlocked=Array.from(new Set(['cyan'].concat(d.unlocked)));
  if(skinsData.some(function(s){return s.id===d.skin})&&unlocked.indexOf(d.skin)>=0)skin=d.skin;
  if(typeof d.dailyClaim==='string')dailyClaim=d.dailyClaim;
  if(Array.isArray(d.custom))custom=d.custom.filter(function(o){
   return o&&Number.isFinite(o.x)&&['spike','block','portal'].includes(o.type);
  }).slice(0,100);
 }catch(e){}
}
function save(){
 try{
  localStorage.setItem(STORE,JSON.stringify({
   profile:profile,best:best,wins:wins,achieved:achieved,
   unlocked:unlocked,skin:skin,dailyClaim:dailyClaim,custom:custom
  }));
 }catch(e){notify('Не удалось сохранить: проверь память браузера')}
}
function levelNum(){return Math.floor(profile.xp/250)+1}
function xpNext(){return profile.xp%250}
 
function profileHTML(){
 return '<div class="profile">'+
 '<div class="row"><b>Игрок: <span id="nickDisplay"></span></b><b>💰 <span id="coinDisplay"></span></b></div>'+
 '<p class="muted">Уровень аккаунта <b id="accountLevel"></b> · XP <span id="xpDisplay"></span>/250</p>'+
 '<div class="xpbar"><div id="xpFill"></div></div>'+
 '<input id="nickInput" maxlength="16" placeholder="Новый ник">'+
 '<button class="btn secondary" data-action="nick">СОХРАНИТЬ НИК</button></div>';
}
function updateProfile(){
 var nick=$('nickDisplay'),coins=$('coinDisplay'),lev=$('accountLevel'),xp=$('xpDisplay'),fill=$('xpFill');
 if(nick){
  nick.textContent=profile.nickname;
  nick.classList.toggle('rainbow',ownerMode&&profile.nickname==='[DEV] Kyosuke');
 }
 if(coins)coins.textContent=profile.coins;
 if(lev)lev.textContent=levelNum();
 if(xp)xp.textContent=xpNext();
 if(fill)fill.style.width=(xpNext()/250*100)+'%';
}
function shell(title,subtitle,html){
 $('panelTitle').textContent=title;
 $('panelSubtitle').textContent=subtitle||'';
 content.innerHTML=html||'';
 overlay.classList.remove('hidden');
 updateProfile();
}
function menu(){
 stopMusic();
 mode='menu';held=false;
 $('hint').textContent='Тапни по экрану, чтобы прыгнуть · Удерживай для автопрыжка';
 var lv=levels.map(function(l,i){
  return '<button class="level '+(i===selected?'active':'')+'" data-action="level" data-level="'+i+'">'+l.name+'<small>Рекорд '+best[i]+'%</small></button>';
 }).join('');
 shell('Kyo Dash','BIG UPDATE · Новые скины, достижения и редактор уровней',
 profileHTML()+
 '<div class="levels">'+lv+'</div>'+
 '<button class="btn" data-action="start">▶ ИГРАТЬ</button>'+
 '<div class="grid">'+
 '<button class="btn secondary" data-action="shop">🎨 СКИНЫ</button>'+
 '<button class="btn secondary" data-action="achievements">🏆 ДОСТИЖЕНИЯ</button>'+
 '<button class="btn secondary" data-action="editor">🛠 РЕДАКТОР</button>'+
 '<button class="btn secondary" data-action="daily">🎁 НАГРАДА ДНЯ</button>'+
 '<button class="btn secondary" data-action="stats">📊 СТАТИСТИКА</button>'+
 '</div><p class="muted">Прогресс хранится локально в этом браузере.</p>');
 refreshHud();draw();
}
function backButton(){return '<button class="btn secondary" data-action="menu">← В МЕНЮ</button>'}
function showShop(){
 mode='menu';
 var html='<div class="grid">';
 skinsData.forEach(function(s){
  var own=unlocked.indexOf(s.id)>=0,active=skin===s.id;
  html+='<div class="card"><div style="height:65px;display:grid;place-items:center"><div style="width:38px;height:38px;background:'+s.color+';box-shadow:0 0 20px '+s.glow+';border:3px solid #fff8;border-radius:4px"></div></div>'+
   '<h3>'+s.name+'</h3><p>'+(active?'Выбран':own?'Открыт':'Цена: '+s.price+' монет')+'</p>'+
   '<button class="btn '+(active?'secondary':'')+'" data-action="'+(active?'noop':own?'equip':'buy')+'" data-skin="'+s.id+'">'+(active?'ВЫБРАН':own?'НАДЕТЬ':'КУПИТЬ')+'</button></div>';
 });
 html+='</div>'+backButton();
 shell('Магазин скинов','Покупай кубики за монеты',html);
}
var achievementList=[
 {id:'first',name:'Первый прыжок',desc:'Начни играть в Kyo Dash',reward:25,check:function(){return profile.xp>0||wins.some(Boolean)}},
 {id:'win1',name:'Победитель',desc:'Пройди любой уровень',reward:50,check:function(){return wins.some(Boolean)}},
 {id:'allwins',name:'Мастер уровней',desc:'Пройди все 3 уровня',reward:150,check:function(){return wins.every(Boolean)}},
 {id:'coins100',name:'Копилка',desc:'Накопи 100 монет',reward:30,check:function(){return profile.coins>=100}},
 {id:'level5',name:'Ветеран',desc:'Достигни 5 уровня аккаунта',reward:100,check:function(){return levelNum()>=5}},
 {id:'editor',name:'Создатель',desc:'Сохрани собственный уровень',reward:50,check:function(){return custom.length>0}},
 {id:'skin',name:'Новый стиль',desc:'Открой дополнительный скин',reward:50,check:function(){return unlocked.length>=2}}
];
function checkAchievements(){
 achievementList.forEach(function(a){
  if(!achieved[a.id]&&a.check()){
   achieved[a.id]=true;profile.coins+=a.reward;
   notify('🏆 '+a.name+' · +'+a.reward+' монет');save();
  }
 });
}
function showAchievements(){
 checkAchievements();
 var html='<div class="grid">';
 achievementList.forEach(function(a){
  var done=!!achieved[a.id];
  html+='<div class="card"><h3>'+(done?'🏆 ':'🔒 ')+a.name+'</h3><p>'+a.desc+'</p><p class="muted">Награда: '+a.reward+' монет</p><p style="color:'+(done?'#68ffbd':'#9ab1dc')+'">'+(done?'ВЫПОЛНЕНО':'НЕ ВЫПОЛНЕНО')+'</p></div>';
 });
 html+='</div>'+backButton();
 shell('Достижения','Выполняй задания и получай монеты',html);
}
function dayKey(){
 var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function daily(){
 mode='menu';var claimed=dailyClaim===dayKey();
 shell('Ежедневная награда','Заходи каждый день за бонусом',
 '<div class="card" style="text-align:center"><h3 style="font-size:27px">🎁 +75 монет</h3><p>Бонус можно забрать один раз в день на этом устройстве.</p><button class="btn" data-action="claim" '+(claimed?'disabled':'')+'>'+(claimed?'УЖЕ ПОЛУЧЕНО':'ЗАБРАТЬ НАГРАДУ')+'</button></div>'+backButton());
}
function claimDaily(){
 if(dailyClaim===dayKey()){notify('Награда уже получена сегодня');return}
 dailyClaim=dayKey();profile.coins+=75;save();checkAchievements();daily();updateProfile();notify('+75 монет!');
}
function showStats(){
 shell('Статистика','Твои результаты',
 '<div class="card"><h3>Прогресс</h3>'+
 levels.map(function(l,i){return '<p>'+l.name+': рекорд '+best[i]+'% · '+(wins[i]?'пройден':'не пройден')+'</p>'}).join('')+
 '<p>Победы: '+wins.filter(Boolean).length+'/3</p><p>Скинов открыто: '+unlocked.length+'/'+skinsData.length+'</p><p>Созданных объектов: '+custom.length+'</p></div>'+backButton());
}
function showOwnerPanel(){
 if(!hasOwnerAccess()){ownerMode=false;return}
 ownerMode=true;
 profile.nickname='[DEV] Kyosuke';
 save();
 shell('OWNER PANEL','Добро пожаловать, [DEV] Kyosuke',
 '<div class="card"><h3>Управление тестовой игрой</h3>'+
 '<p>Владелец: <span class="rainbow">[DEV] Kyosuke</span></p>'+
 '<p>Доступ сохранён в этом браузере.</p>'+
 '<button class="btn" data-action="grant">+500 монет и +250 XP</button>'+
 '<button class="btn secondary" data-action="unlockall">Открыть все скины</button>'+
 '<button class="btn secondary" data-action="resetstats">Сбросить рекорды и победы</button>'+
 '<button class="btn secondary" data-action="owneroff">Выключить Owner Mode</button>'+
 '<button class="btn danger" data-action="revokeowner">Удалить доступ владельца на этом устройстве</button></div>'+backButton());
 updateProfile();
}
function showEditor(){
 mode='editor';held=false;stopMusic();editorTool='spike';
 shell('Редактор уровней','Выбери объект и нажимай на поле, чтобы расставлять элементы',
 '<div class="levels"><button class="level active" data-action="tool" data-tool="spike">🔺 Шип</button><button class="level" data-action="tool" data-tool="block">🟦 Блок</button><button class="level" data-action="tool" data-tool="portal">🌀 Портал</button></div>'+
 '<p class="muted">Нажимай на игровое поле ниже, чтобы добавить объект. Прокручивай мир кнопками.</p>'+
 '<div class="grid"><button class="btn secondary" data-action="editorleft">← СДВИГ</button><button class="btn secondary" data-action="editorright">СДВИГ →</button></div>'+
 '<div class="grid"><button class="btn" data-action="savelevel">💾 СОХРАНИТЬ</button><button class="btn secondary" data-action="testlevel">▶ ТЕСТ</button></div>'+
 '<button class="btn danger" data-action="clearlevel">ОЧИСТИТЬ ОБЪЕКТЫ</button>'+backButton());
 world=0;
 obstacles=custom.map(function(o){return {x:o.x,w:o.w||34,h:o.h||40,type:o.type}});
 $('hint').textContent='Редактор: нажми на поле, чтобы поставить выбранный объект';draw();
}
function startEditorTest(){
 if(raf)cancelAnimationFrame(raf);
 obstacles=custom.map(function(o){return {x:o.x,w:o.w||34,h:o.h||40,type:o.type}});
 obstacles.push({x:Math.max(1600,...obstacles.map(function(o){return o.x+100})),w:12,h:80,type:'finish'});
 selected=0;world=0;progress=0;gravityFlip=false;resetPlayer();
 mode='playing';overlay.classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop);
}
function resetPlayer(){p.y=G-CUBE;p.vy=0;p.angle=0;p.onGround=true}
function makeLevel(){
 obstacles=[];
 var cfg=levels[selected],x=510,i=0;
 var pattern=[
  ['1','.','.','1','.','2','.','.','1','.','1','.','.','2','.','1','.','.','2','.'],
  ['1','.','2','.','1','.','C','.','2','.','1','.','.','2','.','C','1','.','2','.'],
  ['2','.','1','.','C','.','2','.','1','.','3','.','C','.','2','.','1','.','C','.','2','.']
 ][selected];
 while(x<cfg.length-250){
  var symbol=pattern[i%pattern.length];
  if(symbol==='1'||symbol==='2'||symbol==='3'){
   for(var j=0;j<Number(symbol);j++)obstacles.push({x:x+j*34,w:34,h:selected===2?42:38,type:'spike'});
  }
  x+=Math.max(cfg.gap,selected===0?370:selected===1?340:330)+[0,25,45,15,35][i%5];
  i++;
 }
 if(selected>0)for(i=0;i<2;i++)obstacles.push({x:1800+i*2050,w:35,h:110,type:'portal'});
 obstacles.push({x:cfg.length-110,w:12,h:80,type:'finish'});
}
function reset(){
 world=0;progress=0;held=false;gravityFlip=false;portalCooldown=0;particles=[];
 resetPlayer();makeLevel();refreshHud();
}
function refreshHud(){
 $('levelLabel').textContent=levels[selected].name;
 $('progressText').textContent=progress+'%';
 $('progressFill').style.width=progress+'%';
 }
 
function initAudio(){
 try{
  if(!audioCtx){
   var AC=window.AudioContext||window.webkitAudioContext;
   if(AC)audioCtx=new AC();
  }
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
 }catch(e){}
}

function tone(freq,duration,type,volume){
 if(!audioCtx)return;
 try{
  var osc=audioCtx.createOscillator();
  var gain=audioCtx.createGain();
  osc.type=type||'square';
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(volume||0.035,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+duration);
 }catch(e){}
}

function stopMusic(){
 musicPlaying=false;
 if(musicTimer){
  clearInterval(musicTimer);
  musicTimer=null;
 }
 updateMusicButton();
}

function musicTick(){
 if(!musicPlaying||!audioCtx)return;
 var notes=[392,440,523,440,349,392,466,392];
 tone(notes[musicBeat%notes.length],0.12,'square',0.018);
 musicBeat++;
}

function startMusic(){
 initAudio();
 musicPlaying=!musicPlaying;
 if(musicPlaying){
  musicTick();
  musicTimer=setInterval(musicTick,180);
 }else{
  if(musicTimer)clearInterval(musicTimer);
  musicTimer=null;
 }
 updateMusicButton();
}

function updateMusicButton(){
 var b=$('musicBtn');
 if(b)b.textContent=musicPlaying?'♫ Музыка: ВКЛ':'♫ Музыка: ВЫКЛ';
}

function start(){
 initAudio();
 if(gameState==='playing')return;
 if(gameState==='dead'||gameState==='won')reset();
 gameState='playing';
 overlay.classList.add('hidden');
 lastTime=performance.now();
 requestAnimationFrame(loop);
}

function addParticle(x,y,color,count){
 count=count||8;
 for(var i=0;i<count;i++){
  particles.push({
   x:x,y:y,
   vx:(Math.random()-.5)*6,
   vy:(Math.random()-.7)*6,
   life:30+Math.random()*20,
   max:50,
   size:3+Math.random()*5,
   color:color||'#56e8ff'
  });
 }
}

function jump(){
 if(gameState!=='playing')return;
 if(!player.onGround)return;
 player.vy=-10.5;
 player.onGround=false;
 player.rotation+=Math.PI/2;
 tone(540,0.08,'square',0.025);
 addParticle(player.x+player.size/2,G, '#56e8ff',4);
}

function die(){
 if(gameState!=='playing')return;
 gameState='dead';
 profile.deaths=(profile.deaths||0)+1;
 save();
 addParticle(player.x+player.size/2,player.y+player.size/2,'#ff5577',22);
 tone(120,0.3,'sawtooth',0.05);
 showEndPanel(false);
}

function win(){
 if(gameState!=='playing')return;
 gameState='won';
 profile.wins=(profile.wins||0)+1;
 profile.xp=(profile.xp||0)+100;
 profile.stars=(profile.stars||0)+10;
 profile.coins=(profile.coins||0)+25;
 save();
 tone(660,0.12,'square',0.04);
 setTimeout(function(){tone(880,0.2,'square',0.04)},120);
 showEndPanel(true);
}

function showEndPanel(won){
 overlay.classList.remove('hidden');
 content.innerHTML=
  '<div class="panel-title">'+(won?'УРОВЕНЬ ПРОЙДЕН!':'СТОЛКНОВЕНИЕ!')+'</div>'+
  '<p>'+(won?'⭐ +10 звёзд · 🪙 +25 монет · XP +100':'Попробуй ещё раз!')+'</p>'+
  '<button class="primary" data-action="start">↻ Играть снова</button>'+
  '<button data-action="levels">☰ Выбрать уровень</button>'+
  '<button data-action="menu">⌂ Главное меню</button>';
}

function update(dt){
 if(gameState!=='playing')return;

 var step=dt/16.67;
 var speed=levels[selected].speed||5;
 worldX+=speed*step;
 player.vy+=0.58*step;
 player.y+=player.vy*step;

 if(player.y+player.size>=G){
  player.y=G-player.size;
  player.vy=0;
  player.onGround=true;
 }

 if(holding&&player.onGround){
  jump();
 }

 var obstacles=levels[selected].obstacles||[];
 for(var i=0;i<obstacles.length;i++){
  var o=obstacles[i];
  var ox=o.x-worldX+cameraX;
  if(ox<-100||ox>W+100)continue;

  var px=player.x,py=player.y,ps=player.size;
  var hitX=px+ps>ox+5&&px<ox+o.w-5;
  var hitY=py+ps>G-o.h+8;

  if(hitX&&hitY){
   die();
   return;
  }
 }

 var finish=levels[selected].length||5000;
 progress=Math.min(100,Math.floor(worldX/finish*100));
 refreshHud();

 for(var j=particles.length-1;j>=0;j--){
  var p=particles[j];
  p.x+=p.vx*step;
  p.y+=p.vy*step;
  p.vy+=0.12*step;
  p.life-=step;
  if(p.life<=0)particles.splice(j,1);
 }

 if(worldX>=finish)win();
}

function draw(){
 ctx.clearRect(0,0,W,H);

 var bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,'#101a3b');
 bg.addColorStop(1,'#24123f');
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,W,H);

 ctx.strokeStyle='rgba(95,220,255,.12)';
 ctx.lineWidth=1;
 for(var gx=0;gx<W;gx+=40){
  ctx.beginPath();
  ctx.moveTo(gx,0);
  ctx.lineTo(gx,H);
  ctx.stroke();
 }
 for(var gy=10;gy<H;gy+=40){
  ctx.beginPath();
  ctx.moveTo(0,gy);
  ctx.lineTo(W,gy);
  ctx.stroke();
 }

 ctx.fillStyle='#17264b';
 ctx.fillRect(0,G,W,H-G);
 ctx.fillStyle='#56e8ff';
 ctx.fillRect(0,G,W,4);

 var obstacles=levels[selected].obstacles||[];
 for(var i=0;i<obstacles.length;i++){
  var o=obstacles[i];
  var ox=o.x-worldX+cameraX;
  if(ox<-80||ox>W+80)continue;

  ctx.fillStyle='#ff5577';
  ctx.beginPath();
  ctx.moveTo(ox,G);
  ctx.lineTo(ox+o.w/2,G-o.h);
  ctx.lineTo(ox+o.w,G);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle='#ffd2df';
  ctx.lineWidth=2;
  ctx.stroke();
 }

 var finishX=(levels[selected].length||5000)-worldX+cameraX;
 if(finishX>-50&&finishX<W+50){
  ctx.fillStyle='#ffe66d';
  ctx.fillRect(finishX,G-100,5,100);
  ctx.fillStyle='#ffe66d';
  ctx.beginPath();
  ctx.moveTo(finishX+5,G-100);
  ctx.lineTo(finishX+42,G-87);
  ctx.lineTo(finishX+5,G-74);
  ctx.closePath();
  ctx.fill();
 }

 for(var j=0;j<particles.length;j++){
  var p=particles[j];
  ctx.globalAlpha=Math.max(0,p.life/p.max);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,p.size,p.size);
 }
 ctx.globalAlpha=1;

 if(gameState==='playing'||gameState==='ready'){
  ctx.save();
  ctx.translate(player.x+player.size/2,player.y+player.size/2);
  ctx.rotate(player.rotation);
  ctx.fillStyle=currentSkin().color||'#56e8ff';
  ctx.fillRect(-player.size/2,-player.size/2,player.size,player.size);
  ctx.strokeStyle='#ffffff';
  ctx.lineWidth=2;
  ctx.strokeRect(-player.size/2,-player.size/2,player.size,player.size);
  ctx.fillStyle='#10203a';
  ctx.fillRect(-8,-5,5,5);
  ctx.fillRect(3,-5,5,5);
  ctx.restore();
 }

 if(gameState==='playing'&&holding&&player.onGround){
  // Удержание экрана включает автопрыжок.
 }
}

function loop(now){
 if(gameState!=='playing'){
  draw();
  return;
 }
 var dt=Math.min(34,now-lastTime||16.67);
 lastTime=now;
 update(dt);
 draw();
 if(gameState==='playing')requestAnimationFrame(loop);
}

function action(name,b){
 if(name==='start'){
  start();
  return;
 }
 if(name==='menu'){
  stopMusic();
  menu();
  return;
 }
 if(name==='levels'){
  showLevels();
  return;
 }
 if(name==='shop'){
  showShop();
  return;
 }
 if(name==='stats'){
  showStats();
  return;
 }
 if(name==='achievements'){
  showAchievements();
  return;
 }
 if(name==='daily'){
  claimDaily();
  return;
 }
 if(name==='music'){
  startMusic();
  return;
 }
 if(name==='profile'){
  updateProfile();
  return;
 }
 if(name==='editor'){
  showEditor();
  return;
 }
 if(name==='testeditor'){
  startEditorTest();
  return;
 }
 if(name==='back'){
  menu();
  return;
 }
 if(name==='retry'){
  reset();
  start();
  return;
 }

 if(name==='owneroff'){
  ownerMode=false;
  menu();
  return;
 }
 if(name==='revokeowner'){
  try{localStorage.removeItem(OWNER_KEY)}catch(e){}
  ownerMode=false;
  profile.nick='Player';
  save();
  menu();
  notify('Доступ владельца отключён');
  return;
 }

 if(name==='unlockall'){
  if(!hasOwnerAccess()){notify('Нет доступа');return}
  levels.forEach(function(l){l.unlocked=true});
  save();
  showOwnerPanel();
  notify('Уровни открыты');
  return;
 }
 if(name==='resetstats'){
  if(!hasOwnerAccess()){notify('Нет доступа');return}
  profile.xp=0;
  profile.stars=0;
  profile.coins=0;
  profile.wins=0;
  profile.deaths=0;
  save();
  showOwnerPanel();
  notify('Статистика сброшена');
  return;
 }
 if(name==='grant'){
  if(!hasOwnerAccess()){notify('Нет доступа');return}
  var amount=Number($('grantAmount')&&$('grantAmount').value)||0;
  var kind=$('grantKind')&&$('grantKind').value||'stars';
  amount=Math.max(0,Math.min(1000000,Math.floor(amount)));
  if(kind==='stars')profile.stars=(profile.stars||0)+amount;
  else if(kind==='coins')profile.coins=(profile.coins||0)+amount;
  else if(kind==='xp')profile.xp=(profile.xp||0)+amount;
  save();
  showOwnerPanel();
  notify('Начислено: '+amount);
  return;
 }
 if(name==='savelevel'){
  save();
  notify('Сохранено');
  return;
 }
}

function clickHandler(e){
 var b=e.target.closest('[data-action]');
 if(!b)return;
 e.preventDefault();
 action(b.getAttribute('data-action'),b);
}

document.addEventListener('click',clickHandler);

var holding=false;
var holdPointer=null;

function press(e){
 if(e&&e.target&&e.target.closest&&e.target.closest('button'))return;
 if(gameState!=='playing')return;
 holding=true;
 holdPointer=e.pointerId;
 if(e.pointerId!==undefined&&canvas.setPointerCapture){
  try{canvas.setPointerCapture(e.pointerId)}catch(err){}
 }
 if(player.onGround)jump();
}

function release(e){
 holding=false;
 holdPointer=null;
}

canvas.addEventListener('pointerdown',press);
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);
canvas.addEventListener('pointerleave',release);

window.addEventListener('keydown',function(e){
 if(e.code==='Space'||e.code==='ArrowUp'){
  e.preventDefault();
  if(gameState!=='playing')start();
  else if(player.onGround)jump();
 }
});
window.addEventListener('keyup',function(e){
 if(e.code==='Space'||e.code==='ArrowUp')release(e);
});

function showError(message){
 try{
  var el=$('errorMessage');
  if(el){
   el.textContent='Ошибка: '+message;
   el.style.display='block';
  }
 }catch(e){}
}

window.addEventListener('error',function(e){
 showError(e.message||'неизвестная ошибка');
});

window.addEventListener('unhandledrejection',function(e){
 showError(e.reason&&e.reason.message?e.reason.message:String(e.reason||'ошибка'));
});

readStore();
updateMusicButton();
reset();
menu();

})();
</script>
