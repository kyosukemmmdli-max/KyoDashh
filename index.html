<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b1c;color:#fff;font-family:Arial,sans-serif}

.logoSmall{

}

.panel{width:min(94vw,460px);max-height:88dvh;overflow:auto;overscroll-behavior:contain;background:linear-gradient(145deg,#172750,#090f25);border:1px solid #315a91;border-radius:17px;padding:12px;text-align:center;box-shadow:0 0 35px #12295b55}
.title{font-size:clamp(26px,7vw,36px);margin:0 0 4px;color:#41e9ff;letter-spacing:1px;text-shadow:0 0 16px #1bcfff44}

.profile{padding:8px;margin:7px 0;background:#0b1530;border:1px solid #2b4776;border-radius:11px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:7px 0}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.btn{width:100%;padding:9px 7px;background:linear-gradient(90deg,#25dfff,#67ffc5);color:#061327;border:0;border-radius:9px;font-weight:900;margin:2px 0;font-size:13px}
.secondary{background:#142343;border:1px solid #34517f;color:#d9e9ff}
.danger{background:#48203b;color:#ffcbde;border:1px solid #8d416c}
.level{background:#111c38;border:1px solid #30466f;color:#e1edff;border-radius:9px;padding:10px 3px;font-weight:900}
.level.active{border-color:#3be9ff;background:#12314c;box-shadow:inset 0 0 12px #26dfff18}
.level small{display:block;font-size:9px;margin-top:5px;color:#a9c9f4}
.card{background:#0b1530;border:1px solid #2a426c;border-radius:12px;padding:11px;text-align:left;min-width:0}
.card h3{font-size:14px;margin:0 0 7px;color:#58e9ff}
.card p{font-size:12px;color:#b6c9eb;line-height:1.4;margin:5px 0}
.muted{color:#8fa8d5;font-size:11px}
input,select{width:100%;padding:10px;background:#080f23;border:1px solid #34527f;color:white;border-radius:9px;margin:5px 0}
.xpbar{height:6px;background:#243353;border-radius:20px;overflow:hidden;margin-top:7px}
#xpFill{height:100%;width:0;background:linear-gradient(90deg,#34dfff,#63ffb3)}
.hidden{display:none!important}
.rainbow{font-weight:1000;background:linear-gradient(90deg,#ff5478,#ffd94e,#56ffac,#42dfff,#c274ff,#ff5478);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 3s linear infinite}
.nick-blue{color:#43a5ff}.nick-red{color:#ff5c68}.nick-green{color:#55ef9a}.nick-yellow{color:#ffe45c}
.avatar-choice{font-size:21px;padding:6px;border:1px solid #34517f;background:#111c38;border-radius:9px;cursor:pointer}.avatar-choice.active{border-color:#41e9ff;background:#12314c;box-shadow:0 0 12px #26dfff33}.avatar-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:6px 0}.owner-name{color:#ffe28a!important;text-shadow:0 0 7px #ffc83d,0 0 18px #ff9d22;animation:ownerPulse 2.2s ease-in-out infinite}.owner-badge{display:inline-flex;gap:4px;padding:3px 7px;border:1px solid #ffd66b;border-radius:999px;background:linear-gradient(120deg,#49340c,#1b2342);color:#ffe28a;font-size:10px;font-weight:900}.quest-card{background:linear-gradient(135deg,#102544,#10182f);border:1px solid #3b6a91;border-radius:12px;padding:10px;margin:7px 0;text-align:left}.quest-row{display:flex;gap:8px;align-items:flex-start;margin:8px 0}.quest-icon{font-size:22px}.quest-copy{flex:1;font-size:12px;color:#c6d8f5}.quest-copy b{display:block;color:#fff;margin-bottom:3px}.quest-progress{height:5px;background:#263958;border-radius:10px;overflow:hidden;margin-top:5px}.quest-progress span{display:block;height:100%;background:linear-gradient(90deg,#36dfff,#72ffb8)}.owner-tag{font-size:10px;color:#ffe28a;margin-left:5px}@keyframes ownerPulse{50%{text-shadow:0 0 12px #ffc83d,0 0 24px #ff9d22}}.overlay:not(.hidden) .panel{animation:panelIn .22s ease-out}.btn,.smallbtn,.level,.avatar-choice{transition:transform .15s ease,filter .2s ease,box-shadow .2s ease}.btn:hover,.smallbtn:hover,.level:hover,.avatar-choice:hover{filter:brightness(1.12);box-shadow:0 0 13px #36dfff22}@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}.title-chip{display:inline-block;padding:3px 7px;border:1px solid #42618f;border-radius:999px;color:#b8dcff;font-size:10px;margin-left:4px}.notice{padding:10px;background:#111d39;border:1px solid #2d4774;border-radius:10px;margin:7px 0;text-align:left}.notice.unread{border-color:#42eaff;background:#102543}.notice small{display:block;color:#91a8d4;margin-top:4px}
@keyframes rainbow{to{background-position:300% 50%}}
#message{position:fixed;z-index:20;top:12px;left:10px;right:10px;text-align:center;pointer-events:none}
.toast{display:inline-block;padding:10px 14px;border-radius:10px;background:#17294c;border:1px solid #42eaff;color:white;font-size:13px;box-shadow:0 6px 30px #0008}
#errorBox{display:none;position:fixed;z-index:30;bottom:5px;left:5px;right:5px;padding:12px;border-radius:10px;background:#681e32;color:#fff;font-size:12px;overflow-wrap:anywhere}
#editorBar{position:fixed;z-index:8;left:5px;right:5px;bottom:7px;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding:7px;background:rgba(15,25,43,.96);border:1px solid #61748b;border-radius:12px;box-shadow:0 5px 22px #0006}
#editorBar .smallbtn{padding:9px 10px;color:#e5edf4;background:#29364a;border-color:#53657a}
#editorBar .smallbtn.active{background:#dce7ef;color:#1b2939;border-color:#fff}
@media(max-width:440px){#editorBar{gap:4px;padding:5px}#editorBar .smallbtn{padding:8px 7px;font-size:10px}}
@media(max-width:440px){.app{padding:5px;gap:5px}.logoSmall{font-size:15px}.smallbtn{padding:7px;font-size:10px}.panel{width:94vw;padding:10px;border-radius:15px;max-height:86dvh}.card{padding:8px}.profile{padding:7px;margin:6px 0}input,select{padding:8px;margin:3px 0}.level{padding:8px 2px}.avatar-choice{font-size:20px;padding:5px}.muted{font-size:10px}}
@media(max-height:560px){.app{gap:4px;padding:4px}.panel{padding:10px;max-height:98dvh}.profile{padding:7px;margin:7px 0}.grid,.levels{gap:5px;margin:7px 0}.title{font-size:29px}}
</style>
</head>
<body>
<main class="app">
 <header class="top">
  <span class="logoSmall" id="gameLogo" oncontextmenu="return false" onselectstart="return false" draggable="false">Kyo Dash</span>
  <span class="stat" id="levelLabel">EASY</span>
  <span class="stat" id="progressText">0%</span>
  <button class="smallbtn" data-action="music" id="musicBtn">♫ MUSIC ON</button>
  <button class="smallbtn" data-action="menu">MENU</button>
 </header>
 <div class="meter"><div id="progressFill"></div></div>
 <canvas id="game" width="900" height="420"></canvas>
 <div class="hint" id="hint">Тапни по экрану, чтобы прыгнуть · Удерживай для автопрыжка</div>
</main>

<div class="overlay" id="overlay">
 <section class="panel">
  <h1 class="title" id="panelTitle">Kyo Dash</h1>
  <p class="subtitle" id="panelSubtitle">BIG UPDATE · Прыгай, собирай награды и создавай уровни!</p>
  <div id="panelContent"></div>
 </section>
</div>
<div id="message"></div>
<div id="errorBox"></div>
<div id="editorBar" class="hidden" aria-label="Панель редактора">
 <button class="smallbtn active" data-action="tool" data-tool="spike">🔺 Шип</button>
 <button class="smallbtn" data-action="tool" data-tool="block">🟦 Блок</button>
 <button class="smallbtn" data-action="tool" data-tool="portal">🌀 Портал</button>
 <button class="smallbtn" data-action="editorleft">←</button>
 <button class="smallbtn" data-action="editorright">→</button>
 <button class="smallbtn" data-action="savelevel">💾</button>
 <button class="smallbtn" data-action="testlevel">▶ Тест</button>
 <button class="smallbtn" data-action="clearlevel">Очистить</button>
 <button class="smallbtn" data-action="menu">В меню</button>
</div>

<script>
(function(){
'use strict';

var $=function(id){return document.getElementById(id)};
var canvas=$('game'),ctx=canvas.getContext('2d');
var overlay=$('overlay'),content=$('panelContent');
var W=900,H=420,G=330,CUBE=34;
var STORE='kyoDashBigUpdateV1';
var ACCOUNT_STORE='kyoDashAccountsV1';
var CURRENT_ACCOUNT_STORE='kyoDashCurrentAccountV1';
// Автоматическое восстановление последнего аккаунта при повторном открытии игры.
var accounts=[],currentAccount=null;

/* Уровни */
var levels=[
 {name:'EASY',speed:285,jump:-555,gravity:1550,length:5700,gap:390},
 {name:'MEDIUM',speed:295,jump:-565,gravity:1600,length:6500,gap:350},
 {name:'HARD',speed:310,jump:-575,gravity:1650,length:7200,gap:330}
];

var profile={nickname:'Player',nicknameColor:'blue',avatarId:'fox',customAvatarData:'',title:'Новичок',xp:0,coins:0};
var notifications=[];
var dailyQuestDate='',dailyQuestState={plays:0,wins:0,xp:0,claimed:{}};
var dailyQuestDefs=[{id:'plays',icon:'🎮',name:'Сыграй 3 раунда',desc:'Запусти игру три раза за сегодня',goal:3,reward:40},{id:'wins',icon:'🏁',name:'Пройди уровень',desc:'Заверши любой уровень',goal:1,reward:75},{id:'xp',icon:'⚡',name:'Набери 100 XP',desc:'Заработай опыт за прохождение',goal:100,reward:60}];
var avatarCatalog=[{id:'fox',emoji:'🦊',name:'Лис'},{id:'cat',emoji:'🐱',name:'Кот'},{id:'robot',emoji:'🤖',name:'Робот'},{id:'ninja',emoji:'🥷',name:'Ниндзя'},{id:'dragon',emoji:'🐉',name:'Дракон'},{id:'ghost',emoji:'👻',name:'Призрак'},{id:'star',emoji:'🌟',name:'Звезда'},{id:'alien',emoji:'👽',name:'Пришелец'},{id:'crown',emoji:'👑',name:'Корона'},{id:'panda',emoji:'🐼',name:'Панда'},{id:'rocket',emoji:'🚀',name:'Ракета'},{id:'gem',emoji:'💎',name:'Кристалл'}];
var selected=0,mode='menu',world=0,progress=0,last=0,raf=0;
var held=false,obstacles=[],particles=[],custom=[];
var best=[0,0,0],wins=[false,false,false],achieved={};
var unlocked=['cyan'],skin='cyan',dailyClaim='',editorTool='spike';
var gravityFlip=false,portalCooldown=0;
var testerMode=false,customTesting=false;
var levelBackgrounds=[
 {top:'#30394d',mid:'#293449',bottom:'#1c2638',far:'#354057',near:'#2b374b',ground:'#222d40',line:'#9aaec0'},
 {top:'#293c3b',mid:'#263635',bottom:'#1b292b',far:'#304543',near:'#293b39',ground:'#202f2f',line:'#91b5a8'},
 {top:'#393342',mid:'#302b3c',bottom:'#211f30',far:'#42394b',near:'#342d40',ground:'#292537',line:'#b1a0b9'}
];
var p={x:150,y:G-CUBE,vy:0,angle:0,onGround:true};
var musicEnabled=true,audioCtx=null,musicTimer=null,musicStep=0,musicGeneration=0; if(levelNum()>=5)opts.push('Ветеран');
 if(wins.every(Boolean))opts.push('Легенда');
 if(isOwnerAccount())opts.push('Владелец');
 return opts;
}
function applyGameData(d){
 if(!d||typeof d!=='object')return;
 if(d.profile&&typeof d.profile==='object'){
  profile.nickname=String(d.profile.nickname||'Player').trim().slice(0,16);
  profile.nicknameColor=['blue','red','rainbow','green','yellow'].includes(d.profile.nicknameColor)?d.profile.nicknameColor:'blue';
  profile.avatarId=avatarCatalog.some(function(a){return a.id===d.profile.avatarId})?d.profile.avatarId:'fox';
  profile.customAvatarData=(currentAccount&&String(currentAccount.username).toLowerCase()==='kyosuke'&&typeof d.profile.customAvatarData==='string'&&d.profile.customAvatarData.startsWith('data:image/')&&d.profile.customAvatarData.length<2500000)?d.profile.customAvatarData:'';
  profile.title=['Новичок','Ветеран','Легенда','Владелец'].includes(d.profile.title)?d.profile.title:'Новичок';
  if(profile.title==='Владелец'&&(!currentAccount||currentAccount.username.toLowerCase()!=='kyosuke'))profile.title='Новичок';
  profile.xp=Math.max(0,Number(d.profile.xp)||0);
  profile.coins=Math.max(0,Number(d.profile.coins)||0);
 }
 if(Array.isArray(d.best)&&d.best.length===3)best=d.best.map(function(v){return Math.max(0,Number(v)||0)});
 if(Array.isArray(d.wins)&&d.wins.length===3)wins=d.wins;
 if(d.achieved&&typeof d.achieved==='object')achieved=d.achieved;
 if(Array.isArray(d.unlocked))unlocked=Array.from(new Set(['cyan'].concat(d.unlocked)));
 if(skinsData.some(function(s){return s.id===d.skin})&&unlocked.indexOf(d.skin)>=0)skin=d.skin;
 if(typeof d.dailyClaim==='string')dailyClaim=d.dailyClaim;
 if(typeof d.dailyQuestDate==='string')dailyQuestDate=d.dailyQuestDate;
 if(d.dailyQuestState&&typeof d.dailyQuestState==='object')dailyQuestState={plays:Math.max(0,Number(d.dailyQuestState.plays)||0),wins:Math.max(0,Number(d.dailyQuestState.wins)||0),xp:Math.max(0,Number(d.dailyQuestState.xp)||0),claimed:d.dailyQuestState.claimed&&typeof d.dailyQuestState.claimed==='object'?d.dailyQuestState.claimed:{}};
 ensureDailyQuests();
 if(Array.isArray(d.custom))custom=d.custom.filter(function(o){return o&&Number.isFinite(o.x)&&['spike','block','portal'].includes(o.type)}).slice(0,100);
 if(typeof d.testerMode==='boolean')testerMode=d.testerMode;
 if(Array.isArray(d.notifications))notifications=d.notifications.filter(function(n){return n&&typeof n.message==='string'}).slice(0,50);
}
function readAccounts(){
 try{
  var raw=JSON.parse(localStorage.getItem(ACCOUNT_STORE)||'{"accounts":[]}');
  accounts=Array.isArray(raw.accounts)?raw.accounts.filter(function(a){return a&&Number.isInteger(a.id)&&a.id>0&&typeof a.username==='string'&&typeof a.password==='string'}):[];
 }catch(e){accounts=[]}
}
function persistAccounts(){
 try{localStorage.setItem(ACCOUNT_STORE,JSON.stringify({accounts:accounts}))}catch(e){notify('Не удалось сохранить аккаунты в браузере')}
}
function readStore(){
 try{applyGameData(JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){}
 readAccounts();
 try{var savedId=Number(localStorage.getItem(CURRENT_ACCOUNT_STORE));if(savedId>0){currentAccount=accountById(savedId);if(currentAccount){if(currentAccount.data)applyGameData(currentAccount.data);localStorage.setItem(CURRENT_ACCOUNT_STORE,String(currentAccount.id))}else{localStorage.removeItem(CURRENT_ACCOUNT_STORE)}}}catch(e){}
}
function gameData(){
 return {profile:profile,best:best,wins:wins,achieved:achieved,unlocked:unlocked,skin:skin,dailyClaim:dailyClaim,dailyQuestDate:dailyQuestDate,dailyQuestState:dailyQuestState,custom:custom,testerMode:testerMode,notifications:notifications};
}
function save(){
 var d=gameData();
 try{localStorage.setItem(STORE,JSON.stringify(d))}catch(e){notify('Не удалось сохранить: проверь память браузера')}
 if(currentAccount){currentAccount.data=d;persistAccounts();try{localStorage.setItem(CURRENT_ACCOUNT_STORE,String(currentAccount.id))}catch(e){}}
}
function accountById(id){return accounts.find(function(a){return a.id===id})||null}
function nicknameTaken(nickname){
 var wanted=String(nickname||'').trim().toLocaleLowerCase();
 if(!wanted)return false;
 return accounts.some(function(a){
  if(currentAccount&&a.id===currentAccount.id)return false;
  var saved=a&&a.data&&a.data.profile&&a.data.profile.nickname;
  return typeof saved==='string'&&saved.trim().toLocaleLowerCase()===wanted;
 });
}
function showAccountGate(){
 mode='auth';
 stopMusic();
 held=false;
 $('editorBar').classList.add('hidden');
 shell('Вход в Kyo Dash','Чтобы играть, сначала войди или создай аккаунт',
  '<div class="card"><h3>Вход / регистрация обязательны</h3>'+
  '<p>Введи логин и пароль, чтобы продолжить в игру.</p>'+
  '<input id="accountLoginInput" maxlength="20" autocomplete="username" placeholder="Логин (от 3 символов)">'+
  '<input id="accountPasswordInput" type="password" maxlength="64" autocomplete="current-password" placeholder="Пароль (от 4 символов)">'+
  '<div class="grid"><button class="btn" data-action="accountRegister">СОЗДАТЬ АККАУНТ</button>'+
  '<button class="btn secondary" data-action="accountLogin">ВОЙТИ</button></div>'+
  '<p class="muted">Вход обязателен. Аккаунт хранится локально в этом браузере.</p></div>');
}
function showAccount(){
 mode='menu';
 var logged=currentAccount?('<div class="card"><h3>Аккаунт подключён</h3><p>Логин: <b>'+escapeHTML(currentAccount.username)+'</b></p><p>Твой ID: <b>'+currentAccount.id+'</b></p><p class="muted">ID сохранится в этом браузере.</p><button class="btn danger" data-action="logout">ВЫЙТИ ИЗ АККАУНТА</button></div>'):
 '<div class="card"><h3>Вход / регистрация</h3><p>Создай аккаунт, чтобы получить постоянный ID.</p><input id="accountLoginInput" maxlength="20" autocomplete="username" placeholder="Логин (от 3 символов)"><input id="accountPasswordInput" type="password" maxlength="64" autocomplete="current-password" placeholder="Пароль (от 4 символов)"><div class="grid"><button class="btn" data-action="accountRegister">СОЗДАТЬ АККАУНТ</button><button class="btn secondary" data-action="accountLogin">ВОЙТИ</button></div><p class="muted">Важно: это локальная система — аккаунты хранятся только в этом браузере и не синхронизируются между устройствами.</p></div>';
 shell('Аккаунт игрока','Логин, пароль и постоянный ID',logged+backButton());
}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function accountRegister(){
 var u=($('accountLoginInput')||{}).value||'',pw=($('accountPasswordInput')||{}).value||'';
 u=u.trim();
 if(!/^[a-zA-Z0-9_-]{3,20}$/.test(u)){notify('Логин: 3–20 символов, латиница, цифры, _ или -');return}
 if(pw.length<4){notify('Пароль должен быть не короче 4 символов');return}
 if(accounts.some(function(a){return a.username.toLowerCase()===u.toLowerCase()})){notify('Ошибка: такой логин уже существует');return}
 var next=accounts.reduce(function(m,a){return Math.max(m,a.id)},0)+1;
 var a={id:next,username:u,password:pw,data:gameData()};
 accounts.push(a);currentAccount=a; a.data=gameData();try{localStorage.setItem(CURRENT_ACCOUNT_STORE,String(a.id))}catch(e){}persistAccounts();addNotification('Добро пожаловать в Kyo Dash','Аккаунт успешно создан','👋');save();
 if(mode==='auth'){menu()}else{showAccount();updateProfile()}notify('Аккаунт создан! Твой ID: '+next);
}
function accountLogin(){
 var u=(($('accountLoginInput')||{}).value||'').trim(),pw=($('accountPasswordInput')||{}).value||'';
 var a=accounts.find(function(q){return q.username.toLowerCase()===u.toLowerCase()&&q.password===pw});
 if(!a){notify('Неверный логин или пароль');return}
 if(currentAccount) {currentAccount.data=gameData();persistAccounts()}
 currentAccount=a;

function makeLevel(){
 obstacles=[];
 var cfg=levels[selected],x=510,i=0;
 var pattern=[
  ['1','.','.','1','.','2','.','.','1','.','1','.','.','2','.','1','.','.','2','.'],
  ['1','.','2','.','1','.','C','.','2','.','1','.','.','2','.','C','1','.','2','.'],
  ['2','.','1','.','C','.','2','.','1','.','3','.','C','.','2','.','1','.','C','.','2','.']
 ][selected];

 while(x<cfg.length-250){
  var symbol=pattern[i%pattern.length];
  if(symbol==='1'||symbol==='2'||symbol==='3'){
   for(var j=0;j<Number(symbol);j++){
    obstacles.push({x:x+j*34,w:34,h:selected===2?42:38,type:'spike'});
   }
  }
  x+=Math.max(cfg.gap,selected===0?370:selected===1?340:330)+[0,25,45,15,35][i%5];
  i++;
 }

 if(selected>0){
  for(i=0;i<2;i++){
   obstacles.push({x:1800+i*2050,w:35,h:110,type:'portal'});
  }
 }
 obstacles.push({x:cfg.length-110,w:12,h:80,type:'finish'});
}

function initAudio(){
 if(audioCtx)return true;
 var AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return false;
 try{
  audioCtx=new AC();
  return true;
 }catch(e){
  return false;
 }
}

function tone(freq,duration,wave,volume){
 if(!audioCtx||!freq||!musicEnabled)return;
 try{
  var osc=audioCtx.createOscillator();
  var gain=audioCtx.createGain();
  var now=audioCtx.currentTime;
  osc.type=wave||'square';
  osc.frequency.setValueAtTime(freq,now);
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(volume||.04,now+.012);
  gain.gain.setTargetAtTime(.0001,now+duration*.6,Math.max(.015,duration*.15));
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now+duration+.05);
  osc.onended=function(){
   try{osc.disconnect();gain.disconnect()}catch(e){}
  };
 }catch(e){}
}

function stopMusic(){
 musicGeneration++;
 if(musicTimer!==null){
  clearInterval(musicTimer);
  musicTimer=null;
 }
}

function musicTick(){
 if(!musicEnabled||mode!=='playing'||!audioCtx)return;
 var s=songData[selected];
 var beat=s.tempo/1000;
 var note=s.notes[musicStep%s.notes.length];
 if(note)tone(note,beat*.9,s.wave,.035);

 if(musicStep%4===0){
  var bass=s.bass[Math.floor(musicStep/4)%s.bass.length];
  if(bass)tone(bass,beat*1.8,'triangle',.05);
 }
 musicStep++;
}

function startMusic(){
 stopMusic();
 if(!musicEnabled||mode!=='playing'||!initAudio())return;
 var gen=musicGeneration;
 musicStep=0;
 try{
  var r=audioCtx.resume();
  if(r&&r.catch)r.catch(function(){});
 }catch(e){}
 musicTick();
 musicTimer=setInterval(function(){
  if(gen===musicGeneration)musicTick();
 },songData[selected].tempo);
}

 if(!customTesting)checkAchievements();
 refreshHud();
 shell(customTesting?'ТЕСТ КАРТЫ ПРОЙДЕНА!':'УРОВЕНЬ ПРОЙДЕН!',
  customTesting?'Отлично! Твоя карта работает.':'Ты завершил '+levels[selected].name+'!',
  '<div class="card"><h3>🏆 '+(customTesting?'Тест завершён':'Отличная работа!')+'</h3><p>'+(customTesting?'Можешь вернуться в редактор и продолжить настройку карты.':'Награда за победу начислена.')+'</p></div>'+
  (customTesting?'<button class="btn" data-action="retrycustom">↻ ТЕСТИРОВАТЬ ЕЩЁ</button>':'<button class="btn" data-action="start">ИГРАТЬ СНОВА</button>')+
  '<button class="btn secondary" data-action="editor">В РЕДАКТОР</button>'+
  '<button class="btn secondary" data-action="menu">В МЕНЮ</button>');
 draw();
}

function update(dt){
 if(mode!=='playing')return;

 var cfg=levels[selected];
 world+=cfg.speed*dt;
 p.vy+=cfg.gravity*(gravityFlip?-1:1)*dt;
 p.y+=p.vy*dt;

 if(!gravityFlip&&p.y>=G-CUBE){
  p.y=G-CUBE;
  p.vy=0;
  p.onGround=true;
  p.angle=Math.round(p.angle/(Math.PI/2))*(Math.PI/2);
  if(held)jump();
 }else if(gravityFlip&&p.y<=20){
  p.y=20;
  p.vy=0;
  p.onGround=true;
  p.angle=Math.round(p.angle/(Math.PI/2))*(Math.PI/2);
  if(held)jump();
 }else{
  p.onGround=false;
  p.angle+=cfg.speed*dt/CUBE*(Math.PI/2);
 }

 if(portalCooldown>0)portalCooldown-=dt;

 var runLength=cfg.length-110;
  if(customTesting){
   var finishObj=obstacles.find(function(o){return o.type==='finish'});
   if(finishObj)runLength=Math.max(1,finishObj.x);
  }
  progress=Math.min(100,Math.floor(world/runLength*100));
 refreshHud();

 if(progress>best[selected]){
  best[selected]=progress;
  save();
 }

 for(var i=0;i<obstacles.length;i++){
  var o=obstacles[i],ox=o.x-world;

  if(ox>p.x+100||ox+o.w<p.x-80)continue;

  if(o.type==='finish'){
   if(ox<p.x+CUBE*.6){
    win();
    return;
   }
   continue;
  }

  if(o.type==='portal'){
   if(portalCooldown<=0&&ox<p.x+CUBE&&ox+o.w>p.x){
    gravityFlip=!gravityFlip;
    portalCooldown=.7;
    p.vy=0;
    p.onGround=false;
    addParticle(p.x+CUBE/2,p.y,'#bd79ff');
   }
   continue;
  }

  var px1=p.x+5,px2=p.x+CUBE-5;
  var py1=p.y+5,py2=p.y+CUBE-3;

  if(o.type==='block'){
   if(px2>ox&&px1<ox+o.w&&py2>G-o.h&&py1<G){
    die();
    return;
   }
   continue;
  }

  var left=Math.max(px1,ox);
  var right=Math.min(px2,ox+o.w);
  if(left>=right)continue;

  var center=ox+o.w/2;
  var sx=Math.max(ox,Math.min(center,(left+right)/2));
  var surfaceY=G-o.h*(1-Math.abs(sx-center)/(o.w/2));

  if(py2>surfaceY+2&&py1<G){
   die();
   return;
   } }

 for(i=particles.length-1;i>=0;i--){
  var part=particles[i];
  part.x+=part.vx*dt;
  part.y+=part.vy*dt;
  part.life-=dt;
  if(part.life<=0)particles.splice(i,1);
 }
}

function draw(){
 ctx.clearRect(0,0,W,H);

 var bg=levelBackgrounds[selected]||levelBackgrounds[0];
 var grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,bg.top);
 grad.addColorStop(.58,bg.mid);
 grad.addColorStop(1,bg.bottom);
 ctx.fillStyle=grad;
 ctx.fillRect(0,0,W,H);

 /* Свой спокойный фон для каждого уровня */
 for(var si=0;si<34;si++){
  var sx=(si*137+35)%W, sy=22+(si*47)%175;
  ctx.fillStyle='rgba(225,230,238,'+(0.14+(si%3)*0.06)+')';
  ctx.fillRect(sx,sy,2,2);
 }
 ctx.fillStyle=bg.far;
 ctx.beginPath();ctx.moveTo(0,285);
 for(var mx=0;mx<=W;mx+=90)ctx.lineTo(mx,245+((mx*7)%55));
 ctx.lineTo(W,G);ctx.lineTo(0,G);ctx.closePath();ctx.fill();
 ctx.fillStyle=bg.near;
 ctx.beginPath();ctx.moveTo(0,310);
 for(var hx=0;hx<=W;hx+=100)ctx.lineTo(hx,275+((hx*11)%38));
 ctx.lineTo(W,G);ctx.lineTo(0,G);ctx.closePath();ctx.fill();

 /* Тонкая сетка без яркого свечения */
 var off=-(world*.3%45);
 ctx.strokeStyle='rgba(190,205,218,.09)';
 for(var x=off;x<W;x+=45){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,G);ctx.stroke();
 }
 for(var y=42;y<G;y+=45){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }
 ctx.fillStyle=bg.ground;
 ctx.fillRect(0,G,W,H-G);
 ctx.fillStyle=bg.line;
 ctx.fillRect(0,G,W,3);
 for(x=-(world%50);x<W;x+=50){
  ctx.fillStyle='rgba(151,174,194,.28)';
  ctx.fillRect(x,G+17,25,3);
 }

 if(gravityFlip){
  ctx.fillStyle='#bd79ff';
  ctx.fillRect(0,0,W,4);
 }

 for(var i=0;i<obstacles.length;i++){
  var o=obstacles[i],ox=o.x-world;
  if(ox>W+100||ox+o.w<-100)continue;

  if(o.type==='finish'){
   ctx.fillStyle='#68ffbd';
   ctx.fillRect(ox,G-o.h,o.w,o.h);
   ctx.fillStyle='#ffffff';
   for(var fy=G-o.h;fy<G;fy+=12){
    for(var fx=ox;fx<ox+o.w;fx+=12){
     if(((fy+fx)/12|0)%2===0)ctx.fillRect(fx,fy,6,6);
    }
   }
   continue;
  }

  if(o.type==='portal'){
   ctx.save();
   ctx.shadowBlur=12;
   ctx.shadowColor='#bd79ff';
   ctx.strokeStyle='#bd79ff';
   ctx.lineWidth=4;
   ctx.beginPath();
   ctx.ellipse(ox+o.w/2,G-o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);
   ctx.stroke();
   ctx.restore();
   continue;
  }

  if(o.type==='block'){
   ctx.fillStyle='#f06b88';
   ctx.fillRect(ox,G-o.h,o.w,o.h);
   ctx.fillStyle='rgba(255,255,255,.22)';
   ctx.fillRect(ox+4,G-o.h+4,o.w-8,4);
   continue;
  }

  ctx.fillStyle='#ff617c';
  ctx.beginPath();
  ctx.moveTo(ox,G);
  ctx.lineTo(ox+o.w/2,G-o.h);
  ctx.lineTo(ox+o.w,G);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#ffb3c2';
  ctx.lineWidth=2;
  ctx.stroke();
 }

 for(i=0;i<particles.length;i++){
  var pt=particles[i];
  ctx.globalAlpha=Math.max(0,pt.life/.4);
  ctx.fillStyle=pt.color;
  ctx.fillRect(pt.x,pt.y,4,4);
 }
 ctx.globalAlpha=1;

 var cs=currentSkin();
 ctx.save();
 ctx.translate(p.x+CUBE/2,p.y+CUBE/2);
 ctx.rotate(p.angle);
 ctx.fillStyle=cs.color;
 ctx.fillRect(-CUBE/2,-CUBE/2,CUBE,CUBE);
 ctx.strokeStyle='#ffffff';
 ctx.lineWidth=2;
 ctx.strokeRect(-CUBE/2,-CUBE/2,CUBE,CUBE);
 ctx.fillStyle='rgba(255,255,255,.24)';
 ctx.fillRect(-CUBE/2+5,-CUBE/2+5,CUBE-10,4);
 ctx.restore();

 if(mode==='dead'||mode==='win'){
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.fillRect(0,0,W,H);
 }
}

function loop(now){
 if(mode!=='playing'){raf=0;return}
 var dt=Math.min((now-last)/1000,.035);
 last=now;
 update(dt);
 draw();
 if(mode==='playing')raf=requestAnimationFrame(loop);
 else raf=0;
}

function toggleMusic(){
 musicEnabled=!musicEnabled;
 updateMusicButton();
 if(musicEnabled)startMusic();
 else stopMusic();
 notify(musicEnabled?'Музыка включена':'Музыка выключена');
}

function chooseLevel(i){
 if(!Number.isInteger(i)||i<0||i>=levels.length)return;
 selected=i;
 reset();
 refreshHud();
 draw();
 menu();
}

function selectSkin(id){
 var s=skinsData.find(function(v){return v.id===id});
 if(!s)return;
 if(unlocked.indexOf(id)>=0){
  skin=id;save();showShop();draw();updateProfile();return;
 }
 if(profile.coins<s.price){notify('Недостаточно монет');return}
 profile.coins-=s.price;
 unlocked.push(id);
 skin=id;
 save();checkAchievements();showShop();draw();updateProfile();
 notify('Скин открыт: '+s.name);
}

function saveNickname(){
 var input=$('nickInput');
 var color=$('nickColorInput');
 var title=$('titleInput');
 if(!input)return;
 var n=input.value.trim();
 if(n.length<2||n.length>16){notify('Ник должен содержать 2–16 символов');return}
 if(nicknameTaken(n)){notify('Этот ник уже занят');return}
 profile.nickname=n;
 if(color&&['blue','red','rainbow','green','yellow'].includes(color.value))profile.nicknameColor=color.value;
 if(title){
  var allowed=getTitleOptions();
  if(allowed.indexOf(title.value)>=0)profile.title=title.value;
  else profile.title='Новичок';
 }
 save();updateProfile();showProfileSettings();
 notify('Профиль сохранён');
  } obstacles.forEach(function(o){
  var ox=o.x-world;
  if(ox<-100||ox>W+100)return;

  if(o.type==='spike'){
   ctx.fillStyle=selected===2?'#ff3d8c':
     selected===1?'#ff7868':'#ff4d83';
   ctx.beginPath();
   ctx.moveTo(ox,G);
   ctx.lineTo(ox+o.w/2,G-o.h);
   ctx.lineTo(ox+o.w,G);
   ctx.closePath();
   ctx.fill();
   ctx.strokeStyle='#ffd0e0';
   ctx.lineWidth=2;
   ctx.stroke();

  }else if(o.type==='block'){
   ctx.fillStyle='#42dfff';
   ctx.fillRect(ox,G-o.h,o.w,o.h);
   ctx.strokeStyle='#d4fbff';
   ctx.strokeRect(ox,G-o.h,o.w,o.h);

  }else if(o.type==='portal'){
   ctx.strokeStyle='#c18aff';
   ctx.lineWidth=7;
   ctx.beginPath();
   ctx.ellipse(ox+o.w/2,G-o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);
   ctx.stroke();

  }else if(o.type==='finish'){
   ctx.fillStyle='#4dffb4';
   ctx.fillRect(ox,G-o.h,8,o.h);
   ctx.fillStyle='#e6fff5';
   ctx.font='bold 18px Arial';
   ctx.fillText('FINISH',ox-26,G-o.h-12);
  }
 });

 particles.forEach(function(q){
  ctx.globalAlpha=Math.max(0,q.life/.4);
  ctx.fillStyle=q.color;
  ctx.fillRect(q.x,q.y,5,5);
 });
 ctx.globalAlpha=1;

 var s=currentSkin();
 ctx.save();
 ctx.translate(p.x+CUBE/2,p.y+CUBE/2);
 ctx.rotate(p.angle);
 ctx.shadowColor=s.glow;
 ctx.shadowBlur=17;
 ctx.fillStyle=s.color;
 ctx.fillRect(-CUBE/2,-CUBE/2,CUBE,CUBE);
 ctx.shadowBlur=0;
 ctx.strokeStyle='#ffffffd9';
 ctx.lineWidth=3;
 ctx.strokeRect(-CUBE/2+2,-CUBE/2+2,CUBE-4,CUBE-4);
 ctx.fillStyle='#0a2041';
 ctx.fillRect(-9,-7,5,7);
 ctx.fillRect(4,-7,5,7);
 ctx.restore();
}

function loop(now){
 var dt=Math.min((now-last)/1000,.025);
 last=now;
 update(dt);
 draw();
 if(mode==='playing')raf=requestAnimationFrame(loop);
 else raf=0;
}function action(name,b){
 if(name==='accountSettings'){showProfileSettings();return}
 if(name==='nick'){
  var input=$('nickInput');
  var v=input?input.value.trim():'';


  if(v.length<2){
   notify('Ник должен содержать хотя бы 2 символа');
   return;
  }


  v=v.slice(0,16);
  if(nicknameTaken(v)){
   notify('Ошибка: этот ник уже занят');
   return;
  }
  var colorInput=$('nickColorInput');
  var chosenColor=colorInput?colorInput.value:'blue';
  if(!['blue','red','rainbow','green','yellow'].includes(chosenColor))chosenColor='blue';
  var titleInput=$('titleInput');
  var chosenTitle=titleInput?titleInput.value:'Новичок';
  if(!getTitleOptions().includes(chosenTitle)){notify('Этот титул ещё не открыт');return}
  if(chosenTitle==='Владелец'&&!isOwnerAccount()){notify('Этот титул доступен только владельцу');return}
  var avatarButton=document.querySelector('[data-action="avatar"].active');
  profile.nickname=v;
  profile.nicknameColor=chosenColor;
  profile.title=chosenTitle;
  save();
  updateProfile();
  addNotification('Профиль обновлён','Ник, цвет или титул сохранены','👤');
  notify('Профиль сохранён');
  menu();
  return;
 }

 if(name==='menu'){
  if(raf)cancelAnimationFrame(raf);
  raf=0;
  held=false;
  menu();
  return;
 }

 if(name==='start'){start();return}

 if(name==='music'){
  musicEnabled=!musicEnabled;
  updateMusicButton();
  if(musicEnabled&&mode==='playing')startMusic();
  else stopMusic();
  return;
 }

 if(name==='level'){
  var n=Number(b.dataset.level);
  if(n<0||n>2||!Number.isInteger(n))return;
  selected=n;
  menu();
  return;
 }

 if(name==='shop'){showShop();return}
 if(name==='notifications'){showNotifications();return}
 if(name==='clearNotifications'){notifications=[];save();showNotifications();notify('Уведомления очищены');return}
 if(name==='removeOwnerAvatar'){if(!isOwnerAccount()){notify('Недоступно');return}profile.customAvatarData='';save();showProfileSettings();notify('Возвращён стандартный аватар');return}
 if(name==='avatar'){
  if(profile.customAvatarData&&isOwnerAccount())profile.customAvatarData='';
  var avatarId=b.dataset.avatar;
  if(!avatarCatalog.some(function(a){return a.id===avatarId}))return;
  profile.avatarId=avatarId;
  document.querySelectorAll('[data-action="avatar"]').forEach(function(el){el.classList.toggle('active',el.dataset.avatar===avatarId)});
  var av=avatarCatalog.find(function(a){return a.id===avatarId});
  if($('avatarPreview'))$('avatarPreview').textContent=av.emoji;
  save();
  return;
 }
 if(name==='achievements'){showAchievements();return}
 if(name==='stats'){showStats();return}
 if(name==='daily'){daily();return}
 if(name==='quests'){showDailyQuests();return}
 if(name==='claimQuest'){claimQuest(b.dataset.quest);return}
 if(name==='claim'){claimDaily();return}

 if(name==='buy'||name==='equip'){
  var id=b.dataset.skin;
  var s=skinsData.find(function(q){return q.id===id});
  if(!s)return;

  if(name==='buy'){
   if(unlocked.indexOf(id)>=0){
    skin=id;
   }else if(profile.coins>=s.price){
    profile.coins-=s.price;
    unlocked.push(id);
    skin=id;
    notify('Скин открыт!');
   }else{ if(!b||b.disabled)return;

 e.preventDefault();

 try{
  action(b.dataset.action,b);
 }catch(err){
  showError(err);
 }
}

document.addEventListener('click',clickHandler,true);

/* Загрузка пользовательского аватара владельца из галереи */
document.addEventListener('change',function(e){
 var input=e.target;
 if(!input||input.id!=='ownerAvatarFile')return;
 if(!isOwnerAccount()){notify('Загрузка аватара доступна только Kyosuke');input.value='';return;}
 var file=input.files&&input.files[0];
 if(!file)return;
 if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){notify('Выбери изображение PNG, JPG, WEBP или GIF');input.value='';return;}
 if(file.size>12*1024*1024){notify('Картинка слишком большая — выбери файл до 12 МБ');input.value='';return;}
 var reader=new FileReader();
 reader.onload=function(){
  var img=new Image();
  img.onload=function(){
   try{
    var canvas=document.createElement('canvas');
    var maxSide=512,scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
    var data=canvas.toDataURL('image/jpeg',0.88);
    if(data.length>2400000){notify('Не получилось обработать картинку, выбери другую');return;}
    profile.customAvatarData=data;save();showProfileSettings();updateProfile();notify('Аватар установлен и сохранён');
   }catch(err){notify('Не удалось обработать картинку в предпросмотре MT Manager');}
   input.value='';
  };
  img.onerror=function(){notify('Не удалось открыть изображение');input.value='';};
  img.src=String(reader.result||'');
 };
 reader.onerror=function(){notify('Не удалось прочитать файл');input.value='';};
 reader.readAsDataURL(file);
},true);

/* Управление полем игры и редактором */
function press(e){
 if(mode==='editor'){
  var rect=canvas.getBoundingClientRect();
  var cx=(e.clientX-rect.left)*W/rect.width;
  var wx=Math.max(0,world+cx);

  if(editorTool==='spike'){
   obstacles.push({
    x:Math.round(wx/34)*34,
    w:34,h:40,type:'spike'
   });
  }else if(editorTool==='block'){
   obstacles.push({
    x:Math.round(wx/34)*34,
    w:40,h:65,type:'block'
   });
  }else{
   obstacles.push({
    x:Math.round(wx/34)*34,
    w:35,h:110,type:'portal'
   });
  }

  draw();
  return;
 }

 if(mode!=='playing')return;
 if(e.cancelable)e.preventDefault();

 if(!held){
  held=true;
  jump();
 }
}

function release(e){
 held=false;
 if(e&&e.cancelable)e.preventDefault();
}

canvas.addEventListener('pointerdown',press,{passive:false});
window.addEventListener('pointerup',release);
window.addEventListener('pointercancel',release);
window.addEventListener('blur',release);

/* Управление с клавиатуры */
window.addEventListener('keydown',function(e){
 if(e.code==='Space'||e.code==='ArrowUp'){
  e.preventDefault();

  if(mode==='playing'){
   if(!held){
    held=true;
    jump();
   }
  }else if(mode==='menu'){
   start();
  }
 }
});

window.addEventListener('keyup',function(e){
 if(e.code==='Space'||e.code==='ArrowUp')held=false;
});

/* Вывод ошибок вместо пустого экрана */
function showError(err){
 var box=$('errorBox');
 box.style.display='block';
 box.textContent='Ошибка игры: '+
  (err&&err.message?err.message:String(err));
}

window.addEventListener('error',function(e){
 showError(e.error||e.message||'Неизвестная ошибка');
});

window.addEventListener('unhandledrejection',function(e){
 showError(e.reason||'Ошибка Promise');
});

/* Запуск */
readStore();
updateMusicButton();
reset();
if(currentAccount){menu()}else{showAccountGate()}

})();
</script>
