
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d22">
<title>Kyo Dash</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d22;color:#fff;font-family:Arial,sans-serif;touch-action:pan-y}
body{display:flex;align-items:center;justify-content:center}
.app{width:min(100%,1000px);padding:10px;display:flex;flex-direction:column;gap:9px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:#b8d9ff}
.brand{color:#48eaff;font-size:17px;letter-spacing:2px}
.meter{height:7px;background:#172344;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#26dfff,#5cffba)}
canvas{width:100%;height:auto;aspect-ratio:900/420;display:block;border:1px solid #28477a;border-radius:12px;background:#0c1534;touch-action:none}
.hint{text-align:center;font-size:11px;color:#8da8d7}
.overlay{position:fixed;inset:0;z-index:5;background:#040817ee;display:flex;align-items:center;justify-content:center;padding:12px}
.panel{width:min(94vw,470px);max-height:94vh;overflow:auto;padding:20px;border:1px solid #3266a4;border-radius:22px;text-align:center;background:linear-gradient(150deg,#172754,#0a1026)}
.logo{font-size:42px;color:#45eaff;margin:0}
.sub{color:#b9c9f2;font-size:14px}
.profileBox{margin:14px 0;padding:12px;border:1px solid #2d4c79;border-radius:14px;background:#0b1733}
.profileLine{font-size:12px;color:#a9c4f2;margin:7px}
.rainbowNick{font-weight:1000;background:linear-gradient(90deg,#ff3158,#ffad35,#ffff55,#42ff9b,#35eaff,#a66bff,#ff48d1,#ff3158);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rainbow 2.5s linear infinite}
@keyframes rainbow{to{background-position:300% 50%}}
.nickRow{display:flex;gap:7px;margin-top:10px}
input{min-width:0;flex:1;background:#080f25;border:1px solid #355786;border-radius:9px;padding:10px;color:white}
button{border:0;border-radius:10px;padding:11px;background:#35e5ff;color:#071126;font-weight:900;cursor:pointer}
.nickSave{padding:9px}
.xpTrack{height:6px;background:#1a2b4d;border-radius:99px;overflow:hidden;margin-top:8px}
.xpFill{height:100%;width:0;background:linear-gradient(90deg,#35e5ff,#66ffb8)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
.level{background:#111b38;color:#d8e6ff;border:1px solid #304873}
.level.active{border-color:#35e3ff;background:#12314a}
.level small{display:block;font-size:10px;margin-top:4px}
.btn{width:100%;padding:13px;margin-top:8px;font-size:15px;background:linear-gradient(90deg,#2adfff,#65ffca)}
.secondary{background:#192747;color:#cde2ff;border:1px solid #344d79}
.stats{display:flex;justify-content:center;gap:18px;color:#9eb8e8;font-size:12px;margin:12px}
.hidden{display:none!important}
.small{font-size:11px;color:#8097c6;margin-top:10px}
.menuBtn{padding:7px;background:#111d3a;color:#bfe8ff;border:1px solid #294774}
.kc{color:#ffe66b;font-weight:1000}
.shopGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.skinCard{background:#0b1733;border:1px solid #304873;border-radius:13px;padding:12px 8px;min-width:0}
.skinPreview{width:43px;height:43px;margin:4px auto 12px;border:3px solid #fff;border-radius:7px;box-shadow:0 0 13px currentColor;transform:rotate(8deg)}
.skinName{font-size:13px;font-weight:900;margin:5px 0}
.skinPrice{font-size:12px;color:#ffe66b;margin:8px 0}
.skinCard button{width:100%;padding:9px;font-size:11px}
.shopBalance{padding:12px;background:#0b1733;border:1px solid #344d79;border-radius:12px;margin:12px 0;font-size:17px}
.coinNotice{position:fixed;top:12%;left:50%;transform:translateX(-50%);z-index:10;background:#182a4b;border:1px solid #ffe66b;border-radius:12px;padding:10px 16px;color:#ffe66b;font-weight:bold;pointer-events:none;display:none}
</style>
</head>
<body>

<main class="app">
<header class="top">
<span class="brand">Kyo Dash</span>
<span id="levelLabel">EASY · 1</span>
<span id="progressText">0%</span>
<button class="menuBtn" id="menuBtn">МЕНЮ</button>
</header>
<div class="meter"><div class="fill" id="progressFill"></div></div>
<canvas id="game" width="900" height="420"></canvas>
<div class="hint">ТАП — ПРЫЖОК · УДЕРЖИВАЙ — АВТОПРЫЖОК</div>
</main>

<div class="coinNotice" id="coinNotice">+1 KC 🪙</div>

<div class="overlay" id="overlay">
<section class="panel">
<h1 class="logo" id="panelTitle">Kyo Dash</h1>
<p class="sub" id="panelText">Прыгай через шипы, собирай KC и доберись до финиша!</p>

<div class="profileBox" id="profileBox">
<div class="profileLine">ИГРОК: <strong id="profileNick">Player</strong></div>
<div class="profileLine">УРОВЕНЬ <strong id="profileLevel">1</strong> · XP <strong id="profileXp">0 / 250</strong></div>
<div class="xpTrack"><div class="xpFill" id="xpFill"></div></div>
<div class="profileLine">БАЛАНС: <strong class="kc" id="kcBalance">50 KC</strong></div>
<div class="nickRow"><input id="nickInput" maxlength="16" placeholder="Твой ник"><button class="nickSave" id="nickSave">СМЕНИТЬ</button></div>
<div class="small">Профиль и валюта сохраняются на устройстве</div>
</div>

<div class="levels" id="levels">
<button class="level active" data-level="0">EASY<small>Stereo Madness</small></button>
<button class="level" data-level="1">MEDIUM<small>Jumper</small></button>
<button class="level" data-level="2">HARD<small>FingerDash</small></button>
</div>

<div class="stats" id="stats">
<span>РЕКОРД <b id="best">0%</b></span>
<span>ПОБЕДЫ <b id="wins">0/3</b></span>
</div>

<button class="btn" id="startBtn">ИГРАТЬ</button>
<button class="btn" id="shopBtn">🛒 МАГАЗИН KC</button>
<button class="btn secondary" id="ownerBtn">OWNER MODE</button>
<button class="btn secondary hidden" id="backBtn">← НАЗАД</button>
<div class="small" id="menuSmall">Собирай монетки и покупай новые кубики!</div>
</section>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');
const overlay=$('overlay');

const OWNER_PINS=[
 'OwnerKD-ADS5H-D6E9F037F7',
 'KenanDrun-AJ9S3L6KS9-8H67HSK',
 'TESTER-AAA111'
];

const SKINS=[
 {id:'cyan',name:'Classic',price:0,color:'#35e7ff',border:'#d8fcff'},
 {id:'red',name:'Fire',price:100,color:'#ff405f',border:'#ffd0d7'},
 {id:'lime',name:'Toxic',price:180,color:'#6bff61',border:'#e6ffe1'},
 {id:'purple',name:'Galaxy',price:300,color:'#a56bff',border:'#eadbff'},
 {id:'gold',name:'Gold',price:500,color:'#ffd447',border:'#fff2b0'},
 {id:'pink',name:'Neon',price:750,color:'#ff48cf',border:'#ffdafa'},
 {id:'ice',name:'Ice',price:1000,color:'#75f7ff',border:'#ffffff'},
 {id:'dark',name:'Shadow',price:1500,color:'#64708d',border:'#d4dcf0'}
];

let profile={nickname:'Player',xp:0,isDev:false,kc:50,ownedSkins:['cyan'],selectedSkin:'cyan'};
let ownerMode=false;
let page='menu';
let noticeTimer=null;

function loadProfile(){
 try{
  const saved=JSON.parse(localStorage.getItem('kyoDashProfile')||'{}');
  profile.xp=Number.isFinite(saved.xp)&&saved.xp>=0?Math.floor(saved.xp):0;
  profile.isDev=saved.isDev===true;
  profile.nickname=profile.isDev?'[DEV] Kyosuke':
   (typeof saved.nickname==='string'&&saved.nickname.trim()?saved.nickname.trim().slice(0,16):'Player');

  // Старым сохранениям выдаём стартовые 50 KC один раз.
  profile.kc=Number.isFinite(saved.kc)&&saved.kc>=0?Math.floor(saved.kc):50;
  profile.ownedSkins=Array.isArray(saved.ownedSkins)?saved.ownedSkins.filter(id=>SKINS.some(s=>s.id===id)):['cyan'];
  if(!profile.ownedSkins.includes('cyan'))profile.ownedSkins.unshift('cyan');
  profile.selectedSkin=typeof saved.selectedSkin==='string'&&profile.ownedSkins.includes(saved.selectedSkin)?saved.selectedSkin:'cyan';
 }catch(e){
  profile={nickname:'Player',xp:0,isDev:false,kc:50,ownedSkins:['cyan'],selectedSkin:'cyan'};
 }
 saveProfile();
}

function saveProfile(){
 try{localStorage.setItem('kyoDashProfile',JSON.stringify(profile));}catch(e){}
 updateProfile();
}

function updateProfile(){
 const nick=$('profileNick');
 nick.textContent=profile.nickname;
 nick.classList.toggle('rainbowNick',profile.isDev);
 $('profileLevel').textContent=Math.floor(profile.xp/250)+1;
 $('profileXp').textContent=(profile.xp%250)+' / 250';
 $('xpFill').style.width=((profile.xp%250)/250*100)+'%';
 $('kcBalance').textContent=profile.kc+' KC';
 if(document.activeElement!==$('nickInput'))$('nickInput').value=profile.nickname;
}

function addKC(amount){
 profile.kc=Math.max(0,Math.floor(profile.kc+amount));
 saveProfile();
}

function showNotice(text){
 const el=$('coinNotice');
 el.textContent=text;
 el.style.display='block';
 clearTimeout(noticeTimer);
 noticeTimer=setTimeout(()=>el.style.display='none',950);
}

function activateOwner(pin){
 pin=pin.trim();
 if(!OWNER_PINS.includes(pin)){alert('Неверный PIN!');return;}

 let deviceId=localStorage.getItem('kyodash-device-id');
 if(!deviceId){
  deviceId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
  localStorage.setItem('kyodash-device-id',deviceId);
 }

 const key='kyodash-owner-device-'+pin;
 const savedDevice=localStorage.getItem(key);
 if(savedDevice&&savedDevice!==deviceId){alert('Этот PIN уже привязан к другому браузеру!');return;}
 localStorage.setItem(key,deviceId);
 ownerMode=true;

 if(pin==='OwnerKD-ADS5H-D6E9F037F7'){
  profile.isDev=true;profile.nickname='[DEV] Kyosuke';saveProfile();
  alert('DEV активирован!');
 }else if(pin==='TESTER-AAA111'){
  profile.isDev=false;profile.nickname='[TEST] TesterKD';saveProfile();
  alert('TESTER активирован!');
 }else alert('Owner Mode активирован!');

 refreshStats();
}

const W=900,H=420,G=330,S=34;
const LEVELS=[
 {name:'EASY',speed:275,jump:-590,gravity:1650,length:5600,gap:285},
 {name:'MEDIUM',speed:300,jump:-600,gravity:1700,length:6500,gap:225},
 {name:'HARD',speed:320,jump:-610,gravity:1750,length:7400,gap:200}
];

let selected=0,mode='menu',world=0,progress=0,last=0,raf=0;
let held=false,obstacles=[],coins=[],best=[0,0,0],wins=[false,false,false];

const MUSIC=[
 {tempo:190,melody:[523,659,784,659,587,659,880,784,659,523,587,659,392,523,659,523],bass:[131,0,0,0,196,0,0,0,147,0,0,0,196,0,0,0]},
 {tempo:170,melody:[392,523,587,784,659,587,523,440,523,659,784,880,784,659,587,523],bass:[98,0,0,0,130,0,0,0,110,0,0,0,147,0,0,0]},
 {tempo:145,melody:[440,554,659,880,784,659,554,740,659,880,988,880,740,659,554,440],bass:[110,0,0,0,147,0,0,0,165,0,0,0,147,0,0,0]}
];

let audioCtx=null,musicGain=null,musicTimer=null,musicStep=0,musicToken=0;

function setupAudio(){
 if(audioCtx)return true;
 const AudioClass=window.AudioContext||window.webkitAudioContext;
 if(!AudioClass)return false;
 try{
  audioCtx=new AudioClass();musicGain=audioCtx.createGain();musicGain.gain.value=0;
  musicGain.connect(audioCtx.destination);return true;
 }catch(e){audioCtx=null;musicGain=null;return false;}
}

function playNote(freq,duration,type,volume){
 if(!audioCtx||!musicGain||!freq)return;
 try{
  const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,now);
  gain.gain.setValueAtTime(.001,now);
  gain.gain.linearRampToValueAtTime(volume,now+.018);
  gain.gain.exponentialRampToValueAtTime(.001,now+duration);
  osc.connect(gain);gain.connect(musicGain);osc.start(now);osc.stop(now+duration+.02);
 }catch(e){}
}

function stopMusic(){
 musicToken++;
 if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null;}
 if(musicGain&&audioCtx){
  try{const now=audioCtx.currentTime;musicGain.gain.cancelScheduledValues(now);musicGain.gain.setTargetAtTime(0,now,.035);}catch(e){}
 }
}

function startMusic(){
 stopMusic();
 if(!setupAudio())return;
 const token=musicToken,track=MUSIC[selected];musicStep=0;
 try{
  if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime;
  musicGain.gain.cancelScheduledValues(now);musicGain.gain.setValueAtTime(0,now);
  musicGain.gain.linearRampToValueAtTime(.22,now+.15);
 }catch(e){}
 function tick(){
  if(token!==musicToken||mode!=='playing')return;
  const i=musicStep%track.melody.length,duration=track.tempo/1000;
  playNote(track.melody[i],duration*.82,'triangle',.23);
  if(i%4===0)playNote(track.bass[i],duration*3.4,'sine',.35);
  musicStep++;
 }
 tick();musicTimer=setInterval(tick,track.tempo);
}

function loadStats(){
 try{
  best=JSON.parse(localStorage.getItem('kyoDashBest3')||'[0,0,0]');
  wins=JSON.parse(localStorage.getItem('kyoDashWins3')||'[false,false,false]');
  if(!Array.isArray(best)||best.length!==3)best=[0,0,0];
  if(!Array.isArray(wins)||wins.length!==3)wins=[false,false,false];
 }catch(e){best=[0,0,0];wins=[false,false,false];}
}

const p={x:150,y:G-S,vy:0,angle:0,onGround:true};

function saveStats(){
 try{
  localStorage.setItem('kyoDashBest3',JSON.stringify(best));
  localStorage.setItem('kyoDashWins3',JSON.stringify(wins));
 }catch(e){}
}

function refreshStats(){
 $('best').textContent=(best[selected]||0)+'%';
 $('wins').textContent=wins.filter(Boolean).length+'/3';
 document.querySelectorAll('.level').forEach((b,i)=>b.classList.toggle('active',i===selected));
 $('levelLabel').textContent=LEVELS[selected].name+' · '+(selected+1);
}

function makeLevel(){
 obstacles=[];coins=[];
 const cfg=LEVELS[selected];
 const patterns=[
  [[1],[1],[2],[1],[1,1],[1],[2],[1],[1,1],[1],[2],[1],[1,2],[1]],
  [[1],[2],[1,1],[2],[3],[1],[2,1],[1,1],[3],[2],[1,2],[3],[2,1],[2]],
  [[2],[3],[1,2],[3],[2,2],[1],[3],[2,1],[3],[2,2],[3],[1,3],[2],[3]]
 ];
 const pats=patterns[selected];
 let x=560,i=0;
 while(x<cfg.length-300){
  const pat=pats[i%pats.length],first=pat[0];
  const spikeW=selected===2?35:34,spikeH=selected===2?42:37;
  for(let j=0;j<first;j++)obstacles.push({x:x+j*spikeW,w:spikeW,h:spikeH,type:'spike'});
  if(pat.length>1){
   const secondX=x+first*spikeW+(selected===0?140:selected===1?105:85);
   for(let j=0;j<pat[1];j++)obstacles.push({x:secondX+j*spikeW,w:spikeW,h:spikeH,type:'spike'});
  }
  x+=cfg.gap+(selected===0?(i%3)*35:selected===1?(i%3)*16:(i%3)*10);
  i++;
 }

 // Большие блоки и платформы, с промежутками между опасностями.
 const blockGap=selected===0?1500:selected===1?1250:1100;
 let bx=1150;
 while(bx<cfg.length-450){
  const nearSpike=obstacles.some(o=>o.type==='spike'&&Math.abs(o.x-bx)<190);
  if(!nearSpike){
   if(i%2===0)obstacles.push({x:bx,w:selected===0?58:68,h:selected===0?42:55,type:'block'});
   else obstacles.push({x:bx,w:100,h:18,y:G-(selected===0?95:110),type:'platform'});
  }
  bx+=blockGap;i++;
 }

 // Монетки: иногда одиночные, иногда цепочки.
 let cx=700,ci=0;
 while(cx<cfg.length-250){
  const count=ci%4===2?3:1;
  for(let j=0;j<count;j++){
   coins.push({x:cx+j*38,y:G-(selected===0?88:selected===1?105:115),r:11,got:false});
  }
  cx+=selected===0?470:selected===1?410:360;
  ci++;
 }

 obstacles.push({x:cfg.length-130,w:12,h:80,type:'finish'});
}

function updateHud(){
 progress=Math.min(100,Math.floor(world/(LEVELS[selected].length-130)*100));
 $('progressText').textContent=progress+'%';
 $('progressFill').style.width=progress+'%';
 if(progress>best[selected]){best[selected]=progress;$('best').textContent=progress+'%';saveStats();}
}

function reset(){
 world=0;progress=0;held=false;
 p.y=G-S;p.vy=0;p.angle=0;p.onGround=true;
 makeLevel();updateHud();
}

function showMenu(kind='menu'){
 stopMusic();mode=kind;held=false;page=kind;
 overlay.classList.remove('hidden');
 $('profileBox').classList.remove('hidden');
 $('levels').classList.toggle('hidden',kind==='dead'||kind==='win'||kind==='shop');
 $('stats').classList.toggle('hidden',kind==='shop');
 $('backBtn').classList.toggle('hidden',kind!=='shop');
 $('startBtn').classList.toggle('hidden',kind==='shop');
 $('shopBtn').classList.toggle('hidden',kind==='shop');
 $('ownerBtn').classList.toggle('hidden',kind==='shop');
 $('menuSmall').classList.toggle('hidden',kind==='shop');

 if(kind==='dead'){
  $('panelTitle').textContent='УПС!';
  $('panelText').textContent='Прогресс: '+progress+'%. Попробуй ещё раз!';
  $('startBtn').textContent='ЕЩЁ РАЗ';
 }else if(kind==='win'){
  $('panelTitle').textContent='УРОВЕНЬ ПРОЙДЕН!';
  $('panelText').textContent='Отлично! Уровень '+LEVELS[selected].name+' пройден.';
  $('startBtn').textContent='ИГРАТЬ СНОВА';
 }else if(kind==='shop'){
  $('panelTitle').textContent='МАГАЗИН KC';
  $('panelText').textContent='Покупай кубики и выбирай свой стиль!';
  $('profileBox').classList.add('hidden');
  $('menuSmall').classList.add('hidden');
  renderShop();
 }else{
  $('panelTitle').textContent='Kyo Dash';
  $('panelText').textContent='Прыгай через шипы, собирай KC и доберись до финиша!';
  $('startBtn').textContent='ИГРАТЬ';
 }
 refreshStats();updateProfile();draw();
}

function openShop(){
 showMenu('shop');
}

function renderShop(){
 const old=$('shopGrid');
 if(old)old.remove();

 const grid=document.createElement('div');
 grid.id='shopGrid';grid.className='shopGrid';
 const balance=document.createElement('div');
 balance.className='shopBalance';
 balance.innerHTML='ТВОЙ БАЛАНС: <strong class="kc">'+profile.kc+' KC</strong>';
 grid.appendChild(balance);

 SKINS.forEach(skin=>{
  const card=document.createElement('div');card.className='skinCard';
  const preview=document.createElement('div');preview.className='skinPreview';
  preview.style.background=skin.color;preview.style.color=skin.color;
  card.appendChild(preview);

  const name=document.createElement('div');name.className='skinName';name.textContent=skin.name;
  card.appendChild(name);

  const price=document.createElement('div');price.className='skinPrice';
  price.textContent=skin.price===0?'БЕСПЛАТНО':skin.price+' KC';
  card.appendChild(price);

  const btn=document.createElement('button');
  const owned=profile.ownedSkins.includes(skin.id);
  if(profile.selectedSkin===skin.id){
   btn.textContent='ВЫБРАН';btn.disabled=true;
  }else if(owned){
   btn.textContent='ВЫБРАТЬ';
   btn.addEventListener('click',()=>{
    profile.selectedSkin=skin.id;saveProfile();renderShop();draw();
   });
  }else{
   btn.textContent='КУПИТЬ';
   btn.addEventListener('click',()=>{
    if(profile.kc<skin.price){
     alert('Не хватает KC! Собирай монетки на уровнях.');
     return;
    }
    profile.kc-=skin.price;
    profile.ownedSkins.push(skin.id);
    profile.selectedSkin=skin.id;
    saveProfile();renderShop();draw();
    showNotice('Куплено: '+skin.name+'!');
   });
  }
  card.appendChild(btn);grid.appendChild(card);
 });
 $('panelText').after(grid);
}

function start(){
 cancelAnimationFrame(raf);stopMusic();
 const grid=$('shopGrid');if(grid)grid.remove();
 reset();mode='playing';page='playing';
 overlay.classList.add('hidden');
 startMusic();last=performance.now();raf=requestAnimationFrame(loop);
}

function jump(){
 if(mode==='playing'&&p.onGround){p.vy=LEVELS[selected].jump;p.onGround=false;}
}

function die(){
 if(mode!=='playing')return;
 mode='dead';held=false;showMenu('dead');
}

function win(){
 if(mode!=='playing')return;
 mode='win';held=false;progress=100;
 $('progressText').textContent='100%';$('progressFill').style.width='100%';
 best[selected]=100;

 const firstWin=!wins[selected];
 if(firstWin){
  profile.xp+=[100,150,200][selected];
  const reward=[100,200,350][selected];
  addKC(reward);
  wins[selected]=true;
  saveProfile();
  saveStats();
  refreshStats();
  $('panelText').textContent='Победа! Награда: +'+reward+' KC и XP!';
 }else{
  const reward=[25,50,75][selected];
  addKC(reward);
  saveStats();refreshStats();
  $('panelText').textContent='Повторная победа! Награда: +'+reward+' KC!';
 }
 showMenu('win');
}

function overlapsPlayer(x,y,w,h){
 return p.x+S-5>x&&p.x+5<x+w&&p.y+S-4>y&&p.y+4<y+h;
}

function update(dt){
