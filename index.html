
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d22">
<title>Kyo Dash</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d22;color:white;font-family:Arial,sans-serif;touch-action:pan-y}
body{display:flex;align-items:center;justify-content:center}
.app{width:min(100%,1000px);padding:10px;display:flex;flex-direction:column;gap:9px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:#b8d9ff}
.brand{color:#48eaff;font-size:17px;letter-spacing:2px}
.meter{height:7px;background:#172344;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#26dfff,#5cffba)}
canvas{width:100%;height:auto;aspect-ratio:900/420;display:block;border:1px solid #28477a;border-radius:12px;background:#0c1534;touch-action:none}
.hint{text-align:center;font-size:11px;color:#8da8d7}
.overlay{position:fixed;inset:0;z-index:5;background:#040817ee;display:flex;align-items:center;justify-content:center;padding:12px}
.panel{width:min(94vw,470px);max-height:94vh;overflow:auto;padding:20px;border:1px solid #3266a4;border-radius:22px;text-align:center;background:linear-gradient(150deg,#172754,#0a1026)}
.logo{font-size:42px;color:#45eaff;margin:0}
.sub{color:#b9c9f2;font-size:14px}
.profileBox{margin:14px 0;padding:12px;border:1px solid #2d4c79;border-radius:14px;background:#0b1733}
.profileLine{font-size:12px;color:#a9c4f2;margin:7px}
.rainbowNick{font-weight:1000;background:linear-gradient(90deg,#ff3158,#ffad35,#ffff55,#42ff9b,#35eaff,#a66bff,#ff48d1,#ff3158);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rainbow 2.5s linear infinite}
@keyframes rainbow{to{background-position:300% 50%}}
.nickRow{display:flex;gap:7px;margin-top:10px}
input{min-width:0;flex:1;background:#080f25;border:1px solid #355786;border-radius:9px;padding:10px;color:white}
button{border:0;border-radius:10px;padding:11px;background:#35e5ff;color:#071126;font-weight:900;cursor:pointer}
button:active{transform:scale(.97)}
.nickSave{padding:9px}
.xpTrack{height:6px;background:#1a2b4d;border-radius:99px;overflow:hidden;margin-top:8px}
.xpFill{height:100%;width:0;background:linear-gradient(90deg,#35e5ff,#66ffb8)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
.level{background:#111b38;color:#d8e6ff;border:1px solid #304873}
.level.active{border-color:#35e3ff;background:#12314a}
.level small{display:block;font-size:10px;margin-top:4px}
.btn{width:100%;padding:13px;margin-top:8px;font-size:15px;background:linear-gradient(90deg,#2adfff,#65ffca)}
.secondary{background:#192747;color:#cde2ff;border:1px solid #344d79}
.stats{display:flex;justify-content:center;gap:18px;color:#9eb8e8;font-size:12px;margin:12px}
.hidden{display:none!important}
.small{font-size:11px;color:#8097c6;margin-top:10px}
.menuBtn{padding:7px;background:#111d3a;color:#bfe8ff;border:1px solid #294774}
@media(max-height:540px){
 .app{gap:5px;padding:5px}
 .panel{padding:12px;max-height:96vh}
 .logo{font-size:32px}
 .profileBox{margin:7px 0;padding:8px}
 .levels{margin:8px 0}
 .stats{margin:7px}
}
</style>
</head>
<body>

<main class="app">
<header class="top">
<span class="brand">Kyo Dash</span>
<span id="levelLabel">EASY · 1</span>
<span id="progressText">0%</span>
<button class="menuBtn" id="menuBtn">МЕНЮ</button>
</header>
<div class="meter"><div class="fill" id="progressFill"></div></div>
<canvas id="game" width="900" height="420"></canvas>
<div class="hint">ТАП — ПРЫЖОК · УДЕРЖИВАЙ — АВТОПРЫЖОК · КРАСНЫЕ БЛОКИ — НЕ ПРЫГАТЬ</div>
</main>

<div class="overlay" id="overlay">
<section class="panel">
<h1 class="logo" id="panelTitle">Kyo Dash</h1>
<p class="sub" id="panelText">Прыгай через шипы и доберись до финиша!</p>

<div class="profileBox">
<div class="profileLine">ИГРОК: <strong id="profileNick">Player</strong></div>
<div class="profileLine">УРОВЕНЬ <strong id="profileLevel">1</strong> · XP <strong id="profileXp">0 / 250</strong></div>
<div class="xpTrack"><div class="xpFill" id="xpFill"></div></div>
<div class="nickRow">
<input id="nickInput" maxlength="16" placeholder="Твой ник">
<button class="nickSave" id="nickSave">СМЕНИТЬ</button>
</div>
<div class="small">Профиль и XP сохраняются на устройстве</div>
</div>

<div class="levels" id="levels">
<button class="level active" data-level="0">EASY<small>Stereo Madness</small></button>
<button class="level" data-level="1">MEDIUM<small>Jumper</small></button>
<button class="level" data-level="2">HARD<small>FingerDash</small></button>
</div>

<div class="stats">
<span>РЕКОРД <b id="best">0%</b></span>
<span>ПОБЕДЫ <b id="wins">0/3</b></span>
</div>

<button class="btn" id="startBtn">ИГРАТЬ</button>
<button class="btn secondary" id="ownerBtn">OWNER MODE</button>
<button class="btn secondary hidden" id="menuOnly">ВЫБОР УРОВНЯ</button>
<div class="small">У каждого уровня собственная расстановка препятствий.</div>
</section>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('game');
const ctx=canvas.getContext('2d');
const overlay=$('overlay');

const W=900,H=420,G=330,S=34;

const OWNER_PINS=[
 'OwnerKD-ADS5H-D6E9F037F7',
 'KenanDrun-AJ9S3L6KS9-8H67HSK',
 'TESTER-AAA111'
];

let profile={nickname:'Player',xp:0,isDev:false};
let ownerMode=false;

function loadProfile(){
 try{
  const saved=JSON.parse(localStorage.getItem('kyoDashProfile')||'{}');
  profile.xp=Number.isFinite(saved.xp)&&saved.xp>=0?Math.floor(saved.xp):0;
  profile.isDev=saved.isDev===true;
  profile.nickname=profile.isDev?'[DEV] Kyosuke':
   (typeof saved.nickname==='string'&&saved.nickname.trim()
   ?saved.nickname.trim().slice(0,16):'Player');
 }catch(e){
  profile={nickname:'Player',xp:0,isDev:false};
 }
}

function saveProfile(){
 try{localStorage.setItem('kyoDashProfile',JSON.stringify(profile))}catch(e){}
 updateProfile();
}

function updateProfile(){
 const nick=$('profileNick');
 nick.textContent=profile.nickname;
 nick.classList.toggle('rainbowNick',profile.isDev);
 $('profileLevel').textContent=Math.floor(profile.xp/250)+1;
 $('profileXp').textContent=(profile.xp%250)+' / 250';
 $('xpFill').style.width=((profile.xp%250)/250*100)+'%';
 if(document.activeElement!==$('nickInput'))$('nickInput').value=profile.nickname;
}

function activateOwner(pin){
 pin=pin.trim();

 if(!OWNER_PINS.includes(pin)){
  alert('Неверный PIN!');
  return;
 }

 let deviceId=localStorage.getItem('kyodash-device-id');

 if(!deviceId){
  deviceId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
  localStorage.setItem('kyodash-device-id',deviceId);
 }

 const key='kyodash-owner-device-'+pin;
 const savedDevice=localStorage.getItem(key);

 if(savedDevice&&savedDevice!==deviceId){
  alert('Этот PIN уже привязан к другому браузеру!');
  return;
 }

 localStorage.setItem(key,deviceId);
 ownerMode=true;

 if(pin==='OwnerKD-ADS5H-D6E9F037F7'){
  profile.isDev=true;
  profile.nickname='[DEV] Kyosuke';
  saveProfile();
  alert('DEV активирован!');
 }else if(pin==='TESTER-AAA111'){
  profile.isDev=false;
  profile.nickname='[TEST] TesterKD';
  saveProfile();
  alert('Режим тестера активирован!');
 }else{
  alert('Owner Mode активирован!');
 }

 refreshStats();
}

/* Новая физика и более мягкая сложность */
const LEVELS=[
 {name:'EASY',speed:285,jump:-555,gravity:1550,length:5700,gap:365},
 {name:'MEDIUM',speed:295,jump:-565,gravity:1600,length:6500,gap:305},
 {name:'HARD',speed:310,jump:-575,gravity:1650,length:7200,gap:265}
];

let selected=0;
let mode='menu';
let world=0;
let progress=0;
let last=0;
let raf=0;
let held=false;
let obstacles=[];
let best=[0,0,0];
let wins=[false,false,false];

try{
 best=JSON.parse(localStorage.getItem('kyoDashBest3')||'[0,0,0]');
 wins=JSON.parse(localStorage.getItem('kyoDashWins3')||'[false,false,false]');
 if(!Array.isArray(best)||best.length!==3)best=[0,0,0];
 if(!Array.isArray(wins)||wins.length!==3)wins=[false,false,false];
}catch(e){
 best=[0,0,0];
 wins=[false,false,false];
}

const p={x:150,y:G-S,vy:0,angle:0,onGround:true};

const MUSIC=[
 {tempo:190,melody:[523,659,784,659,587,659,880,784,659,523,587,659,392,523,659,523],bass:[131,0,0,0,196,0,0,0,147,0,0,0,196,0,0,0]},
 {tempo:180,melody:[392,523,587,784,659,587,523,440,523,659,784,880,784,659,587,523],bass:[98,0,0,0,130,0,0,0,110,0,0,0,147,0,0,0]},
 {tempo:165,melody:[440,554,659,880,784,659,554,740,659,880,988,880,740,659,554,440],bass:[110,0,0,0,147,0,0,0,165,0,0,0,147,0,0,0]}
];

let audioCtx=null;
let musicGain=null;
let musicTimer=null;
let musicStep=0;
let musicToken=0;

function setupAudio(){
 if(audioCtx)return true;
 const AudioClass=window.AudioContext||window.webkitAudioContext;
 if(!AudioClass)return false;
 try{
  audioCtx=new AudioClass();
  musicGain=audioCtx.createGain();
  musicGain.gain.value=0;
  musicGain.connect(audioCtx.destination);
  return true;
 }catch(e){return false}
}

function playNote(freq,duration,type,volume){
 if(!audioCtx||!musicGain||!freq)return;
 try{
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,now);
  gain.gain.setValueAtTime(.001,now);
  gain.gain.linearRampToValueAtTime(volume,now+.018);
  gain.gain.exponentialRampToValueAtTime(.001,now+duration);
  osc.connect(gain);
  gain.connect(musicGain);
  osc.start(now);
  osc.stop(now+duration+.02);
 }catch(e){}
}

function stopMusic(){
 musicToken++;
 if(musicTimer!==null){
  clearInterval(musicTimer);
  musicTimer=null;
 }
 if(musicGain&&audioCtx){
  try{
   const now=audioCtx.currentTime;
   musicGain.gain.cancelScheduledValues(now);
   musicGain.gain.setTargetAtTime(0,now,.035);
  }catch(e){}
 }
}

function startMusic(){
 stopMusic();
 if(!setupAudio())return;
 const token=musicToken;
 const track=MUSIC[selected];
 musicStep=0;

 try{
  if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime;
  musicGain.gain.cancelScheduledValues(now);
  musicGain.gain.setValueAtTime(0,now);
  musicGain.gain.linearRampToValueAtTime(.22,now+.15);
 }catch(e){}

 function tick(){
  if(token!==musicToken||mode!=='playing')return;
  const i=musicStep%track.melody.length;
  const duration=track.tempo/1000;
  playNote(track.melody[i],duration*.82,'triangle',.23);
  if(i%4===0)playNote(track.bass[i],duration*3.4,'sine',.35);
  musicStep++;
 }

 tick();
 musicTimer=setInterval(tick,track.tempo);
}

function saveStats(){
 try{
  localStorage.setItem('kyoDashBest3',JSON.stringify(best));
  localStorage.setItem('kyoDashWins3',JSON.stringify(wins));
 }catch(e){}
}

function refreshStats(){
 $('best').textContent=(best[selected]||0)+'%';
 $('wins').textContent=wins.filter(Boolean).length+'/3';
 document.querySelectorAll('.level').forEach((b,i)=>{
  b.classList.toggle('active',i===selected);
 });
 $('levelLabel').textContent=LEVELS[selected].name+' · '+(selected+1);
}

/*
  1 = одиночный шип
  2 = два шипа рядом
  3 = три шипа рядом
  C = низкий потолок
*/
const PATTERNS=[
 ['1','.','.','1','.','2','.','.','1','.','.','1','.','2','.','.',
  '1','.','1','.','.','2','.','.','1','.','.','2','.','.','1','.'],
 ['1','.','2','.','1','.','C','.','2','.','1','.','.','2','.','C',
  '1','.','2','.','1','.','C','.','2','.','1','.','2','.','.','1'],
 ['2','.','1','.','C','.','2','.','1','.','3','.','C','.','2','.',
  '1','.','C','.','2','.','1','.','3','.','2','.','C','.','1','.']
];

function addSpikes(x,count){
 const w=34;
 const h=selected===2?42:38;
 for(let j=0;j<count;j++){
  obstacles.push({x:x+j*w,w,h,type:'spike'});
 }
}

function makeLevel(){
 obstacles=[];
 const cfg=LEVELS[selected];
 const pattern=PATTERNS[selected];
 let x=540;
 let i=0;

 while(x<cfg.length-320){
  const symbol=pattern[i%pattern.length];
  let spacing=cfg.gap;

  if(selected===0)spacing+=[55,80,40,95,65][i%5];
  else if(selected===1)spacing+=[25,45,15,55,30][i%5];
  else spacing+=[8,25,12,32,5][i%5];

  if(symbol==='1'||symbol==='2'||symbol==='3'){
   addSpikes(x,Number(symbol));
  }else if(symbol==='C'&&selected>0){
   obstacles.push({
    x:x,
    w:68,
    y:G-105,
    h:30,
    type:'ceiling'
   });
  }

  // Дополнительные препятствия появляются только на HARD.
  if(selected===2&&i%8===5){
   addSpikes(x+spacing*.55,2);
  }

  x+=spacing;
  i++;
 }

 obstacles.push({x:cfg.length-120,w:12,h:80,type:'finish'});
}

function updateHud(){
 progress=Math.min(100,Math.floor(world/(LEVELS[selected].length-120)*100));
 $('progressText').textContent=progress+'%';
 $('progressFill').style.width=progress+'%';

 if(progress>best[selected]){
  best[selected]=progress;
  $('best').textContent=progress+'%';
  saveStats();
 }
}

function reset(){
 world=0;
 progress=0;
 held=false;
 p.y=G-S;
 p.vy=0;
 p.angle=0;
 p.onGround=true;
 makeLevel();
 updateHud();
}

function showMenu(kind='menu'){
 stopMusic();
 mode=kind;
 held=false;
 overlay.classList.remove('hidden');
 $('levels').classList.toggle('hidden',kind==='dead'||kind==='win');
 $('menuOnly').classList.add('hidden');

 if(kind==='dead'){
  $('panelTitle').textContent='УПС!';
  $('panelText').textContent='Прогресс: '+progress+'%. Попробуй ещё раз!';
  $('startBtn').textContent='ЕЩЁ РАЗ';
 }else if(kind==='win'){
  $('panelTitle').textContent='УРОВЕНЬ ПРОЙДЕН!';
  $('panelText').textContent='Отлично! Уровень '+LEVELS[selected].name+' пройден.';
  $('startBtn').textContent='ИГРАТЬ СНОВА';
 }else{
  $('panelTitle').textContent='Kyo Dash';
  $('panelText').textContent='Прыгай через шипы и доберись до финиша!';
  $('startBtn').textContent='ИГРАТЬ';
 }

 refreshStats();
 updateProfile();
 draw();
}

function start(){
 cancelAnimationFrame(raf);
 stopMusic();
 reset();
 mode='playing';
 overlay.classList.add('hidden');
 startMusic();
 last=performance.now();
 raf=requestAnimationFrame(loop);
}

function jump(){
 if(mode==='playing'&&p.onGround){
  p.vy=LEVELS[selected].jump;
  p.onGround=false;
 }
}

function die(){
 if(mode!=='playing')return;
 mode='dead';
 held=false;
 cancelAnimationFrame(raf);
 showMenu('dead');
}

function win(){
 if(mode!=='playing')return;
 mode='win';
 held=false;
 progress=100;
 $('progressText').textContent='100%';
 $('progressFill').style.width='100%';
 best[selected]=100;

 if(!wins[selected]){
  profile.xp+=[100,150,200][selected];
  saveProfile();
 }

 wins[selected]=true;
 saveStats();
 refreshStats();
 showMenu('win');
}

function update(dt){
 if(mode!=='playing')return;

 const cfg=LEVELS[selected];
 world+=cfg.speed*dt;
 p.vy+=cfg.gravity*dt;
 p.y+=p.vy*dt;

 if(p.y>=G-S){
  p.y=G-S;
  p.vy=0;
  p.onGround=true;
  p.angle=Math.round(p.angle/(Math.PI/2))*(Math.PI/2);
 }else{
  p.onGround=false;
  // Куб вращается в прыжке, но не крутится бесконечно на земле.
  p.angle+=cfg.speed*dt/S*(Math.PI/2);
 }

 updateHud();

 for(const o of obstacles){
  const ox=o.x-world;
  if(ox>p.x+100||ox+o.w<p.x-80)continue;

  if(o.type==='finish'){
   if(ox<p.x+S*.6){
    win();
    return;
   }
   continue;
  }

  const px1=p.x+5;
  const px2=p.x+S-5;
  const py1=p.y+5;
  const py2=p.y+S-3;

  if(o.type==='ceiling'){
   if(px2>ox+4&&px1<ox+o.w-4&&
      py2>o.y+4&&py1<o.y+o.h){
    die();
    return;
   }
   continue;
  }

  // Приближённая проверка треугольной формы шипа.
  const left=Math.max(px1,ox);
  const right=Math.min(px2,ox+o.w);
  if(left>=right)continue;

  const center=ox+o.w/2;
  const sampleX=Math.max(ox,Math.min(center,(left+right)/2));
  const surfaceY=G-o.h*(1-Math.abs(sampleX-center)/(o.w/2));

  if(py2>surfaceY+2&&py1<G){
   die();
   return;
  }
 }
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#0a1230';
 ctx.fillRect(0,0,W,H);

 const grad=ctx.createLinearGradient(0,0,0,G);
 grad.addColorStop(0,'#111e48');
 grad.addColorStop(1,'#0a1530');
 ctx.fillStyle=grad;
 ctx.fillRect(0,0,W,G);

 ctx.strokeStyle='#213865';
 ctx.lineWidth=1;
 const off=-(world*.3%45);

 for(let x=off;x<W;x+=45){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,G);
  ctx.stroke();
 }

 for(let y=22;y<G;y+=45){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(W,y);
  ctx.stroke();
 }

 for(let i=0;i<26;i++){
  const sx=(i*137-world*.12%900+900)%900;
  const sy=(i*71)%285;
  ctx.fillStyle='#668ac5';
  ctx.fillRect(sx,sy,2,2);
 }

 ctx.fillStyle='#14264c';
 ctx.fillRect(0,G,W,H-G);
 ctx.fillStyle='#36e8ff';
 ctx.fillRect(0,G,W,4);

 for(let x=-(world%50);x<W;x+=50){
  ctx.fillStyle='#2b4779';
  ctx.fillRect(x,G+16,25,4);
 }

 for(const o of obstacles){
  const x=o.x-world;
  if(x<-100||x>W+100)continue;

  if(o.type==='spike'){
   ctx.fillStyle=selected===2?'#ff3d8c':selected===1?'#ff6c68':'#ff4d83';
   ctx.beginPath();
   ctx.moveTo(x,G);
   ctx.lineTo(x+o.w/2,G-o.h);
   ctx.lineTo(x+o.w,G);
   ctx.closePath();
   ctx.fill();
   ctx.strokeStyle='#ffb2cb';
   ctx.lineWidth=2;
   ctx.stroke();
  }else if(o.type==='ceiling'){
   ctx.fillStyle='#ff385f';
   ctx.fillRect(x,o.y,o.w,o.h);
   ctx.fillStyle='#ff9bad';
   ctx.fillRect(x,o.y+o.h-5,o.w,5);

   for(let k=0;k<o.w;k+=18){
    ctx.fillStyle='#7d183c';
    ctx.fillRect(x+k,o.y+6,8,5);
   }
  }else{
   ctx.fillStyle='#4dffb4';
   ctx.fillRect(x,G-o.h,8,o.h);
   ctx.fillStyle='#e6fff5';
   ctx.font='bold 18px Arial';
   ctx.fillText('FINISH',x-26,G-o.h-12);
  }
 }

 // Кубик игрока
 ctx.save();
 ctx.translate(p.x+S/2,p.y+S/2);
 ctx.rotate(p.angle);
 ctx.shadowColor='#00dfff';
 ctx.shadowBlur=14;
 ctx.fillStyle='#35e7ff';
 ctx.fillRect(-S/2,-S/2,S,S);
 ctx.shadowBlur=0;
 ctx.strokeStyle='#d8fcff';
 ctx.lineWidth=3;
 ctx.strokeRect(-S/2+2,-S/2+2,S-4,S-4);
 ctx.fillStyle='#0a2750';
 ctx.fillRect(-9,-7,5,7);
 ctx.fillRect(4,-7,5,7);
 ctx.restore();

 if(mode==='menu'){
  ctx.fillStyle='#b6d2ff';
  ctx.font='bold 20px Arial';
  ctx.textAlign='center';
  ctx.fillText('READY?',W/2,105);
  ctx.textAlign='left';
 }
}

function loop(now){
 const dt=Math.min((now-last)/1000,.025);
 last=now;
 update(dt);
 draw();

 if(mode==='playing'){
  raf=requestAnimationFrame(loop);
 }
}

/* Тап — один прыжок. Удерживание не запускает бесконечные прыжки. */
function press(e){
 if(e)e.preventDefault();
 if(mode!=='playing')return;
 if(!held){
  held=true;
  jump();
 }
}

function release(e){
 if(e)e.preventDefault();
 held=false;
}

canvas.addEventListener('pointerdown',press);
window.addEventListener('pointerup',release);
window.addEventListener('pointercancel',release);
window.addEventListener('blur',()=>{held=false});

window.addEventListener('keydown',e=>{
 if(e.code==='Space'||e.code==='ArrowUp'){
  e.preventDefault();

  if(mode==='playing'){
   if(!held){
    held=true;
    jump();
   }
  }else if(e.code==='Space'){
   start();
  }
 }
});

window.addEventListener('keyup',e=>{
 if(e.code==='Space'||e.code==='ArrowUp')held=false;
});

 if(nick.length<2){
  alert('Ник должен содержать минимум 2 символа.');

 }

 profile.nickname=nick.slice(0,16);
 saveProfile();
});
