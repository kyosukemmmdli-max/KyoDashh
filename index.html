
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d22">
<title>Kyo Dash — Big Update</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#080d22;color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation
}
button,input,select{font:inherit}
button{
  border:2px solid #55eaff;border-radius:12px;
  padding:12px 16px;color:white;font-weight:bold;
  background:linear-gradient(135deg,#182d63,#111735);
  cursor:pointer;box-shadow:0 0 12px #00cfff35
}
button:active{transform:scale(.96)}
button:disabled{opacity:.4}
.hidden{display:none!important}
#app{height:100%;width:100%;position:relative}
.screen{
  position:absolute;inset:0;overflow-y:auto;
  padding:18px 14px 28px;
  background:radial-gradient(ellipse at top,#17275a,#080d22 70%)
}
h1,h2,h3,p{margin:8px 0}
h1{text-align:center;font-size:clamp(30px,8vw,48px)}
h2{text-align:center;color:#65f4ff}
.subtitle{text-align:center;color:#9db5df}
.panel{
  background:#111a38eF;border:1px solid #314c87;
  border-radius:16px;padding:14px;margin:12px 0
}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.center{text-align:center}
.small{font-size:12px;color:#a6b9dd}
.coins{color:#ffdf57;font-weight:bold}
.xp{color:#65f4ff;font-weight:bold}
.menu-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.menu-buttons button{min-height:52px}
.primary{background:linear-gradient(135deg,#0878ff,#642cff)}
.green{border-color:#55ffad}
.red{border-color:#ff617f}
.gold{border-color:#ffd95b}
.purple{border-color:#c18aff}
.rainbow{
  background:linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet,red);
  background-size:300% 100%;background-clip:text;
  -webkit-background-clip:text;color:transparent;
  animation:rainbow 3s linear infinite;font-weight:900
}
@keyframes rainbow{to{background-position:300% 0}}
#topBar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stat{padding:8px 10px;border-radius:10px;background:#18244a}
#gameScreen{padding:0;background:#080d22;overflow:hidden}
#gameCanvas{display:block;width:100%;height:100%;touch-action:none}
#gameHUD{
  position:absolute;top:10px;left:10px;right:10px;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;pointer-events:none
}
#gameHUD button{pointer-events:auto;padding:8px 12px}
#progressWrap{
  position:absolute;top:58px;left:10%;width:80%;height:10px;
  border:1px solid #b3f8ff;border-radius:10px;
  background:#17213d;overflow:hidden
}
#progressBar{height:100%;width:0;background:#50f3ff}
#gameMessage{
  position:absolute;left:10%;right:10%;top:40%;
  text-align:center;font-size:24px;font-weight:bold;
  text-shadow:0 0 12px #00d9ff;pointer-events:none
}
#gameActions{
  position:absolute;left:8px;right:8px;bottom:12px;
  display:flex;justify-content:center;gap:10px
}
#gameActions button{pointer-events:auto}
.card-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px
}
.card{
  background:#182346;border:1px solid #354d82;
  border-radius:14px;padding:12px;text-align:center
}
.skin-preview{
  width:42px;height:42px;margin:6px auto;
  border:3px solid white;border-radius:5px;
  box-shadow:0 0 14px #55eaff
}
.locked{filter:grayscale(1);opacity:.6}
input,select{
  min-width:0;max-width:100%;padding:11px;
  border-radius:10px;border:1px solid #48649b;
  background:#080f28;color:white
}
#toast{
  position:absolute;z-index:50;bottom:25px;left:8%;width:84%;
  padding:13px;border-radius:12px;text-align:center;
  background:#152b52;border:1px solid #5deaff;
  display:none
}
#modal{
  position:absolute;z-index:40;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:18px;background:#000b
}
#modalBox{
  width:min(440px,100%);max-height:85vh;overflow:auto;
  background:#101a39;border:2px solid #55eaff;
  border-radius:18px;padding:18px
}
#modalContent{margin:12px 0}
#editorCanvas{
  width:100%;height:220px;background:#070c1c;
  border:1px solid #3e5b91;border-radius:10px
}
@media(max-width:380px){
  .menu-buttons{grid-template-columns:1fr}
  .screen{padding-left:10px;padding-right:10px}
}
</style>
</head>
<body>
<div id="app">

<!-- ГЛАВНОЕ МЕНЮ -->
<section id="menuScreen" class="screen">
  <h1 id="gameTitle">Kyo Dash</h1>
  <p class="subtitle">BIG UPDATE • Jump • Dodge • Win</p>

  <div class="panel">
    <div id="topBar">
      <div class="stat">👤 <span id="nickname">Player</span></div>
      <div class="stat coins">🪙 <span id="coinCount">0</span></div>
      <div class="stat xp">⭐ XP: <span id="xpCount">0</span></div>
    </div>
    <div class="row" style="margin-top:12px">
      <input id="nicknameInput" maxlength="18" placeholder="Твой ник">
      <button id="saveNickBtn">Сохранить ник</button>
    </div>
  </div>

  <div class="panel">
    <h3 class="center">🎮 Выбери уровень</h3>
    <div class="row">
      <button class="levelBtn green" data-level="0">Easy</button>
      <button class="levelBtn gold" data-level="1">Medium</button>
      <button class="levelBtn red" data-level="2">Hard</button>
    </div>
    <p class="small center" id="selectedLevelText">Выбран уровень: Easy</p>
    <button id="playBtn" class="primary" style="width:100%;font-size:20px">▶ ИГРАТЬ</button>
  </div>

  <div class="menu-buttons">
    <button id="shopBtn">🛒 Магазин</button>
    <button id="statsBtn">📊 Статистика</button>
    <button id="achievementsBtn">🏆 Достижения</button>
    <button id="dailyBtn">🎁 Награда дня</button>
    <button id="editorBtn">🧱 Редактор уровней</button>
    <button id="musicBtn">🎵 Музыка: ВКЛ</button>
  </div>

  <div class="panel">
    <h3 class="center">🔐 Доступ</h3>
    <div class="row">
      <button id="ownerLoginBtn" class="gold">🔐 ВХОД ВЛАДЕЛЬЦА</button>
      <button id="testerLoginBtn" class="purple">🧪 TESTER MODE</button>
    </div>
    <p class="small center">Служебные режимы доступны только по PIN-коду.</p>
  </div>

  <div id="ownerStatus" class="panel hidden">
    <h3 class="center rainbow">[DEV] Kyosuke</h3>
    <p class="center">OWNER MODE АКТИВЕН</p>
    <button id="ownerPanelBtn" class="gold" style="width:100%">⚙️ Панель владельца</button>
    <button id="ownerOffBtn" style="width:100%;margin-top:8px">Выключить Owner Mode</button>
  </div>

  <div id="testerStatus" class="panel hidden">
    <h3 class="center">🧪 TESTER MODE</h3>
    <button id="testerCoinsBtn" class="purple" style="width:100%">+500 монет</button>
    <button id="testerOffBtn" style="width:100%;margin-top:8px">Выйти из TESTER MODE</button>
  </div>

  <p class="small center">Kyo Dash • Прогресс сохраняется на этом устройстве</p>
</section>

<!-- ЭКРАН ИГРЫ -->
<section id="gameScreen" class="screen hidden">
  <canvas id="gameCanvas"></canvas>
  <div id="gameHUD">
    <button id="backBtn">← Меню</button>
    <strong id="gameLevelName">Easy</strong>
    <strong id="gameCoins" class="coins">🪙 0</strong>
  </div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="gameMessage"></div>
  <div id="gameActions">
    <button id="restartBtn">↻ Заново</button>
    <button id="pauseBtn">Ⅱ Пауза</button>
  </div>
</section>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="modal" class="hidden">
  <div id="modalBox">
    <h2 id="modalTitle">Kyo Dash</h2>
    <div id="modalContent"></div>
    <button id="modalCloseBtn" style="width:100%">Закрыть</button>
  </div>
</div>

<div id="toast"></div>
</div>

<!-- ЧАСТЬ 2: ВСТАВЬ СЮДА JAVASCRIPT -->
<script>
 
"use strict";

const OWNER_PIN = "OwnerKD-ADS5H-D6E9F037F7";
const TESTER_PIN = "TESTER-KYO-DASH";

const $ = id => document.getElementById(id);

const DEFAULT_PROFILE = {
  nick: "Player",
  coins: 0,
  xp: 0,
  games: 0,
  wins: 0,
  deaths: 0,
  bestProgress: 0,
  selectedSkin: 0,
  skins: [0],
  achievements: [],
  lastDaily: "",
  music: true,
  customLevels: []
};

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function readStore() {
  const saved = readJSON("kyoDashProfile", {});
  const profile = { ...DEFAULT_PROFILE, ...saved };

  if (!Array.isArray(profile.skins)) profile.skins = [0];
  if (!Array.isArray(profile.achievements)) profile.achievements = [];
  if (!Array.isArray(profile.customLevels)) profile.customLevels = [];

  // Зарезервированный ник владельца не выдаётся обычному игроку.
  if (profile.nick === "[DEV] Kyosuke") profile.nick = "Player";

  profile.coins = Math.max(0, Number(profile.coins) || 0);
  profile.xp = Math.max(0, Number(profile.xp) || 0);

  return profile;
}

let profile = readStore();

// Эти флаги существуют только до перезагрузки страницы.
let ownerMode = false;
let testerMode = false;

let selectedLevel = 0;
let selectedSkin = Number(profile.selectedSkin) || 0;
let gameRunning = false;
let paused = false;
let gameState = null;
let animationId = 0;
let musicContext = null;
let musicTimer = null;

function saveProfile() {
  localStorage.setItem("kyoDashProfile", JSON.stringify(profile));
  updateUI();
}

function updateUI() {
  $("nickname").textContent =
    ownerMode ? "[DEV] Kyosuke" : profile.nick;

  $("nickname").classList.toggle("rainbow", ownerMode);
  $("coinCount").textContent = profile.coins;
  $("xpCount").textContent = profile.xp;
  $("gameCoins").textContent = "🪙 " + profile.coins;

  $("ownerStatus").classList.toggle("hidden", !ownerMode);
  $("testerStatus").classList.toggle("hidden", !testerMode);

  $("ownerLoginBtn").classList.toggle("hidden", ownerMode);
  $("testerLoginBtn").classList.toggle("hidden", testerMode);
  $("musicBtn").textContent =
    profile.music ? "🎵 Музыка: ВКЛ" : "🔇 Музыка: ВЫКЛ";
}

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => {
    el.style.display = "none";
  }, 2300);
}

function showModal(title, html) {
  $("modalTitle").textContent = title;
  $("modalContent").innerHTML = html;
  $("modal").classList.remove("hidden");
}

function closeModal() {
  $("modal").classList.add("hidden");
}

$("modalCloseBtn").addEventListener("click", closeModal);

function askPIN(title, callback) {
  showModal(title, `
    <p>Введите PIN-код:</p>
    <input id="pinInput" type="password" autocomplete="off"
      placeholder="PIN-код" style="width:100%">
    <p id="pinError" class="small"></p>
    <button id="pinSubmit" class="primary" style="width:100%;margin-top:10px">
      Подтвердить
    </button>
  `);

  const input = $("pinInput");
  input.focus();

  function submit() {
    const value = input.value;
    closeModal();
    callback(value);
  }

  $("pinSubmit").addEventListener("click", submit);
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") submit();
  });
}

$("ownerLoginBtn").addEventListener("click", () => {
  askPIN("🔐 Вход владельца", pin => {
    if (pin !== OWNER_PIN) {
      toast("❌ Неверный PIN владельца");
      return;
    }

    ownerMode = true;
    testerMode = false;
    updateUI();
    toast("✅ Owner Mode включён");
  });
});

$("testerLoginBtn").addEventListener("click", () => {
  askPIN("🧪 TESTER MODE", pin => {
    if (pin !== TESTER_PIN) {
      toast("❌ Неверный PIN тестера");
      return;
    }

    testerMode = true;
    ownerMode = false;
    updateUI();
    toast("🧪 TESTER MODE включён");
  });
});

$("ownerOffBtn").addEventListener("click", () => {
  ownerMode = false;
  updateUI();
  toast("Owner Mode выключен");
});

$("testerOffBtn").addEventListener("click", () => {
  testerMode = false;
  updateUI();
  toast("TESTER MODE выключен");
});

$("ownerPanelBtn").addEventListener("click", () => {
  if (!ownerMode) {
    toast("Доступ запрещён");
    return;
  }

  showModal("⚙️ Панель владельца", `
    <p>Владелец: <strong class="rainbow">[DEV] Kyosuke</strong></p>
    <button id="ownerCoins" class="gold" style="width:100%;margin:5px 0">
      +500 монет
    </button>
    <button id="ownerXP" class="primary" style="width:100%;margin:5px 0">
      +250 XP
    </button>
    <button id="ownerSkins" class="purple" style="width:100%;margin:5px 0">
      Открыть все скины
    </button>
    <button id="ownerReset" class="red" style="width:100%;margin:5px 0">
      Сбросить статистику
    </button>
    <button id="ownerDisable" style="width:100%;margin:5px 0">
      Выключить Owner Mode
    </button>
  `);

  $("ownerCoins").onclick = () => {
    if (!ownerMode) return;
    profile.coins += 500;
    saveProfile();
    toast("+500 монет");
  };

  $("ownerXP").onclick = () => {
    if (!ownerMode) return;
    profile.xp += 250;
    saveProfile();
    toast("+250 XP");
  };

  $("ownerSkins").onclick = () => {
    if (!ownerMode) return;
    profile.skins = SKINS.map((_, index) => index);
    saveProfile();
    toast("Все скины открыты");
  };

  $("ownerReset").onclick = () => {
    if (!ownerMode) return;
    profile.games = 0;
    profile.wins = 0;
    profile.deaths = 0;
    profile.bestProgress = 0;
    profile.xp = 0;
    profile.achievements = [];
    saveProfile();
    toast("Статистика сброшена");
  };

  $("ownerDisable").onclick = () => {
    closeModal();
    ownerMode = false;
    updateUI();
    toast("Owner Mode выключен");
  };
});

$("testerCoinsBtn").addEventListener("click", () => {
  if (!testerMode) {
    toast("TESTER MODE не активен");
    return;
  }

  profile.coins += 500;
  saveProfile();
  toast("🪙 +500 монет — XP не изменён");
});

$("saveNickBtn").addEventListener("click", () => {
  if (ownerMode) {
    toast("Сначала выключите Owner Mode");
    return;
  }

  const nick = $("nicknameInput").value.trim();

  if (!nick) {
    toast("Введи ник");
    return;
  }

  if (nick === "[DEV] Kyosuke") {
    toast("Этот ник зарезервирован");
    return;
  }

  profile.nick = nick.slice(0, 18);
  saveProfile();
  toast("Ник сохранён");
});

const SKINS = [
  { name: "Classic", color: "#38eaff", price: 0 },
  { name: "Lime", color: "#75ff67", price: 100 },
  { name: "Fire", color: "#ff554f", price: 250 },
  { name: "Gold", color: "#ffd84d", price: 500 },
  { name: "Purple", color: "#bb76ff", price: 750 },
  { name: "Pink", color: "#ff75c8", price: 1000 },
  { name: "Ice", color: "#a8f6ff", price: 1500 },
  { name: "Dark", color: "#888bba", price: 2000 }
];

function hasSkin(index) {
  return profile.skins.includes(index);
}

$("shopBtn").addEventListener("click", renderShop);

function renderShop() {
  let html = `<p>Твои монеты: <strong class="coins">${profile.coins}</strong></p>
    <div class="card-grid">`;

  SKINS.forEach((skin, index) => {
    const unlocked = hasSkin(index);
    const selected = selectedSkin === index;

    html += `
      <div class="card">
        <div class="skin-preview ${unlocked ? "" : "locked"}"
          style="background:${skin.color}"></div>
        <strong>${skin.name}</strong>
        <p class="small">${unlocked ? "Открыт" : skin.price + " монет"}</p>
        <button data-skin="${index}" style="width:100%">
          ${selected ? "Выбран" : unlocked ? "Выбрать" : "Купить"}
        </button>
      </div>
    `;
  });

  html += "</div>";
  showModal("🛒 Магазин скинов", html);

  document.querySelectorAll("[data-skin]").forEach(button => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.skin);
      const skin = SKINS[index];

      if (!hasSkin(index)) {
        if (profile.coins < skin.price) {
          toast("Недостаточно монет");
          return;
        }

        profile.coins -= skin.price;
        profile.skins.push(index);
      }

      selectedSkin = index;
      profile.selectedSkin = index;
      saveProfile();
      renderShop();
    });
  });
}

const ACHIEVEMENTS = [
  { id: "first", name: "Первый запуск", desc: "Сыграй один раз", reward: 50 },
  { id: "win1", name: "Победа!", desc: "Пройди уровень", reward: 100 },
  { id: "games10", name: "Практика", desc: "Сыграй 10 раз", reward: 150 },
  { id: "coins1000", name: "Копилка", desc: "Накопи 1000 монет", reward: 200 },
  { id: "allskins", name: "Коллекционер", desc: "Открой все скины", reward: 300 }
];

function checkAchievements() {
  const conditions = {
    first: profile.games >= 1,
    win1: profile.wins >= 1,
    games10: profile.games >= 10,
    coins1000: profile.coins >= 1000,
    allskins: SKINS.every((_, i) => hasSkin(i))
  };

  ACHIEVEMENTS.forEach(item => {
    if (conditions[item.id] && !profile.achievements.includes(item.id)) {
      profile.achievements.push(item.id);
      profile.coins += item.reward;
      toast("🏆 " + item.name + "  +" + item.reward + " монет");
    }
  });

  saveProfile();
}

$("achievementsBtn").addEventListener("click", () => {
  const html = ACHIEVEMENTS.map(item => {
    const done = profile.achievements.includes(item.id);

    return `
      <div class="panel">
        <strong>${done ? "✅" : "🔒"} ${item.name}</strong>
        <p>${item.desc}</p>
        <p class="coins">Награда: ${item.reward} монет</p>
      </div>
    `;
  }).join("");

  showModal("🏆 Достижения", html);
});

$("statsBtn").addEventListener("click", () => {
  showModal("📊 Статистика", `
    <div class="panel">🎮 Игр сыграно: <strong>${profile.games}</strong></div>
    <div class="panel">🏆 Побед: <strong>${profile.wins}</strong></div>
    <div class="panel">💥 Поражений: <strong>${profile.deaths}</strong></div>
    <div class="panel">📈 Лучший прогресс: <strong>${profile.bestProgress}%</strong></div>
    <div class="panel">⭐ Опыт: <strong>${profile.xp}</strong></div>
    <div class="panel">🪙 Монеты: <strong>${profile.coins}</strong></div>
  `);
});

$("dailyBtn").addEventListener("click", () => {
  const today = new Date().toISOString().slice(0, 10);

  if (profile.lastDaily === today) {
    toast("Ты уже забрал награду сегодня");
    return;
  }

  profile.lastDaily = today;
  profile.coins += 100;
  profile.xp += 25;
  saveProfile();
  toast("🎁 +100 монет и +25 XP");
});

$("musicBtn").addEventListener("click", () => {
  profile.music = !profile.music;
  saveProfile();

  if (!profile.music) stopMusic();
  else if (gameRunning && !paused) startMusic();

  toast(profile.music ? "Музыка включена" : "Музыка выключена");
});

function stopMusic() {
  if (musicTimer) {
    clearInterval(musicTimer);
    musicTimer = null;
  }

  if (musicContext) {
    try { musicContext.close(); } catch {}
    musicContext = null;
  }
}

function startMusic() {
  if (!profile.music || musicContext) return;

  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;

    musicContext = new AudioCtx();

    // Простая оригинальная электронная мелодия.
    // Музыка Stereo Madness не используется.
    const notes = [392, 494, 587, 494, 440, 523, 659, 523];
    let index = 0;

    function beep() {
      if (!musicContext || !profile.music || paused) return;

      const osc = musicContext.createOscillator();
      const gain = musicContext.createGain();

      osc.type = "square";
      osc.frequency.value = notes[index++ % notes.length];
      gain.gain.setValueAtTime(0.025, musicContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(
        0.001, musicContext.currentTime + 0.12
      );

      osc.connect(gain);
      gain.connect(musicContext.destination);
      osc.start();
      osc.stop(musicContext.currentTime + 0.13);
    }

    beep();
    musicTimer = setInterval(beep, 180);
  } catch {
    stopMusic();
  }
}

updateUI();
 
/* ===== ИГРОВОЙ ДВИЖОК KYO DASH ===== */

const canvas = $("gameCanvas");
const ctx = canvas.getContext("2d");

const LEVELS = [
  {
    name: "Stereo Style",
    difficulty: "Easy",
    speed: 4.0,
    length: 2600,
    obstacles: [
      [430, "spike"], [650, "spike"], [850, "double"],
      [1120, "spike"], [1370, "double"], [1660, "spike"],
      [1850, "double"], [2130, "spike"], [2350, "double"]
    ]
  },
  {
    name: "Neon Rush",
    difficulty: "Medium",
    speed: 4.4,
    length: 3000,
    obstacles: [
      [360, "spike"], [540, "double"], [770, "spike"],
      [960, "double"], [1190, "spike"], [1370, "double"],
      [1620, "double"], [1870, "spike"], [2070, "double"],
      [2320, "spike"], [2520, "double"], [2750, "spike"]
    ]
  },
  {
    name: "Nightmare",
    difficulty: "Hard",
    speed: 4.7,
    length: 3300,
    obstacles: [
      [320, "spike"], [470, "double"], [660, "spike"],
      [810, "double"], [1000, "double"], [1220, "spike"],
      [1380, "double"], [1580, "double"], [1800, "spike"],
      [1960, "double"], [2160, "double"], [2370, "spike"],
      [2540, "double"], [2750, "double"], [2970, "spike"]
    ]
  }
];

let customObstacles = [];

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function currentLevel() {
  return LEVELS[selectedLevel] || LEVELS[0];
}

document.querySelectorAll(".levelBtn").forEach(button => {
  button.addEventListener("click", () => {
    selectedLevel = Number(button.dataset.level);

    document.querySelectorAll(".levelBtn").forEach(b => {
      b.style.filter = "brightness(.7)";
    });

    button.style.filter = "brightness(1.4)";
    $("selectedLevelText").textContent =
      "Выбран уровень: " + currentLevel().difficulty;
  });
});

function makeGameState() {
  const level = currentLevel();

  return {
    x: 80,
    y: 0,
    vy: 0,
    size: 28,
    ground: 0,
    camera: 0,
    distance: 0,
    progress: 0,
    rotation: 0,
    jumping: false,
    holding: false,
    alive: true,
    finished: false,
    jumpQueued: false,
    time: 0,
    speed: level.speed
  };
}

function startGame() {
  stopMusic();

  $("menuScreen").classList.add("hidden");
  $("gameScreen").classList.remove("hidden");

  resizeCanvas();

  gameState = makeGameState();
  gameRunning = true;
  paused = false;

  profile.games++;
  saveProfile();

  $("gameLevelName").textContent = currentLevel().difficulty;
  $("gameMessage").textContent = "";
  $("progressBar").style.width = "0%";
  $("pauseBtn").textContent = "Ⅱ Пауза";

  cancelAnimationFrame(animationId);
  startMusic();
  animationId = requestAnimationFrame(gameLoop);
}

function backToMenu() {
  gameRunning = false;
  paused = false;
  cancelAnimationFrame(animationId);
  stopMusic();

  $("gameScreen").classList.add("hidden");
  $("menuScreen").classList.remove("hidden");

  updateUI();
}

$("playBtn").addEventListener("click", startGame);
$("backBtn").addEventListener("click", backToMenu);

$("restartBtn").addEventListener("click", () => {
  if (!gameRunning) return;

  gameState = makeGameState();
  paused = false;

  $("pauseBtn").textContent = "Ⅱ Пауза";
  $("gameMessage").textContent = "";
  $("progressBar").style.width = "0%";

  stopMusic();
  startMusic();

  cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);
});

$("pauseBtn").addEventListener("click", () => {
  if (!gameRunning || !gameState || !gameState.alive ||
      gameState.finished) return;

  paused = !paused;
  $("pauseBtn").textContent = paused ? "▶ Продолжить" : "Ⅱ Пауза";

  if (paused) stopMusic();
  else startMusic();
});

function jump() {
  if (!gameRunning || paused || !gameState) return;
  if (!gameState.alive || gameState.finished) return;

  if (gameState.ground > 0 && gameState.y >= gameState.ground - 1) {
    gameState.vy = -10.2;
    gameState.jumping = true;
    gameState.rotation += Math.PI / 2;
  } else {
    gameState.jumpQueued = true;
  }
}

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();

  if (!gameRunning || paused) return;

  if (!gameState.alive || gameState.finished) return;

  gameState.holding = true;
  jump();
});

function releaseJump() {
  if (gameState) gameState.holding = false;
}

window.addEventListener("pointerup", releaseJump);
window.addEventListener("pointercancel", releaseJump);
window.addEventListener("blur", releaseJump);

function drawBackground(w, h) {
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, "#182b5d");
  gradient.addColorStop(1, "#090f27");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = "#3b63a055";
  ctx.lineWidth = 1;

  const grid = 40;
  const offset = gameState ? gameState.camera % grid : 0;

  for (let x = -offset; x < w; x += grid) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  }

  for (let y = 0; y < h; y += grid) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
}

function drawGround(w, ground) {
  ctx.fillStyle = "#101a38";
  ctx.fillRect(0, ground, w, 100);

  ctx.fillStyle = "#58f4ff";
  ctx.fillRect(0, ground, w, 3);

  ctx.strokeStyle = "#23466f";
  ctx.lineWidth = 2;

  for (let x = -(gameState.camera % 35); x < w; x += 35) {
    ctx.beginPath();
    ctx.moveTo(x, ground + 3);
    ctx.lineTo(x - 20, ground + 32);
    ctx.stroke();
  }
}

function drawSpike(x, ground, width, height) {
  ctx.beginPath();
  ctx.moveTo(x, ground);
  ctx.lineTo(x + width / 2, ground - height);
  ctx.lineTo(x + width, ground);
  ctx.closePath();

  ctx.fillStyle = "#ff4f73";
  ctx.fill();

  ctx.strokeStyle = "#ffd0dc";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawCube(x, y, size, rotation) {
  const skin = SKINS[selectedSkin] || SKINS[0];

  ctx.save();
  ctx.translate(x + size / 2, y + size / 2);
  ctx.rotate(rotation);

  ctx.shadowColor = skin.color;
  ctx.shadowBlur = 14;

  ctx.fillStyle = skin.color;
  ctx.fillRect(-size / 2, -size / 2, size, size);

  ctx.shadowBlur = 0;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.strokeRect(-size / 2, -size / 2, size, size);

  ctx.fillStyle = "#10152b";
  ctx.fillRect(-size / 4, -size / 6, 4, 5);
  ctx.fillRect(size / 8, -size / 6, 4, 5);

  ctx.fillRect(-size / 5, size / 6, size * .4, 3);

  ctx.restore();
}

function getObstacles() {
  const level = currentLevel();
  const result = level.obstacles.map(item => ({
    x: item[0],
    type: item[1]
  }));

  customObstacles.forEach(item => result.push(item));

  return result;
}

function hitSpike(cube, spikeX, ground, double) {
  const size = cube.size;
  const screenX = spikeX - cube.camera;
  const width = double ? 64 : 32;
  const height = 30;

  // Проверка приблизительно повторяет треугольную форму шипа.
  const cx = cube.x + size / 2;
  const cy = cube.y + size / 2;

  const left = screenX;
  const right = screenX + width;
  const tipX = screenX + width / 2;
  const tipY = ground - height;

  if (cx + size * .25 < left || cx - size * .25 > right) {
    return false;
  }

  if (cube.y + size < tipY || cube.y > ground) {
    return false;
  }

  const horizontal = Math.abs(cx - tipX) / (width / 2);
  const topAtCube = tipY + horizontal * height;

  return cy + size * .25 > topAtCube &&
         cube.y + size * .8 > ground - height;
}

function gameLoop() {
  if (!gameRunning) return;

  animationId = requestAnimationFrame(gameLoop);

  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  if (!gameState || w < 1 || h < 1) return;

  const g = gameState;

  drawBackground(w, h);

  const ground = h * .79;
  g.ground = ground - g.size;

  if (!paused && g.alive && !g.finished) {
    g.time++;

    g.distance += g.speed;
    g.camera = g.distance;

    g.vy += 0.48;
    g.y += g.vy;

    if (g.y >= g.ground) {
      g.y = g.ground;
      g.vy = 0;
      g.jumping = false;
      g.rotation = Math.round(g.rotation / (Math.PI / 2)) *
                   (Math.PI / 2);

      if (g.jumpQueued || g.holding) {
        g.jumpQueued = false;
        jump();
      }
    }

    g.progress = Math.min(
      100,
      Math.floor(g.distance / currentLevel().length * 100)
    );

    $("progressBar").style.width = g.progress + "%";

    if (g.progress >= 100) {
      finishLevel();
    }

    for (const obstacle of getObstacles()) {
      const double = obstacle.type === "double";

      if (hitSpike(g, obstacle.x, ground, double)) {
        die();
        break;
      }
    }
  }

  drawGround(w, ground);

  for (const obstacle of getObstacles()) {
    const x = obstacle.x - g.camera;
    if (x < -100 || x > w + 100) continue;

    drawSpike(x, ground, 32, 30);

    if (obstacle.type === "double") {
      drawSpike(x + 32, ground, 32, 30);
    }
  }

  if (!g.finished) {
    drawCube(g.x, g.y, g.size, g.rotation);
  } else {
    drawCube(g.x, g.y, g.size, g.rotation);
  }

  if (paused && g.alive) {
    $("gameMessage").textContent = "ПАУЗА";
  } else if (g.alive && !g.finished) {
    $("gameMessage").textContent = "";
  }
}

function die() {
  if (!gameState || !gameState.alive) return;

  gameState.alive = false;
  gameRunning = false;

  stopMusic();

  profile.deaths++;
  profile.bestProgress = Math.max(
    profile.bestProgress,
    gameState.progress
  );

  saveProfile();

  $("gameMessage").innerHTML =
    "💥 ПОПЫТКА ОКОНЧЕНА<br>" +
    `<span style="font-size:16px">${gameState.progress}%</span><br>` +
    `<button onclick="restartAfterDeath()">↻ ПОВТОРИТЬ</button>`;

  toast("Столкновение! Попробуй ещё раз.");
}

window.restartAfterDeath = function() {
  gameState = makeGameState();
  gameRunning = true;
  paused = false;

  $("gameMessage").textContent = "";
  $("progressBar").style.width = "0%";
  $("pauseBtn").textContent = "Ⅱ Пауза";

  stopMusic();
  startMusic();

  cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);
};

function finishLevel() {
  if (!gameState || gameState.finished) return;

  gameState.finished = true;
  gameRunning = false;
  paused = false;

  stopMusic();

  profile.wins++;
  profile.xp += 100;
  profile.coins += 150;
  profile.bestProgress = 100;

  saveProfile();
  checkAchievements();

  $("gameMessage").innerHTML =
    "🏆 УРОВЕНЬ ПРОЙДЕН!<br>" +
    `<span style="font-size:16px">+150 монет • +100 XP</span><br>` +
    `<button onclick="restartAfterDeath()">↻ ЕЩЁ РАЗ</button>`;

  toast("Победа! Награды получены.");
}

/* ===== РЕДАКТОР УРОВНЕЙ ===== */

$("editorBtn").addEventListener("click", renderEditor);

function renderEditor() {
  showModal("🧱 Редактор уровней", `
    <p>Добавляй шипы в свой тестовый уровень.</p>
    <canvas id="editorCanvas" width="600" height="220"></canvas>
    <div class="row" style="margin-top:10px">
      <button id="addSpikeBtn">+ Шип</button>
      <button id="addDoubleBtn">+ Двойной шип</button>
    </div>
    <p id="editorCount">Шипов: ${customObstacles.length}</p>
    <button id="clearEditorBtn" class="red" style="width:100%">
      Очистить редактор
    </button>
    <button id="saveEditorBtn" class="green" style="width:100%;margin-top:8px">
      Сохранить уровень
    </button>
  `);

  const editor = $("editorCanvas");
  const ectx = editor.getContext("2d");

  function drawEditor() {
    ectx.clearRect(0, 0, editor.width, editor.height);
    ectx.fillStyle = "#0a1027";
    ectx.fillRect(0, 0, editor.width, editor.height);

    ectx.fillStyle = "#4deaff";
    ectx.fillRect(0, 175, editor.width, 3);

    customObstacles.forEach(item => {
      const x = item.x % 580;

      ectx.beginPath();
      ectx.moveTo(x, 175);
      ectx.lineTo(x + 16, 145);
      ectx.lineTo(x + 32, 175);
      ectx.closePath();

      ectx.fillStyle = "#ff4f73";
      ectx.fill();

      if (item.type === "double") {
        ectx.beginPath();
        ectx.moveTo(x + 32, 175);
        ectx.lineTo(x + 48, 145);
        ectx.lineTo(x + 64, 175);
        ectx.closePath();
        ectx.fill();
      }
    });

    $("editorCount").textContent =
      "Объектов: " + customObstacles.length;
  }

  $("addSpikeBtn").onclick = () => {
    customObstacles.push({
      x: 400 + customObstacles.length * 100,
      type: "spike"
    });
    drawEditor();
  };

  $("addDoubleBtn").onclick = () => {
    customObstacles.push({
      x: 400 + customObstacles.length * 100,
      type: "double"
    });
    drawEditor();
  };

  $("clearEditorBtn").onclick = () => {
    customObstacles = [];
    drawEditor();
  };

  $("saveEditorBtn").onclick = () => {
    profile.customLevels = customObstacles;
    saveProfile();
    toast("Уровень сохранён на устройстве");
  };

  customObstacles = Array.isArray(profile.customLevels)
    ? profile.customLevels.map(item => ({ ...item }))
    : [];

  drawEditor();
}

/* ===== ВОССТАНОВЛЕНИЕ И ЗАВЕРШЕНИЕ ===== */

if (profile.selectedSkin >= 0 && profile.selectedSkin < SKINS.length) {
  selectedSkin = profile.selectedSkin;
} else {
  selectedSkin = 0;
}

$("nicknameInput").value = profile.nick;
updateUI();

window.addEventListener("pagehide", () => {
  // Режимы доступа намеренно не сохраняются.
  ownerMode = false;
  testerMode = false;
  stopMusic();
});

/* Конец JavaScript */
</script>
