
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d22">
<title>KYO DASH</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d22;color:#f3f7ff;font-family:system-ui,Arial,sans-serif;touch-action:pan-y}
body{display:flex;align-items:center;justify-content:center}
.app{width:min(100%,1000px);padding:10px;display:flex;flex-direction:column;gap:9px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;letter-spacing:.7px;color:#b8d9ff;flex-wrap:wrap}
.brand{color:#48eaff;font-size:17px;letter-spacing:2px}
.meter{height:7px;background:#172344;border-radius:99px;overflow:hidden;border:1px solid #2a3d69}
.fill{height:100%;width:0;background:linear-gradient(90deg,#26dfff,#5cffba);transition:width .08s linear}
canvas{width:100%;height:auto;aspect-ratio:900/420;display:block;border:1px solid #28477a;border-radius:12px;background:#0c1534;touch-action:none;box-shadow:0 0 24px #00c8ff18}
.hint{text-align:center;font-size:11px;color:#8da8d7}
.overlay{position:fixed;inset:0;z-index:5;background:#040817ef;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{width:min(94vw,470px);max-height:92vh;overflow:auto;padding:24px 20px;border:1px solid #3266a4;border-radius:22px;text-align:center;background:linear-gradient(150deg,#172754,#0a1026);box-shadow:0 0 45px #00cfff18}
.logo{font-size:clamp(36px,10vw,58px);font-weight:1000;letter-spacing:3px;color:#45eaff;text-shadow:0 0 22px #00cfff55;margin:0}
.sub{color:#b9c9f2;line-height:1.5;font-size:14px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 12px}
.level{border:1px solid #304873;border-radius:12px;padding:12px 4px;background:#111b38;color:#d8e6ff;font-weight:900;font-size:12px}
.level small{display:block;color:#90a7d4;font-weight:600;margin-top:5px}
.level.active{border-color:#35e3ff;background:#12314a}
.btn{border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(90deg,#2adfff,#65ffca);color:#071126;font-weight:1000;font-size:16px;width:100%;cursor:pointer}
.secondary{margin-top:9px;background:#192747;color:#cde2ff;border:1px solid #344d79}
.small{font-size:11px;color:#8097c6;margin-top:12px}
.hidden{display:none!important}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:#9eb8e8;font-size:12px;margin:12px 0}
.stats b{color:#f4fbff}
.menuBtn{border:1px solid #294774;background:#111d3a;color:#bfe8ff;border-radius:9px;padding:7px 10px;font-weight:800;font-size:11px}
.menuBtn.active{border-color:#5cffba;color:#5cffba}
@media(min-width:700px){.app{gap:12px}.top{font-size:14px}.hint{font-size:12px}}
</style>
</head>
<body>

<main class="app">
  <header class="top">
    <span class="brand">KYO DASH</span>
    <span id="levelLabel">EASY · 1</span>
    <span id="progressText">0%</span>
    <button class="menuBtn" id="ownerBtn">OWNER</button>
    <button class="menuBtn" id="menuBtn">МЕНЮ</button>
  </header>
  <div class="meter"><div class="fill" id="progressFill"></div></div>
  <canvas id="game" width="900" height="420" aria-label="KYO DASH game"></canvas>
  <div class="hint">ТАП — ПРЫЖОК · УДЕРЖИВАЙ — АВТОПРЫЖКИ · ПК: ПРОБЕЛ</div>
</main>

<div class="overlay" id="overlay">
  <section class="panel">
    <h1 class="logo" id="panelTitle">KYO DASH</h1>
    <p class="sub" id="panelText">Прыгай через шипы и доберись до финиша!</p>
    <div class="levels" id="levels">
      <button class="level active" data-level="0">EASY<small>Спокойный темп</small></button>
      <button class="level" data-level="1">MEDIUM<small>Больше препятствий</small></button>
      <button class="level" data-level="2">HARD<small>Испытай себя</small></button>
    </div>
    <div class="stats">
      <span>РЕКОРД <b id="best">0%</b></span>
      <span>ПРОЙДЕНО <b id="wins">0/3</b></span>
    </div>
    <button class="btn" id="startBtn">ИГРАТЬ</button>
    <button class="btn secondary hidden" id="menuOnly">ВЫБОР УРОВНЯ</button>
    <div class="small">Рекорды сохраняются на этом устройстве</div>
  </section>
</div>

<script>
(()=> {
'use strict';

const $ = id => document.getElementById(id);

const canvas=$('game');
const ctx=canvas.getContext('2d',{alpha:false});
const overlay=$('overlay');
const title=$('panelTitle');
const panelText=$('panelText');
const startBtn=$('startBtn');
const menuOnly=$('menuOnly');
const levelsBox=$('levels');
const levelLabel=$('levelLabel');
const progressText=$('progressText');
const progressFill=$('progressFill');
const bestEl=$('best');
const winsEl=$('wins');
const ownerBtn=$('ownerBtn');

/*
  ДВА ОТДЕЛЬНЫХ PIN.
  Каждый PIN хранит привязку отдельно от другого.
*/
const OWNER_PINS=[
  'OwnerKD-ADS5H-D6E9F037F7',
  'KenanDrun-AJ9S3L6KS9-8H67HSK'
];

let ownerMode=false;

function getDeviceId(){
  let id=localStorage.getItem('kyodash-device-id');

  if(!id){
    id=(crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);

    localStorage.setItem('kyodash-device-id',id);
  }

  return id;
}

function activateOwner(pin){
  pin=pin.trim();

  if(!OWNER_PINS.includes(pin)){
    alert('Неверный PIN!');
    return false;
  }

  const deviceId=getDeviceId();

  // У каждого PIN собственный ключ хранения привязки.
  const storageKey='kyodash-owner-device-'+pin;
  const savedDevice=localStorage.getItem(storageKey);

  if(savedDevice && savedDevice!==deviceId){
    alert('Этот PIN уже привязан к другому браузеру!');
    return false;
  }

  localStorage.setItem(storageKey,deviceId);
  return true;
}

function updateOwnerButton(){
  ownerBtn.textContent=ownerMode?'OWNER ✓':'OWNER';
  ownerBtn.classList.toggle('active',ownerMode);
}

ownerBtn.addEventListener('click',()=>{
  if(ownerMode){
    ownerMode=false;
    updateOwnerButton();
    alert('Owner Mode выключен.');
    return;
  }

  let pin=prompt('Введите PIN владельца:');

  if(pin===null)return;

  try{
    if(activateOwner(pin)){
      ownerMode=true;
      updateOwnerButton();
      alert('Owner Mode активирован!');
    }
  }catch(error){
    alert('Ошибка активации: '+error.message);
  }
});

const W=900,H=420,G=330,S=34;

const LEVELS=[
  {name:'EASY',speed:275,jump:-590,gravity:1650,length:5100,gap:300},
  {name:'MEDIUM',speed:300,jump:-600,gravity:1700,length:5900,gap:250},
  {name:'HARD',speed:320,jump:-610,gravity:1750,length:6500,gap:215}
];

let selected=0;
let mode='menu';
let world=0;
let progress=0;
let last=0;
let raf=0;
let held=false;
let obstacles=[];
let best=[0,0,0];
let wins=[false,false,false];

try{
  best=JSON.parse(localStorage.getItem('kyoDashBest3')||'[0,0,0]');
  wins=JSON.parse(localStorage.getItem('kyoDashWins3')||'[false,false,false]');

  if(!Array.isArray(best)||best.length!==3)best=[0,0,0];
  if(!Array.isArray(wins)||wins.length!==3)wins=[false,false,false];
}catch(e){
  best=[0,0,0];
  wins=[false,false,false];
}

const p={
  x:150,y:G-S,vy:0,angle:0,
  onGround:true,size:S,spin:0
};

function save(){
  try{
    localStorage.setItem('kyoDashBest3',JSON.stringify(best));
    localStorage.setItem('kyoDashWins3',JSON.stringify(wins));
  }catch(e){}
}

function refreshStats(){
  bestEl.textContent=(best[selected]||0)+'%';
  winsEl.textContent=wins.filter(Boolean).length+'/3';

  document.querySelectorAll('.level').forEach((b,i)=>{
    b.classList.toggle('active',i===selected);
  });

  levelLabel.textContent=LEVELS[selected].name+' · '+(selected+1);
}

function addSpike(x,count=1){
  for(let i=0;i<count;i++){
    obstacles.push({x:x+i*37,w:37,h:37,type:'spike'});
  }
}

function makeLevel(){
  obstacles=[];
  const cfg=LEVELS[selected];
  let x=590,idx=0;

  while(x<cfg.length-260){
    const pattern=(idx*7+selected*3)%7;

    if(selected===0){
      if(pattern===3)addSpike(x,2);
      else addSpike(x,1);
    }else if(selected===1){
      if(pattern===0||pattern===4||pattern===6)addSpike(x,2);
      else addSpike(x,1);
    }else{
      if(pattern===0||pattern===3||pattern===6)addSpike(x,2);
      else if(pattern===2)addSpike(x,3);
      else addSpike(x,1);
    }

    x+=cfg.gap+(pattern%3)*24;
    idx++;
  }

  obstacles.push({
    x:cfg.length-130,
    w:12,
    h:80,
    type:'finish'
  });
}

function reset(){
  world=0;
  progress=0;
  held=false;
  p.y=G-S;
  p.vy=0;
  p.angle=0;
  p.spin=0;
  p.onGround=true;
  makeLevel();
  updateHud();
}

function updateHud(){
  progress=Math.min(
    100,
    Math.floor(world/(LEVELS[selected].length-130)*100)
  );

  progressText.textContent=progress+'%';
  progressFill.style.width=progress+'%';

  if(progress>best[selected]){
    best[selected]=progress;
    bestEl.textContent=progress+'%';
    save();
  }
}

function showMenu(kind='menu'){
  mode=kind;
  held=false;
  overlay.classList.remove('hidden');

  levelsBox.classList.toggle(
    'hidden',
    kind==='dead'||kind==='win'
  );

  menuOnly.classList.toggle('hidden',kind==='menu');

  if(kind==='dead'){
    title.textContent='УПС!';
    panelText.textContent='Прогресс: '+progress+'%. Давай ещё раз!';
    startBtn.textContent='ЕЩЁ РАЗ';
  }else if(kind==='win'){
    title.textContent='УРОВЕНЬ ПРОЙДЕН!';
    panelText.textContent='Красиво! Уровень '+LEVELS[selected].name+' пройден.';
    startBtn.textContent='ИГРАТЬ СНОВА';
  }else{
    title.textContent='KYO DASH';
    panelText.textContent='Прыгай через шипы и доберись до финиша!';
    startBtn.textContent='ИГРАТЬ';
    menuOnly.classList.add('hidden');
  }

  refreshStats();
  draw();
}

function start(){
  cancelAnimationFrame(raf);
  reset();
  mode='playing';
  overlay.classList.add('hidden');
  last=performance.now();
  raf=requestAnimationFrame(loop);
}

function jump(){
  if(mode!=='playing')return;

  if(p.onGround){
    p.vy=LEVELS[selected].jump;
    p.onGround=false;
    p.spin=0;
  }
}

function die(){
  if(mode!=='playing')return;
  mode='dead';
  held=false;
  showMenu('dead');
}

function win(){
  mode='win';
  held=false;
  progress=100;
  progressText.textContent='100%';
  progressFill.style.width='100%';
  best[selected]=100;
  wins[selected]=true;
  save();
  refreshStats();
  showMenu('win');
}

function update(dt){
  if(mode!=='playing')return;

  const cfg=LEVELS[selected];
  world+=cfg.speed*dt;
  p.vy+=cfg.gravity*dt;
  p.y+=p.vy*dt;

  if(p.y>=G-S){
    if(!p.onGround){
      p.y=G-S;
      p.vy=0;
      p.onGround=true;
      p.angle=Math.round(p.angle/(Math.PI/2))*(Math.PI/2);
      p.spin=0;

      if(held)jump();
    }else{
      p.y=G-S;
      p.vy=0;
      if(held)jump();
    }
  }else{
    p.onGround=false;
    p.angle+=cfg.speed*dt/S*(Math.PI/2);
    p.spin+=cfg.speed*dt/S*(Math.PI/2);
  }

  updateHud();

  const px=p.x,py=p.y,s=S;

  for(const o of obstacles){
    const ox=o.x-world;

    if(ox>px+90||ox+o.w<px-80)continue;

    if(o.type==='finish'){
      if(ox<px+s*.6){
        win();
        return;
      }
    }else if(o.type==='spike'){
      const left=Math.max(px+4,ox);
      const right=Math.min(px+s-4,ox+o.w);

      if(left<right&&py+s>G-o.h){
        const center=ox+o.w/2;
        const nearest=center<left?left:(center>right?right:center);
        const surfaceY=G-o.h*(1-Math.abs(nearest-center)/(o.w/2));

        if(py+s-3>surfaceY&&py<G){
          die();
          return;
        }
      }
    }
  }
}

function draw(){
  ctx.fillStyle='#0a1230';
  ctx.fillRect(0,0,W,H);

  const grad=ctx.createLinearGradient(0,0,0,G);
  grad.addColorStop(0,'#111e48');
  grad.addColorStop(1,'#0a1530');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,G);

  ctx.strokeStyle='#213865';
  ctx.lineWidth=1;

  const off=-(world*.3%45);

  for(let x=off;x<W;x+=45){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,G);
    ctx.stroke();
  }

  for(let y=22;y<G;y+=45){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  for(let i=0;i<26;i++){
    const sx=(i*137-world*.12%900+900)%900;
    const sy=(i*71)%285;
    ctx.fillStyle='#668ac5';
    ctx.fillRect(sx,sy,2,2);
  }

  ctx.fillStyle='#14264c';
  ctx.fillRect(0,G,W,H-G);
  ctx.fillStyle='#36e8ff';
  ctx.fillRect(0,G,W,4);

  for(let x=-(world%50);x<W;x+=50){
    ctx.fillStyle='#2b4779';
    ctx.fillRect(x,G+16,25,4);
  }

  for(const o of obstacles){
    const x=o.x-world;

    if(x<-70||x>W+70)continue;

    if(o.type==='spike'){
      ctx.fillStyle=selected===2?'#ff3d8c':'#ff4d83';
      ctx.beginPath();
      ctx.moveTo(x,G);
      ctx.lineTo(x+o.w/2,G-o.h);
      ctx.lineTo(x+o.w,G);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle='#ffb2cb';
      ctx.lineWidth=2;
      ctx.stroke();
    }else{
      ctx.fillStyle='#4dffb4';
      ctx.fillRect(x,G-o.h,8,o.h);
      ctx.fillStyle='#e6fff5';
      ctx.font='bold 18px Arial';
      ctx.fillText('FINISH',x-26,G-o.h-12);
    }
  }

  ctx.save();
  ctx.translate(p.x+S/2,p.y+S/2);
  ctx.rotate(p.angle);
  ctx.shadowColor='#00dfff';
  ctx.shadowBlur=14;
  ctx.fillStyle='#35e7ff';
  ctx.fillRect(-S/2,-S/2,S,S);
  ctx.shadowBlur=0;
  ctx.strokeStyle='#d8fcff';
  ctx.lineWidth=3;
  ctx.strokeRect(-S/2+2,-S/2+2,S-4,S-4);
  ctx.fillStyle='#0a2750';
  ctx.fillRect(-9,-7,5,7);
  ctx.fillRect(4,-7,5,7);
  ctx.restore();

  if(mode==='menu'){
    ctx.fillStyle='#b6d2ff';
    ctx.font='bold 20px Arial';
    ctx.textAlign='center';
    ctx.fillText('READY?',W/2,105);
    ctx.textAlign='left';
  }
}

function loop(now){
  const dt=Math.min((now-last)/1000,.025);
  last=now;
  update(dt);
  draw();

  if(mode==='playing'){
    raf=requestAnimationFrame(loop);
  }
}

function press(e){
  if(e)e.preventDefault();
  if(mode!=='playing')return;
  held=true;
  jump();
}

function release(e){
  if(e)e.preventDefault();
  held=false;
}

canvas.addEventListener('pointerdown',press);
window.addEventListener('pointerup',release);
window.addEventListener('pointercancel',release);

window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();

    if(mode==='playing'){
      if(!held)press(e);
    }else if(e.code==='Space'){
      start();
    }
  }
});

window.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowUp')release(e);
});

startBtn.addEventListener('click',start);
menuOnly.addEventListener('click',()=>showMenu('menu'));

$('menuBtn').addEventListener('click',()=>{
  cancelAnimationFrame(raf);
  showMenu('menu');
});

levelsBox.querySelectorAll('.level').forEach(b=>{
  b.addEventListener('click',()=>{
    selected=Number(b.dataset.level);
    refreshStats();
    draw();
  });
});

refreshStats();
updateOwnerButton();
makeLevel();
draw();

})();
</script>
</body>
 </html>
