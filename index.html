
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d22">
<title>Kyo Dash</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d22;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.app{width:min(100%,1000px);padding:10px;display:flex;flex-direction:column;gap:9px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:#b8d9ff}
.brand{color:#48eaff;font-size:17px;letter-spacing:2px}
.meter{height:7px;background:#172344;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#26dfff,#5cffba)}
canvas{width:100%;height:auto;aspect-ratio:900/420;display:block;border:1px solid #28477a;border-radius:12px;background:#0c1534;touch-action:none}
.hint{text-align:center;font-size:11px;color:#8da8d7}
.overlay{position:fixed;inset:0;z-index:5;background:#040817ee;display:flex;align-items:center;justify-content:center;padding:12px}
.panel{width:min(94vw,470px);max-height:94vh;overflow:auto;padding:20px;border:1px solid #3266a4;border-radius:22px;text-align:center;background:linear-gradient(150deg,#172754,#0a1026)}
.logo{font-size:42px;color:#45eaff;margin:0}
.sub{color:#b9c9f2;font-size:14px}
.profileBox{margin:14px 0;padding:12px;border:1px solid #2d4c79;border-radius:14px;background:#0b1733}
.profileLine{font-size:12px;color:#a9c4f2;margin:7px}
.rainbowNick{font-weight:1000;background:linear-gradient(90deg,#ff3158,#ffad35,#ffff55,#42ff9b,#35eaff,#a66bff,#ff48d1,#ff3158);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rainbow 2.5s linear infinite}
@keyframes rainbow{to{background-position:300% 50%}}
.nickRow{display:flex;gap:7px;margin-top:10px}
input{min-width:0;flex:1;background:#080f25;border:1px solid #355786;border-radius:9px;padding:10px;color:white}
button{border:0;border-radius:10px;padding:11px;background:#35e5ff;color:#071126;font-weight:900;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{transform:scale(.97)}
.nickSave{padding:9px}
.xpTrack{height:6px;background:#1a2b4d;border-radius:99px;overflow:hidden;margin-top:8px}
.xpFill{height:100%;width:0;background:linear-gradient(90deg,#35e5ff,#66ffb8)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
.level{background:#111b38;color:#d8e6ff;border:1px solid #304873}
.level.active{border-color:#35e3ff;background:#12314a}
.level small{display:block;font-size:10px;margin-top:4px}
.btn{width:100%;padding:13px;margin-top:8px;font-size:15px;background:linear-gradient(90deg,#2adfff,#65ffca)}
.secondary{background:#192747;color:#cde2ff;border:1px solid #344d79}
.stats{display:flex;justify-content:center;gap:18px;color:#9eb8e8;font-size:12px;margin:12px}
.hidden{display:none!important}
.small{font-size:11px;color:#8097c6;margin-top:10px}
.menuBtn{padding:7px;background:#111d3a;color:#bfe8ff;border:1px solid #294774;white-space:nowrap}
#errorBox{position:fixed;z-index:20;left:8px;right:8px;bottom:8px;background:#541b2b;color:white;padding:12px;border-radius:10px;font-size:12px;display:none;overflow-wrap:anywhere}
@media(max-width:420px){
 .app{padding:6px;gap:6px}
 .top{gap:5px;font-size:10px}
 .brand{font-size:14px;letter-spacing:1px}
 .menuBtn{font-size:10px;padding:7px 5px}
}
@media(max-height:540px){
 .app{gap:5px;padding:5px}
 .panel{padding:12px;max-height:96vh}
 .logo{font-size:32px}
 .profileBox{margin:7px 0;padding:8px}
 .levels{margin:8px 0}
 .stats{margin:7px}
}
</style>
</head>
<body>

<main class="app">
<header class="top">
<span class="brand">Kyo Dash</span>
<span id="levelLabel">EASY · 1</span>
<span id="progressText">0%</span>
<button class="menuBtn" id="musicBtn" data-action="music">♫ ВКЛ</button>
<button class="menuBtn" data-action="menu">МЕНЮ</button>
</header>
<div class="meter"><div class="fill" id="progressFill"></div></div>
<canvas id="game" width="900" height="420"></canvas>
<div class="hint">ТАП — ПРЫЖОК · УДЕРЖИВАЙ — АВТОПРЫЖОК</div>
</main>

<div class="overlay" id="overlay">
<section class="panel">
<h1 class="logo" id="panelTitle">Kyo Dash</h1>
<p class="sub" id="panelText">Прыгай через шипы и доберись до финиша!</p>

<div class="profileBox">
<div class="profileLine">ИГРОК: <strong id="profileNick">Player</strong></div>
<div class="profileLine">УРОВЕНЬ <strong id="profileLevel">1</strong> · XP <strong id="profileXp">0 / 250</strong></div>
<div class="xpTrack"><div class="xpFill" id="xpFill"></div></div>
<div class="nickRow">
<input id="nickInput" maxlength="16" placeholder="Твой ник">
<button class="nickSave" data-action="nick">СМЕНИТЬ</button>
</div>
<div class="small">Профиль и XP сохраняются на устройстве</div>
</div>

<div class="levels" id="levels">
<button class="level active" data-action="level" data-level="0">EASY<small>Stereo Madness</small></button>
<button class="level" data-action="level" data-level="1">MEDIUM<small>Jumper</small></button>
<button class="level" data-action="level" data-level="2">HARD<small>FingerDash</small></button>
</div>

<div class="stats">
<span>РЕКОРД <b id="best">0%</b></span>
<span>ПОБЕДЫ <b id="wins">0/3</b></span>
</div>

<button class="btn" id="startBtn" data-action="start">ИГРАТЬ</button>
<button class="btn secondary" data-action="owner">OWNER MODE</button>
<div class="small">У каждого уровня своя музыка и расстановка препятствий.</div>
</section>
</div>

<div id="errorBox"></div>

<script>
(function(){
'use strict';

var $=function(id){return document.getElementById(id)};
var canvas=$('game');
var ctx=canvas.getContext('2d');
var overlay=$('overlay');
var W=900,H=420,G=330,S=34;

var levels=[
 {name:'EASY',speed:285,jump:-555,gravity:1550,length:5700,gap:365},
 {name:'MEDIUM',speed:295,jump:-565,gravity:1600,length:6500,gap:305},
 {name:'HARD',speed:310,jump:-575,gravity:1650,length:7200,gap:265}
];

var patterns=[
 ['1','.','.','1','.','2','.','.','1','.','.','1','.','2','.','.','1','.','1','.','.','2','.','.','1','.','.','2','.','.','1','.'],
 ['1','.','2','.','1','.','C','.','2','.','1','.','.','2','.','C','1','.','2','.','1','.','C','.','2','.','1','.','2','.','.','1'],
 ['2','.','1','.','C','.','2','.','1','.','3','.','C','.','2','.','1','.','C','.','2','.','1','.','3','.','2','.','C','.','1','.']
];

var profile={nickname:'Player',xp:0,isDev:false};
var selected=0,mode='menu',world=0,progress=0,last=0,raf=0;
var held=false,obstacles=[];
var best=[0,0,0],wins=[false,false,false];
var p={x:150,y:G-S,vy:0,angle:0,onGround:true};
var ownerMode=false;

/* Три оригинальные синтезированные мелодии */
var musicEnabled=true;
var audioCtx=null;
var musicTimer=null;
var musicStep=0;
var musicGeneration=0;

var melodies=[
 {
  tempo:190,
  notes:[523,659,784,659,523,392,440,523,659,523,440,392,440,523,659,784,659,523,392,440,523,659,784,880,784,659,523,440,392,440,523,392],
  bass:[131,0,165,0,196,0,165,0],
  wave:'square'
 },
 {
  tempo:145,
  notes:[392,523,659,784,659,523,392,523,440,587,698,880,698,587,440,587,392,523,659,784,880,784,659,523,440,587,698,880,784,698,587,440],
  bass:[98,98,131,131,110,110,147,147],
  wave:'sawtooth'
 },
 {
  tempo:105,
  notes:[330,440,659,523,330,440,784,659,349,466,698,587,349,466,880,698,330,523,659,880,784,659,523,440,349,523,698,932,880,698,523,392],
  bass:[82,82,110,110,73,73,98,98],
  wave:'square'
 }
];

function initAudio(){
 if(audioCtx)return true;
 var AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return false;
 try{
  audioCtx=new AC();
  return true;
 }catch(e){
  return false;
 }
}

function playTone(freq,duration,wave,volume){
 if(!audioCtx||!freq||!musicEnabled)return;
 try{
  var osc=audioCtx.createOscillator();
  var gain=audioCtx.createGain();
  var now=audioCtx.currentTime;
  osc.type=wave||'square';
  osc.frequency.setValueAtTime(freq,now);
  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(volume||0.045,now+0.012);
  gain.gain.setTargetAtTime(0.0001,now+Math.max(0.025,duration*0.65),Math.max(0.015,duration*0.12));
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now+duration+0.06);
  osc.onended=function(){
   try{osc.disconnect();gain.disconnect()}catch(e){}
  };
 }catch(e){}
}

function musicTick(){
 if(!musicEnabled||mode!=='playing'||!audioCtx)return;
 var song=melodies[selected];
 var beat=song.tempo/1000;
 var note=song.notes[musicStep%song.notes.length];

 if(note)playTone(note,beat*0.9,song.wave,selected===2?0.035:0.04);

 if(musicStep%4===0){
  var bass=song.bass[Math.floor(musicStep/4)%song.bass.length];
  if(bass)playTone(bass,beat*2,'triangle',0.055);
 }
 musicStep++;
}

function startMusic(){
 stopMusic();
 if(!musicEnabled||mode!=='playing')return;
 if(!initAudio())return;

 musicGeneration++;
 var myGeneration=musicGeneration;
 musicStep=0;

 try{
  var result=audioCtx.resume();
  if(result&&result.catch)result.catch(function(){});
 }catch(e){}

 musicTick();
 musicTimer=setInterval(function(){
  if(myGeneration!==musicGeneration)return;
  musicTick();
 },melodies[selected].tempo);
}

function stopMusic(){
 musicGeneration++;
 if(musicTimer!==null){
  clearInterval(musicTimer);
  musicTimer=null;
 }
}

function updateMusicButton(){
 $('musicBtn').textContent=musicEnabled?'♫ ВКЛ':'♫ ВЫКЛ';
 $('musicBtn').style.color=musicEnabled?'#bfe8ff':'#ff9cae';
}

function safeGet(key,fallback){
 try{
  var v=localStorage.getItem(key);
  return v===null?fallback:v;
 }catch(e){return fallback}
}
function safeSet(key,value){
 try{localStorage.setItem(key,value)}catch(e){}
}
function loadData(){
 try{
  var d=JSON.parse(safeGet('kyoDashProfile','{}'));
  profile.xp=Number.isFinite(d.xp)&&d.xp>=0?Math.floor(d.xp):0;
  profile.isDev=d.isDev===true;
  profile.nickname=profile.isDev?'[DEV] Kyosuke':
   (typeof d.nickname==='string'&&d.nickname.trim()?d.nickname.trim().slice(0,16):'Player');
 }catch(e){}

 try{
  var b=JSON.parse(safeGet('kyoDashBest3','[0,0,0]'));
  if(Array.isArray(b)&&b.length===3)best=b.map(function(n){return Number(n)||0});
 }catch(e){}

 try{
  var w=JSON.parse(safeGet('kyoDashWins3','[false,false,false]'));
  if(Array.isArray(w)&&w.length===3)wins=w;
 }catch(e){}
}
function saveProfile(){
 safeSet('kyoDashProfile',JSON.stringify(profile));
 updateProfile();
}
function saveStats(){
 safeSet('kyoDashBest3',JSON.stringify(best));
 safeSet('kyoDashWins3',JSON.stringify(wins));
}
function updateProfile(){
 $('profileNick').textContent=profile.nickname;
 $('profileNick').classList.toggle('rainbowNick',profile.isDev);
 $('profileLevel').textContent=Math.floor(profile.xp/250)+1;
 $('profileXp').textContent=(profile.xp%250)+' / 250';
 $('xpFill').style.width=(profile.xp%250)/250*100+'%';
 if(document.activeElement!==$('nickInput'))$('nickInput').value=profile.nickname;
}
function refreshStats(){
 $('best').textContent=(best[selected]||0)+'%';
 $('wins').textContent=wins.filter(Boolean).length+'/3';
 document.querySelectorAll('[data-action="level"]').forEach(function(b,i){
  b.classList.toggle('active',i===selected);
 });
 $('levelLabel').textContent=levels[selected].name+' · '+(selected+1);
}
function addSpikes(x,count){
 for(var j=0;j<count;j++){
  obstacles.push({x:x+j*34,w:34,h:selected===2?42:38,type:'spike'});
 }
}

/* Генерация уровня с безопасным расстоянием между группами */
function makeLevel(){
 obstacles=[];
 var cfg=levels[selected];
 var pattern=patterns[selected];
 var x=540;
 var i=0;

 while(x<cfg.length-320){
  var symbol=pattern[i%pattern.length];
  var spacing=cfg.gap;

  if(selected===0)spacing+=[55,80,40,95,65][i%5];
  else if(selected===1)spacing+=[25,45,15,55,30][i%5];
  else spacing+=[8,25,12,32,5][i%5];

  var minimumGap=selected===0?350:selected===1?335:330;
  spacing=Math.max(spacing,minimumGap);

  if(symbol==='1'||symbol==='2'||symbol==='3'){
   addSpikes(x,Number(symbol));
  }
  x+=spacing;
  i++;
 }

 obstacles.push({x:cfg.length-120,w:12,h:80,type:'finish'});
}

function updateHud(){
 progress=Math.min(100,Math.floor(world/(levels[selected].length-120)*100));
 $('progressText').textContent=progress+'%';
 $('progressFill').style.width=progress+'%';

 if(progress>best[selected]){
  best[selected]=progress;
  $('best').textContent=progress+'%';
  saveStats();
 }
}
function reset(){
 world=0;
 progress=0;
 held=false;
 p.y=G-S;
 p.vy=0;
 p.angle=0;
 p.onGround=true;
 makeLevel();
 updateHud();
}
function showMenu(kind){
 kind=kind||'menu';
 stopMusic();
 mode=kind;
 held=false;
 overlay.classList.remove('hidden');
 $('levels').classList.toggle('hidden',kind==='dead'||kind==='win');

 if(kind==='dead'){
  $('panelTitle').textContent='УПС!';
  $('panelText').textContent='Прогресс: '+progress+'%. Попробуй ещё раз!';
  $('startBtn').textContent='ЕЩЁ РАЗ';
 }else if(kind==='win'){
  $('panelTitle').textContent='УРОВЕНЬ ПРОЙДЕН!';
  $('panelText').textContent='Отлично! Уровень '+levels[selected].name+' пройден.';
  $('startBtn').textContent='ИГРАТЬ СНОВА';
 }else{
  $('panelTitle').textContent='Kyo Dash';
  $('panelText').textContent='Прыгай через шипы и доберись до финиша!';
  $('startBtn').textContent='ИГРАТЬ';
 }

 updateProfile();
 refreshStats();
 draw();
}
function start(){
 if(raf)cancelAnimationFrame(raf);
 reset();
 mode='playing';
 overlay.classList.add('hidden');
 last=performance.now();
 startMusic();
 raf=requestAnimationFrame(loop);
}
function jump(){
 if(mode==='playing'&&p.onGround){
  p.vy=levels[selected].jump;
  p.onGround=false;
 }
}
function die(){
 if(mode!=='playing')return;
 mode='dead';
 held=false;
 stopMusic();
 if(raf)cancelAnimationFrame(raf);
 raf=0;
 showMenu('dead');
}
function win(){
 if(mode!=='playing')return;
 mode='win';
 held=false;
 progress=100;
 stopMusic();
 $('progressText').textContent='100%';
 $('progressFill').style.width='100%';
 best[selected]=100;

 if(!wins[selected]){
  profile.xp+=[100,150,200][selected];
  saveProfile();
 }
 wins[selected]=true;
 saveStats();
 showMenu('win');
}
function update(dt){
 if(mode!=='playing')return;

 var cfg=levels[selected];
 world+=cfg.speed*dt;
 p.vy+=cfg.gravity*dt;
 p.y+=p.vy*dt;

 if(p.y>=G-S){
  p.y=G-S;
  p.vy=0;
  p.onGround=true;
  p.angle=Math.round(p.angle/(Math.PI/2))*(Math.PI/2);
  if(held)jump();
 }else{
  p.onGround=false;
  p.angle+=cfg.speed*dt/S*(Math.PI/2);
 }

 updateHud();

 for(var i=0;i<obstacles.length;i++){
  var o=obstacles[i],ox=o.x-world;
  if(ox>p.x+100||ox+o.w<p.x-80)continue;

  if(o.type==='finish'){
   if(ox<p.x+S*.6){win();return}
   continue;
  }

  var px1=p.x+5,px2=p.x+S-5;
  var py1=p.y+5,py2=p.y+S-3;
  var left=Math.max(px1,ox),right=Math.min(px2,ox+o.w);
  if(left>=right)continue;

  var center=ox+o.w/2;
  var sx=Math.max(ox,Math.min(center,(left+right)/2));
  var surfaceY=G-o.h*(1-Math.abs(sx-center)/(o.w/2));

  if(py2>surfaceY+2&&py1<G){die();return}
 }
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#0a1230';
 ctx.fillRect(0,0,W,H);

 var grad=ctx.createLinearGradient(0,0,0,G);
 grad.addColorStop(0,'#111e48');
 grad.addColorStop(1,'#0a1530');
 ctx.fillStyle=grad;
 ctx.fillRect(0,0,W,G);

 ctx.strokeStyle='#213865';
 ctx.lineWidth=1;
 var off=-(world*.3%45);
 for(var x=off;x<W;x+=45){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,G);
  ctx.stroke();
 }
 for(var y=22;y<G;y+=45){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(W,y);
  ctx.stroke();
 }
 for(var i=0;i<26;i++){
  var sx=(i*137-world*.12%900+900)%900;
  var sy=(i*71)%285;
  ctx.fillStyle='#668ac5';
  ctx.fillRect(sx,sy,2,2);
 }

 ctx.fillStyle='#14264c';
 ctx.fillRect(0,G,W,H-G);
 ctx.fillStyle='#36e8ff';
 ctx.fillRect(0,G,W,4);
 for(x=-(world%50);x<W;x+=50){
  ctx.fillStyle='#2b4779';
  ctx.fillRect(x,G+16,25,4);
 }

 for(i=0;i<obstacles.length;i++){
  var o=obstacles[i],ox=o.x-world;
  if(ox<-100||ox>W+100)continue;

  if(o.type==='spike'){
   ctx.fillStyle=selected===2?'#ff3d8c':selected===1?'#ff6c68':'#ff4d83';
   ctx.beginPath();
   ctx.moveTo(ox,G);
   ctx.lineTo(ox+o.w/2,G-o.h);
   ctx.lineTo(ox+o.w,G);
   ctx.closePath();
   ctx.fill();
   ctx.strokeStyle='#ffb2cb';
   ctx.lineWidth=2;
   ctx.stroke();
  }else if(o.type==='finish'){
   ctx.fillStyle='#4dffb4';
   ctx.fillRect(ox,G-o.h,8,o.h);
   ctx.fillStyle='#e6fff5';
   ctx.font='bold 18px Arial';
   ctx.fillText('FINISH',ox-26,G-o.h-12);
  }
 }

 ctx.save();
 ctx.translate(p.x+S/2,p.y+S/2);
 ctx.rotate(p.angle);
 ctx.shadowColor='#00dfff';
 ctx.shadowBlur=14;
 ctx.fillStyle='#35e7ff';
 ctx.fillRect(-S/2,-S/2,S,S);
 ctx.shadowBlur=0;
 ctx.strokeStyle='#d8fcff';
 ctx.lineWidth=3;
 ctx.strokeRect(-S/2+2,-S/2+2,S-4,S-4);
 ctx.fillStyle='#0a2750';
 ctx.fillRect(-9,-7,5,7);
 ctx.fillRect(4,-7,5,7);
 ctx.restore();

 if(mode!=='playing'){
  ctx.fillStyle='#b6d2ff';
  ctx.font='bold 20px Arial';
  ctx.textAlign='center';
  ctx.fillText('READY?',W/2,105);
  ctx.textAlign='left';
 }
}
function loop(now){
 var dt=Math.min((now-last)/1000,.025);
 last=now;
 update(dt);
 draw();
 if(mode==='playing')raf=requestAnimationFrame(loop);
 else raf=0;
}

function handleAction(action,button){
 if(action==='start'){
  start();
  return;
 }

 if(action==='music'){
  musicEnabled=!musicEnabled;
  updateMusicButton();
  if(musicEnabled&&mode==='playing')startMusic();
  else stopMusic();
  return;
 }

 if(action==='menu'){
  if(raf)cancelAnimationFrame(raf);
  raf=0;
  showMenu('menu');
  return;
 }

 if(action==='level'){
  var next=Number(button.getAttribute('data-level'));
  if(!Number.isFinite(next)||next<0||next>2)return;

  selected=next;
  reset();
  refreshStats();
  draw();

  /* Если уровень меняют во время игры,
     музыка сразу переключается на его мелодию. */
  if(mode==='playing')startMusic();
  return;
 }

 if(action==='nick'){
  if(profile.isDev){
   alert('DEV-ник закреплён.');
   updateProfile();
   return;
  }
  var nick=$('nickInput').value.trim();
  if(nick.length<2){
   alert('Ник должен содержать минимум 2 символа.');
   return;
  }
  profile.nickname=nick.slice(0,16);
  saveProfile();
  return;
 }

 if(action==='owner'){
  if(ownerMode){
   alert('Owner Mode уже активирован!');
   return;
  }

  var pin=prompt('Введите PIN владельца:');
  if(pin===null)return;

  var pins=[
   'OwnerKD-ADS5H-D6E9F037F7',
   'KenanDrun-AJ9S3L6KS9-8H67HSK',

/* Обработчик кнопок: работает и на сенсорном экране */
function buttonHandler(e){
 var target=e.target;
 if(!target||!target.closest)return;

 var button=target.closest('button[data-action]');
 if(!button)return;

 e.preventDefault();
 e.stopPropagation();

 try{
  handleAction(button.getAttribute('data-action'),button);
 }catch(err){
  showError(err);
 }
}

document.addEventListener('click',buttonHandler,true);

/* Сенсорное управление кубиком */
function press(e){
 if(mode!=='playing')return;
 if(e.cancelable)e.preventDefault();
 if(!held){
  held=true;
  jump();
 }
}
function release(e){
 held=false;
 if(e&&e.cancelable)e.preventDefault();
}

canvas.addEventListener('pointerdown',press,{passive:false});
window.addEventListener('pointerup',release);
window.addEventListener('pointercancel',release);
window.addEventListener('blur',release);

window.addEventListener('keydown',function(e){
 if(e.code==='Space'||e.code==='ArrowUp'){
  e.preventDefault();
  if(mode==='playing'){
   if(!held){
    held=true;
    jump();
   }
  }else if(e.code==='Space'){
   start();
  }
 }
});

window.addEventListener('keyup',function(e){
 if(e.code==='Space'||e.code==='ArrowUp')held=false;
});

function showError(err){
 var box=$('errorBox');
 box.style.display='block';
 box.textContent='Ошибка игры: '+(err&&err.message?err.message:String(err));
}

window.addEventListener('error',function(e){
 showError(e.error||e.message||'Неизвестная ошибка');
});

loadData();
updateProfile();
refreshStats();
updateMusicButton();
reset();
showMenu('menu');

})();
</script>
