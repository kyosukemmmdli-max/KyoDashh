
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d22">
<title>Kyo Dash</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d22;color:#f3f7ff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.app{width:min(100%,1000px);padding:10px;display:flex;flex-direction:column;gap:9px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:bold;color:#b8d9ff}
.brand{color:#48eaff;font-size:17px;letter-spacing:2px}
.meter{height:7px;background:#172344;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#26dfff,#5cffba)}
canvas{width:100%;height:auto;aspect-ratio:900/420;display:block;border:1px solid #28477a;border-radius:12px;background:#0c1534;touch-action:none}
.hint{text-align:center;font-size:11px;color:#8da8d7}
.overlay{position:fixed;inset:0;z-index:5;background:#040817ef;display:flex;align-items:center;justify-content:center;padding:12px}
.panel{width:min(94vw,470px);max-height:96vh;overflow:auto;padding:20px;border:1px solid #3266a4;border-radius:22px;text-align:center;background:linear-gradient(150deg,#172754,#0a1026)}
.logo{font-size:clamp(36px,10vw,58px);font-weight:1000;letter-spacing:3px;color:#45eaff;margin:0}
.sub{color:#b9c9f2;line-height:1.5;font-size:14px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.level{border:1px solid #304873;border-radius:12px;padding:12px 4px;background:#111b38;color:#d8e6ff;font-weight:900}
.level small{display:block;color:#90a7d4;margin-top:5px}
.level.active{border-color:#35e3ff;background:#12314a}
.btn{border:0;border-radius:12px;padding:13px;background:linear-gradient(90deg,#2adfff,#65ffca);color:#071126;font-weight:1000;font-size:16px;width:100%}
.secondary{margin-top:9px;background:#192747;color:#cde2ff;border:1px solid #344d79}
.small{font-size:11px;color:#8097c6;margin-top:10px}
.hidden{display:none!important}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:#9eb8e8;font-size:12px;margin:12px 0}
.stats b{color:white}
.profileBox{margin:12px 0;padding:12px;border:1px solid #2d4c79;border-radius:14px;background:#0b1733}
.profileLine{font-size:12px;color:#a9c4f2;margin:6px 0}
.profileLine strong{color:#47eaff}
.nickRow{display:flex;gap:7px;margin-top:10px}
.nickInput{min-width:0;flex:1;background:#080f25;border:1px solid #355786;border-radius:9px;padding:10px;color:white;font-size:14px}
.nickSave{border:0;border-radius:9px;padding:9px 11px;background:#35e5ff;color:#071126;font-weight:900}
.xpTrack{height:7px;border-radius:99px;background:#1a2b4d;overflow:hidden;margin-top:9px}
.xpFill{height:100%;width:0;background:linear-gradient(90deg,#35e5ff,#66ffb8)}
.menuBtn{border:1px solid #294774;background:#111d3a;color:#bfe8ff;border-radius:9px;padding:6px 10px;font-weight:bold}
</style>
</head>
<body>
<main class="app">
<header class="top">
<span class="brand">Kyo Dash</span>
<span id="levelLabel">EASY · 1</span>
<span id="progressText">0%</span>
<button class="menuBtn" id="menuBtn">МЕНЮ</button>
</header>
<div class="meter"><div class="fill" id="progressFill"></div></div>
<canvas id="game" width="900" height="420"></canvas>
<div class="hint">ТАП — ПРЫЖОК · УДЕРЖИВАЙ — АВТОПРЫЖКИ</div>
</main>

<div class="overlay" id="overlay">
<section class="panel">
<h1 class="logo" id="panelTitle">KYO DASH</h1>
<p class="sub" id="panelText">Прыгай через шипы и доберись до финиша!</p>

<div class="profileBox">
<div class="profileLine">НИК: <strong id="profileNick">Player</strong></div>
<div class="profileLine">УРОВЕНЬ ИГРОКА: <strong id="profileLevel">1</strong></div>
<div class="profileLine">ОПЫТ: <strong id="profileXp">0 / 250 XP</strong></div>
<div class="xpTrack"><div class="xpFill" id="xpFill"></div></div>
<div class="nickRow">
<input class="nickInput" id="nickInput" maxlength="16" placeholder="Введи новый ник">
<button class="nickSave" id="nickSave">СМЕНИТЬ</button>
</div>
<div class="small">Ник и опыт сохраняются на устройстве</div>
</div>

<div class="levels" id="levels">
<button class="level active" data-level="0">EASY<small>Легко</small></button>
<button class="level" data-level="1">MEDIUM<small>Средне</small></button>
<button class="level" data-level="2">HARD<small>Сложно</small></button>
</div>

<div class="stats">
<span>РЕКОРД <b id="best">0%</b></span>
<span>ПРОЙДЕНО <b id="wins">0/3</b></span>
</div>
<button class="btn" id="startBtn">ИГРАТЬ</button>
<button class="btn secondary" id="ownerBtn">OWNER MODE</button>
<button class="btn secondary hidden" id="menuOnly">ВЫБОР УРОВНЯ</button>
<div class="small">KYO DASH · PLAYER PROFILE</div>
</section>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false});
const overlay=$('overlay'),levelsBox=$('levels');

const W=900,H=420,G=330,S=34;
const LEVELS=[
{name:'EASY',speed:275,jump:-590,gravity:1650,length:5100,gap:300},
{name:'MEDIUM',speed:300,jump:-600,gravity:1700,length:5900,gap:250},
{name:'HARD',speed:320,jump:-610,gravity:1750,length:6500,gap:215}
];

let selected=0,mode='menu',world=0,progress=0,last=0,raf=0;
let held=false,obstacles=[],best=[0,0,0],wins=[false,false,false];
let ownerMode=false;

const profileNickEl=$('profileNick');
const profileLevelEl=$('profileLevel');
const profileXpEl=$('profileXp');
const xpFillEl=$('xpFill');
const nickInput=$('nickInput');

let profile={nickname:'Player',xp:0};

try{
const saved=JSON.parse(localStorage.getItem('kyoDashProfile')||'{}');
if(typeof saved.nickname==='string'&&saved.nickname.trim())
profile.nickname=saved.nickname.trim().slice(0,16);
if(Number.isFinite(saved.xp)&&saved.xp>=0)
profile.xp=Math.floor(saved.xp);
}catch(e){}

function saveProfile(){
try{localStorage.setItem('kyoDashProfile',JSON.stringify(profile))}catch(e){}
updateProfile();
}

function updateProfile(){
const level=Math.floor(profile.xp/250)+1;
const xpIntoLevel=profile.xp%250;
profileNickEl.textContent=profile.nickname;
profileLevelEl.textContent=level;
profileXpEl.textContent=xpIntoLevel+' / 250 XP';
xpFillEl.style.width=(xpIntoLevel/250*100)+'%';
if(document.activeElement!==nickInput)nickInput.value=profile.nickname;
}

function awardXP(amount){
profile.xp+=amount;
saveProfile();
}

const OWNER_PINS=[
'OwnerKD-ADS5H-D6E9F037F7',
'KenanDrun-AJ9S3L6KS9-8H67HSK'
];

function getDeviceId(){
let id=localStorage.getItem('kyodash-device-id');
if(!id){
id=(crypto.randomUUID?crypto.randomUUID():
Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
localStorage.setItem('kyodash-device-id',id);
}
return id;
}

function activateOwner(pin){
pin=pin.trim();
if(!OWNER_PINS.includes(pin)){
alert('Неверный PIN!');
return false;
}
const key='kyodash-owner-device-'+pin;
const deviceId=getDeviceId();
const savedDevice=localStorage.getItem(key);
if(savedDevice&&savedDevice!==deviceId){
alert('Этот PIN уже привязан к другому браузеру!');
return false;
}
localStorage.setItem(key,deviceId);
ownerMode=true;
alert('Owner Mode активирован!');
return true;
}

try{
best=JSON.parse(localStorage.getItem('kyoDashBest3')||'[0,0,0]');
wins=JSON.parse(localStorage.getItem('kyoDashWins3')||'[false,false,false]');
if(!Array.isArray(best)||best.length!==3)best=[0,0,0];
if(!Array.isArray(wins)||wins.length!==3)wins=[false,false,false];
}catch(e){best=[0,0,0];wins=[false,false,false]}

const p={x:150,y:G-S,vy:0,angle:0,onGround:true,size:S};

function save(){
try{
localStorage.setItem('kyoDashBest3',JSON.stringify(best));
localStorage.setItem('kyoDashWins3',JSON.stringify(wins));
}catch(e){}
}

function refreshStats(){
$('best').textContent=(best[selected]||0)+'%';
$('wins').textContent=wins.filter(Boolean).length+'/3';
document.querySelectorAll('.level').forEach((b,i)=>b.classList.toggle('active',i===selected));
$('levelLabel').textContent=LEVELS[selected].name+' · '+(selected+1);
}

function addSpike(x,count=1){
for(let i=0;i<count;i++)
obstacles.push({x:x+i*37,w:37,h:37,type:'spike'});
}

function makeLevel(){
obstacles=[];
const cfg=LEVELS[selected];
let x=590,idx=0;

while(x<cfg.length-260){
const pattern=(idx*7+selected*3)%7;
if(selected===0){
if(pattern===3)addSpike(x,2);
else addSpike(x,1);
}else if(selected===1){
if(pattern===0||pattern===4||pattern===6)addSpike(x,2);
else addSpike(x,1);
}else{
if(pattern===0||pattern===3||pattern===6)addSpike(x,2);
else if(pattern===2)addSpike(x,3);
else addSpike(x,1);
}
x+=cfg.gap+(pattern%3)*24;
idx++;
}
obstacles.push({x:cfg.length-130,w:12,h:80,type:'finish'});
}

function reset(){
world=0;progress=0;held=false;
p.y=G-S;p.vy=0;p.angle=0;p.onGround=true;
makeLevel();updateHud();
}

function updateHud(){
progress=Math.min(100,Math.floor(world/(LEVELS[selected].length-130)*100));
$('progressText').textContent=progress+'%';
$('progressFill').style.width=progress+'%';
if(progress>best[selected]){
best[selected]=progress;
$('best').textContent=progress+'%';
save();
}
}

function showMenu(kind='menu'){
mode=kind;held=false;
overlay.classList.remove('hidden');
levelsBox.classList.toggle('hidden',kind==='dead'||kind==='win');
$('menuOnly').classList.toggle('hidden',kind==='menu');

if(kind==='dead'){
$('panelTitle').textContent='УПС!';
$('panelText').textContent='Прогресс: '+progress+'%. Попробуй ещё раз!';
$('startBtn').textContent='ЕЩЁ РАЗ';
}else if(kind==='win'){
$('panelTitle').textContent='УРОВЕНЬ ПРОЙДЕН!';
$('panelText').textContent='Ты прошёл уровень '+LEVELS[selected].name+'!';
$('startBtn').textContent='ИГРАТЬ СНОВА';
}else{
$('panelTitle').textContent='KYO DASH';
$('panelText').textContent='Прыгай через шипы и доберись до финиша!';
$('startBtn').textContent='ИГРАТЬ';
$('menuOnly').classList.add('hidden');
}
refreshStats();
updateProfile();
draw();
}

function start(){
cancelAnimationFrame(raf);
reset();mode='playing';
overlay.classList.add('hidden');
last=performance.now();
raf=requestAnimationFrame(loop);
}

function jump(){
if(mode==='playing'&&p.onGround){
p.vy=LEVELS[selected].jump;
p.onGround=false;
}
}

function die(){
if(mode!=='playing')return;
mode='dead';held=false;showMenu('dead');
}

function win(){
if(mode!=='playing')return;
mode='win';held=false;progress=100;
$('progressText').textContent='100%';
$('progressFill').style.width='100%';
best[selected]=100;

if(!wins[selected])awardXP([100,150,200][selected]);
wins[selected]=true;
save();refreshStats();showMenu('win');
}

function update(dt){
if(mode!=='playing')return;
const cfg=LEVELS[selected];
world+=cfg.speed*dt;
p.vy+=cfg.gravity*dt;
p.y+=p.vy*dt;

if(p.y>=G-S){
p.y=G-S;p.vy=0;
if(!p.onGround){
p.onGround=true;
p.angle=Math.round(p.angle/(Math.PI/2))*(Math.PI/2);
if(held)jump();
}else if(held)jump();
}else{
p.onGround=false;
p.angle+=cfg.speed*dt/S*(Math.PI/2);
}

updateHud();

const px=p.x,py=p.y,s=S;
for(const o of obstacles){
const ox=o.x-world;
if(ox>px+90||ox+o.w<px-80)continue;

if(o.type==='finish'){
if(ox<px+s*.6){win();return;}
}else{
const left=Math.max(px+4,ox);
const right=Math.min(px+s-4,ox+o.w);
if(left<right&&py+s>G-o.h){
const center=ox+o.w/2;
const nearest=center<left?left:(center>right?right:center);
const surfaceY=G-o.h*(1-Math.abs(nearest-center)/(o.w/2));
if(py+s-3>surfaceY&&py<G){die();return;}
}
}
}
}

function draw(){
ctx.fillStyle='#0a1230';
ctx.fillRect(0,0,W,H);

const grad=ctx.createLinearGradient(0,0,0,G);
grad.addColorStop(0,'#111e48');
grad.addColorStop(1,'#0a1530');
ctx.fillStyle=grad;ctx.fillRect(0,0,W,G);

ctx.strokeStyle='#213865';ctx.lineWidth=1;
const off=-(world*.3%45);
for(let x=off;x<W;x+=45){
ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,G);ctx.stroke();
}
for(let y=22;y<G;y+=45){
ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
}

for(let i=0;i<26;i++){
let sx=(i*137-world*.12%900+900)%900,sy=(i*71)%285;
ctx.fillStyle='#668ac5';ctx.fillRect(sx,sy,2,2);
}

ctx.fillStyle='#14264c';ctx.fillRect(0,G,W,H-G);
ctx.fillStyle='#36e8ff';ctx.fillRect(0,G,W,4);
for(let x=-(world%50);x<W;x+=50){
ctx.fillStyle='#2b4779';ctx.fillRect(x,G+16,25,4);
}

for(const o of obstacles){
const x=o.x-world;
if(x<-70||x>W+70)continue;

if(o.type==='spike'){
ctx.fillStyle=selected===2?'#ff3d8c':'#ff4d83';
ctx.beginPath();ctx.moveTo(x,G);
ctx.lineTo(x+o.w/2,G-o.h);
ctx.lineTo(x+o.w,G);ctx.closePath();ctx.fill();
ctx.strokeStyle='#ffb2cb';ctx.lineWidth=2;ctx.stroke();
}else{
ctx.fillStyle='#4dffb4';ctx.fillRect(x,G-o.h,8,o.h);
ctx.fillStyle='#e6fff5';ctx.font='bold 18px Arial';
ctx.fillText('FINISH',x-26,G-o.h-12);
}
}

ctx.save();
ctx.translate(p.x+S/2,p.y+S/2);
ctx.rotate(p.angle);
ctx.shadowColor='#00dfff';ctx.shadowBlur=14;
ctx.fillStyle='#35e7ff';ctx.fillRect(-S/2,-S/2,S,S);
ctx.shadowBlur=0;ctx.strokeStyle='#d8fcff';ctx.lineWidth=3;
ctx.strokeRect(-S/2+2,-S/2+2,S-4,S-4);
ctx.fillStyle='#0a2750';
ctx.fillRect(-9,-7,5,7);ctx.fillRect(4,-7,5,7);
ctx.restore();
}

function loop(now){
const dt=Math.min((now-last)/1000,.025);
last=now;update(dt);draw();
if(mode==='playing')raf=requestAnimationFrame(loop);
}

function press(e){
if(e)e.preventDefault();
if(mode!=='playing')return;
held=true;jump();
}
function release(e){if(e)e.preventDefault();held=false;}

canvas.addEventListener('pointerdown',press);
window.addEventListener('pointerup',release);
window.addEventListener('pointercancel',release);

window.addEventListener('keydown',e=>{
if(e.code==='Space'||e.code==='ArrowUp'){
e.preventDefault();
if(mode==='playing'){if(!held)press(e);}
else if(e.code==='Space')start();
}
});
window.addEventListener('keyup',e=>{
if(e.code==='Space'||e.code==='ArrowUp')release(e);
});

$('nickSave').addEventListener('click',()=>{
const nick=nickInput.value.trim();
if(!nick){alert('Введи ник!');return;}
if(nick.length<2){alert('Ник должен содержать минимум 2 символа.');return;}
profile.nickname=nick.slice(0,16);
saveProfile();
alert('Ник изменён на '+profile.nickname+'!');
});
nickInput.addEventListener('keydown',e=>{
if(e.key==='Enter')$('nickSave').click();
});

$('startBtn').addEventListener('click',start);
$('ownerBtn').addEventListener('click',()=>{
if(ownerMode){ownerMode=false;alert('Owner Mode выключен');return;}
const pin=prompt('Введите PIN владельца:');
if(pin!==null)activateOwner(pin);
});
$('menuOnly').addEventListener('click',()=>showMenu('menu'));
$('menuBtn').addEventListener('click',()=>{
cancelAnimationFrame(raf);showMenu('menu');
});
levelsBox.querySelectorAll('.level').forEach(b=>{
b.addEventListener('click',()=>{
selected=Number(b.dataset.level);refreshStats();draw();
});
});

refreshStats();updateProfile();makeLevel();draw();
})();
</script>
</body>
  </html>
